# Development-only proxy: reachable on localhost:8180 in the API namespace.
# The host browser reaches Keycloak via the original localhost:8180 port binding.
# Do not attach this configuration to a production deployment.
server {
    listen 127.0.0.1:8180;
    server_name localhost;

    location / {
        proxy_pass http://keycloak:8080;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:8180;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host localhost:8180;
        proxy_set_header X-Forwarded-Port 8180;
        proxy_redirect off;
    }
}
