# Reuse task outputs (e.g. Kotlin compilation) from the local/CI build cache when
# inputs are identical. The PostgreSQL-backed `test` task opts out in build.gradle.kts.
org.gradle.caching=true

# Maven Central sometimes drops a request on the CI runners ("Could not get resource …pom", 2 failed runs in a week).
# Retry dependency downloads more often and with a longer pause than Gradle's default (3 tries, 1 s).
systemProp.org.gradle.internal.repository.max.retries=6
systemProp.org.gradle.internal.repository.initial.backoff=2000
