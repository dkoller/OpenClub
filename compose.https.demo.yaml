# Synthetic-data-only HTTPS reference overlay. Requires a real HTTPS OIDC
# provider, a publicly reachable DNS name, and operator-supplied secrets.
# Never include development Keycloak or its embedded database in this setup.
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique database password before startup}
    ports: !reset []
    restart: unless-stopped
  api:
    environment:
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique database password before startup}
      OPENCLUB_AUTH_MODE: production
      OPENCLUB_PUBLIC_ORIGIN: https://${OPENCLUB_DEMO_HOST:?Set a public DNS hostname}
      OPENCLUB_OIDC_ISSUER: ${OPENCLUB_OIDC_ISSUER:?Set an HTTPS OIDC issuer}
      OPENCLUB_OIDC_AUTHORIZATION_ENDPOINT: ${OPENCLUB_OIDC_AUTHORIZATION_ENDPOINT:?Set the HTTPS authorization endpoint}
      OPENCLUB_OIDC_CLIENT_ID: ${OPENCLUB_OIDC_CLIENT_ID:?Set a confidential OIDC client ID}
      OPENCLUB_OIDC_CLIENT_SECRET: ${OPENCLUB_OIDC_CLIENT_SECRET:?Provide a secret of at least 32 characters}
      OPENCLUB_OIDC_REDIRECT_URI: https://${OPENCLUB_DEMO_HOST:?Set a public DNS hostname}/api/v1/auth/callback
      # Push notifications (OpenAPI 1.33.0): empty until configure-demo-push.sh writes them, so push stays off.
      OPENCLUB_PUSH_PUBLIC_KEY: ${OPENCLUB_PUSH_PUBLIC_KEY:-}
      OPENCLUB_PUSH_PRIVATE_KEY: ${OPENCLUB_PUSH_PRIVATE_KEY:-}
      OPENCLUB_PUSH_SUBJECT: ${OPENCLUB_PUSH_SUBJECT:-}
      OPENCLUB_PUSH_HOSTS: ${OPENCLUB_PUSH_HOSTS:-}
    restart: unless-stopped
  web:
    # Only the TLS ingress is reachable from the host; no alternate HTTP app port.
    ports: !reset []
    restart: unless-stopped
  demo-https:
    image: caddy:2.11.9-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      OPENCLUB_DEMO_HOST: ${OPENCLUB_DEMO_HOST:?Set a public DNS hostname}
    volumes:
      - ./dev/deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - demo_tls_data:/data
      - demo_tls_config:/config
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

volumes:
  demo_tls_data:
  demo_tls_config:
