openapi: 3.1.0
info:
  title: OpenClub single-club management API — working draft
  version: 0.0.0-draft
  description: >
    WORKING DRAFT: narrow synthetic M1 routes are implemented, but full private-field and real-data contracts remain unapproved.
    Anonymous GET /v1/public/members, authenticated GET /v1/club and the
    separately documented /v1/auth routes are implemented. The owner approved
    the minimum M1 technical member contract (#13) and public name policy (#12).
    Member name listing, accountless create, minimal detail, name-only PATCH
    and archive now have authenticated, capability-checked HTTP implementations.
    Private full-details replacement and reactivation remain draft;
    role, team and grant operations have narrow synthetic HTTP boundaries; independent security and real-data review remain. Full
    confidential member, team and grant access still needs separate approval.
    Bootstrap and emergency admin recovery are offline operator-only commands,
    never HTTP APIs. Exactly one
    club exists per installation; no clubId tenant selector or switcher exists.
    Never treat the browser session alone as permission to read personal data.
servers:
  - url: /api
security:
  - browserSession: []
tags:
  - name: Club
  - name: Members
  - name: Teams
  - name: Permissions
paths:
  /v1/club:
    get:
      tags: [Club]
      operationId: readMyClub
      summary: Read the single installation club after authorized login
      description: >
        Implemented session-linked response: local club UUID, name, slug and
        genderRequiredForPlayers boolean for an active linked member only. Authentication alone is insufficient;
        this read never authorizes club settings writes or private member data.
      responses:
        '200':
          description: Current installation's ID, name, slug and player-gender requirement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubReference'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      tags: [Club]
      operationId: updateMyClubName
      summary: Update only the singleton club name (synthetic M1)
      description: >
        A verified, active, identity-bound ADMIN with an explicit current
        MANAGE_PERMISSIONS club grant may update the name only. Exact Origin and
        session CSRF token required. No slug, age or gender-policy writes.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '204':
          description: Club name changed
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/club/player-gender-policy:
    patch:
      tags: [Club]
      operationId: setPlayerGenderRequirement
      summary: Configure requirement for player gender in synthetic M1
      description: >
        Verified active identity-bound ADMIN with explicit MANAGE_PERMISSIONS,
        matching Origin and session CSRF. Only a boolean flag is accepted;
        existing players missing gender block enabling this rule under the
        database's serialized member/policy constraints. No gender values are
        returned and this is not production privacy approval.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [genderRequiredForPlayers]
              properties:
                genderRequiredForPlayers: { type: boolean }
      responses:
        '204':
          description: Policy updated
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/public/members:
    get:
      tags: [Members]
      operationId: listPublicMemberNames
      summary: Anonymous active-member display-name list (IMPLEMENTED)
      security: []
      description: >
        Owner-approved synthetic M1 public display: adult 'Peter Smith',
        minor 'Peter S.'. Determine minor status server-side using stored DOB,
        current date and configured adult threshold. Each item contains ONLY
        a displayName; no local UUID, full minor surname, DOB, age, contact,
        gender, role, account link or team grant. Exclude archived members.
        No full-surname search, identifiers or raw-name cursor may leak
        unmasked minors' surnames; any future search/pagination requires
        separate inference-resistant contract review. Current implementation
        returns the complete active list, with no search or cursor parameters.
        This is NOT approval to publish real personal data.
      responses:
        '200':
          description: Public names of active synthetic members, safely displayed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicMemberName'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/members:
    get:
      tags: [Members]
      operationId: listLocalMembers
      summary: Authorized member search (IMPLEMENTED)
      description: >
        This authenticated, full-name/UUID administration directory is distinct
        from the anonymous /v1/public/members display-name list. Linked club
        members need explicit VIEW_MEMBER_DIRECTORY permission; login alone
        grants nothing. Never expose its full minor surnames or UUIDs through
        the public route. No DOB, gender, contacts, account IDs or grants.
        Opaque cursor represents a stable (lastName, firstName, id) ordering
        and is bound to the filter and caller's permission; stale or invalid
        cursors return 400.
      parameters:
        - name: q
          in: query
          description: Optional name search; empty q is accepted as an unfiltered directory read. No email or DOB search.
          schema: { type: string, maxLength: 100 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          description: Opaque server-issued page cursor; never encode PII in cleartext.
          schema: { type: string, minLength: 1, maxLength: 2048 }
      responses:
        '200':
          description: Bounded page containing privacy-minimized members only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags: [Members]
      operationId: addLocalMember
      summary: Accountless member creation (IMPLEMENTED)
      description: >
        Requires an explicitly authorized club-level member-write capability,
        exact configured Origin, session-bound X-CSRF-Token and JSON Content-Type.
        A verified login or legacy ADMIN label alone does not approve future
        configurable delegation. All members require DOB; adults require both
        email and phone; gender is required only for players when the club
        enables the policy. Adult age threshold is installation-local and
        provisionally defaults to 18; R03 must approve threshold and access.
        Never match an existing login by email or grant roles in this operation.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMember'
      responses:
        '201':
          description: Created local member reference; private fields not echoed
          headers:
            Location:
              description: Canonical relative member resource path
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberReference'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/members/{memberId}:
    parameters:
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Members]
      operationId: readLocalMember
      summary: Authorized minimal member detail (IMPLEMENTED)
      description: >
        This member-ID detail is for authenticated, explicitly authorized
        administration only, not the public name list. R03/#76 must separately
        define who may see DOB, contacts and player gender. This proposed
        shape returns a full-name admin summary; conceal non-existent and
        non-visible IDs with the same 404.
      responses:
        '200':
          description: Minimal member summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberSummary' }
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      tags: [Members]
      operationId: changeLocalMemberNames
      summary: Name-only update preserving private fields (IMPLEMENTED)
      description: >
        The internal MemberDetailsUpdate.updateNames changes first and last
        name only for an active member under an explicit EDIT_MEMBERS grant.
        It never reads or modifies DOB, contacts, gender, roles, accounts or
        capability grants. Unlike full replacement, it does not depend on
        an editor being authorized to read private contact/birth fields.
        HTTP implementation requires a verified session, exact Origin,
        session-bound CSRF and explicit EDIT_MEMBERS capability. Hidden/private
        member fields are never read or modified by this operation.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberNames'
      responses:
        '204':
          description: Names updated; no private values returned
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      tags: [Members]
      operationId: replaceLocalMemberDetails
      summary: Proposed authorized member details replacement (NOT IMPLEMENTED)
      description: >
        The existing internal MemberDetailsUpdate replaces editable fields for
        a currently active member under an explicit live EDIT_MEMBERS grant.
        It cannot modify account links, ADMIN/MEMBER roles, grants or teams.
        Proposed HTTP write must derive the actor from the verified session
        and require exact configured Origin, session-bound CSRF and JSON input.
        Supply all editable fields on every call; omitted optional contacts
        and gender clear those values, so a browser edit form MUST NOT guess
        unseen private fields. R03 must first approve a restricted, authorized
        detail-read contract and adult/minor contact disclosure to editors,
        including policy transitions. Never round-trip a directory-only DTO
        into this write or silently reset hidden private fields. Do not enable
        this route until the privacy/contract, audit and security review gates
        are explicitly accepted.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMember'
      responses:
        '204':
          description: Active member updated; never echo private fields
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/members/{memberId}/archive:
    post:
      tags: [Members]
      operationId: archiveLocalMember
      summary: Archive an unlinked ordinary member (IMPLEMENTED)
      description: >
        Internal-only MemberArchive currently requires a verified session actor
        holding a live club-wide EDIT_MEMBERS grant, an unlinked MEMBER target,
        and transactionally revokes all team assignments and capability grants.
        Archived members disappear from active directory and team workflows,
        but private records remain in database/backups. Not erasure or deletion.
        Before HTTP exposure, approve R03 retention, actor audit, field policies,
        exact configured Origin, session-bound CSRF, lifecycle authorization and
        indistinguishable non-visible member IDs. No request body or actor ID.
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Target archived; never echo personal fields
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/members/{memberId}/reactivate:
    post:
      tags: [Members]
      operationId: reactivateLocalMember
      summary: Proposed reactivation without restored rights (NOT IMPLEMENTED)
      description: >
        Internal-only MemberReactivation restores only a currently archived,
        unlinked MEMBER to active status under a live EDIT_MEMBERS grant.
        It never restores old login links, team assignments or capability grants.
        Current adult contact/gender policy must still validate at reactivation;
        conflict and audit behavior require R03/R04 approval before HTTP access.
        No request body or caller-provided actor account ID.
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Member reactivated without restoring old privileges
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/members/{memberId}/role:
    parameters:
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Members]
      operationId: readLocalMemberRole
      summary: Read a local active member role (synthetic M1)
      description: >
        Requires an active, verified ADMIN session with a current club
        MANAGE_PERMISSIONS grant; role lookup never exposes contact fields.
      responses:
        '200':
          description: Current role of active member
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [role]
                properties:
                  role: { type: string, enum: [ADMIN, MEMBER] }
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      tags: [Members]
      operationId: changeLocalMemberRole
      summary: Change a local member role (synthetic M1)
      description: >
        Verifies session, exact Origin and CSRF, then uses serialized
        MemberRoles checks with a live eligible ADMIN/MANAGE_PERMISSIONS
        grant and linked identity. Refuses self-mutation, archived targets and
        last-administrator lockout. Role changes never auto-grant permissions.
        Missing or non-visible targets are denied without disclosing roles.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { type: string, enum: [ADMIN, MEMBER] }
      responses:
        '204':
          description: Role updated or already at desired value
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/teams:
    get:
      tags: [Teams]
      operationId: listLocalTeams
      summary: Authorized team list (synthetic M1)
      description: >
        Verified active member with explicit club or exact-team VIEW_TEAMS or
        MANAGE_TEAMS grant. Only authorized teams and aggregate member counts
        are returned. No anonymous roster or member identifiers.
      responses:
        '200':
          description: Visible teams within the singleton club
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamPage' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags: [Teams]
      operationId: createLocalTeam
      summary: Create a team (synthetic M1)
      description: >
        Requires verified session, exact Origin, session CSRF and club-wide
        MANAGE_TEAMS; a team-scoped grant cannot create a club team.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamName' }
      responses:
        '201':
          description: Created team reference
          headers:
            Location:
              schema: { type: string }
              description: Relative team resource location
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberReference' }
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/teams/{teamId}:
    parameters:
      - name: teamId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Teams]
      operationId: renameLocalTeam
      summary: Rename a team (synthetic M1)
      description: >
        Club-wide MANAGE_TEAMS, exact Origin and session CSRF required.
        Existing assignments remain attached to the same team ID.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamName' }
      responses:
        '204':
          description: Renamed
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [Teams]
      operationId: deleteLocalTeam
      summary: Confirmed restricted team removal (synthetic M1)
      description: >
        Club-wide MANAGE_TEAMS and exact Origin/CSRF required. Caller must
        supply the current exact name. A name mismatch is rejected, and
        populated/delegated teams are protected by the database service.
        Do not use deletion for personal data erasure.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamName' }
      responses:
        '204':
          description: Eligible team removed
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/teams/{teamId}/members:
    get:
      tags: [Teams]
      operationId: listVisibleTeamMembers
      summary: Authenticated exact-team private roster (synthetic M1)
      description: >
        Requires BOTH explicit club VIEW_MEMBER_DIRECTORY and exact-team
        VIEW_TEAMS/MANAGE_TEAMS (or club-wide team capability).
        Only active member UUIDs and first/last names are returned.
        Opaque encrypted cursors are bound to account and exact team;
        no DOB, contact, account link or gender is exposed.
      parameters:
        - name: teamId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 2048 }
          description: Authenticated per-account, per-team cursor
      responses:
        '200':
          description: Authorized, bounded roster page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberPage' }
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/teams/{teamId}/members/{memberId}:
    parameters:
      - name: teamId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Teams]
      operationId: assignLocalTeamMember
      summary: Assign active member to team (synthetic M1)
      description: >
        Exact team or club MANAGE_TEAMS, verified session, exact Origin and
        session CSRF. Duplicate/archived member assignments are rejected.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Assignment created
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [Teams]
      operationId: unassignLocalTeamMember
      summary: Remove team assignment (synthetic M1)
      description: >
        Exact team or club MANAGE_TEAMS, verified session, exact Origin and
        session CSRF; no member record is deleted.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Assignment removed
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/grants:
    get:
      tags: [Permissions]
      operationId: listLocalGrants
      summary: Inspect member grants (synthetic M1)
      description: >
        A verified, linked ADMIN with explicit current club MANAGE_PERMISSIONS
        may inspect club and exact-team capabilities for a given member ID.
        The response contains no names, birth dates or contact details.
      parameters:
        - name: memberId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current scoped capability grants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrantPage' }
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags: [Permissions]
      operationId: grantLocalCapability
      summary: Delegate a capability (synthetic M1)
      description: >
        Verified ADMIN/MANAGE_PERMISSIONS and session Origin/CSRF required.
        Serialized mutation prevents self-escalation, undelegable team scope
        and last-manager lockout. Never accept a caller-supplied actor ID.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantMutation' }
      responses:
        '204':
          description: Grant added or already present
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [Permissions]
      operationId: revokeLocalCapability
      summary: Revoke a capability (synthetic M1)
      description: >
        Same verified ADMIN, CSRF and serialized last-manager safeguards as
        granting. A revocation is effective on the next protected read.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantMutation' }
      responses:
        '204':
          description: Grant removed or already absent
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'

components:
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: >
        Secret returned by authenticated GET /v1/auth/me; must belong to the
        same unexpired session cookie. Also require exact configured Origin.
      schema: { type: string, minLength: 43, maxLength: 43 }
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: __Host-openclub_session
      description: >
        Verified OIDC-backed server-side session, with local loopback
        development cookie openclub_dev_session. A login is not an authorization.
  schemas:
    ClubReference:
      type: object
      additionalProperties: false
      required: [id, name, slug, genderRequiredForPlayers]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        slug: { type: string, minLength: 3, maxLength: 60, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        genderRequiredForPlayers: { type: boolean }
    MemberReference:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { type: string, format: uuid }
    PublicMemberName:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 402
          examples: [Peter Smith, Peter S.]
          description: Only the server-formatted public name; minors get first name and last-name initial.
    MemberSummary:
      type: object
      additionalProperties: false
      required: [id, firstName, lastName]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string, minLength: 1, maxLength: 200 }
        lastName: { type: string, minLength: 1, maxLength: 200 }
    MemberPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/MemberSummary' }
        nextCursor:
          type: string
          minLength: 1
          maxLength: 2048
          description: Absent on the last page.
    MemberNames:
      type: object
      additionalProperties: false
      required: [firstName, lastName]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 200 }
        lastName: { type: string, minLength: 1, maxLength: 200 }
    NewMember:
      type: object
      additionalProperties: false
      required: [firstName, lastName, dateOfBirth]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 200 }
        lastName: { type: string, minLength: 1, maxLength: 200 }
        dateOfBirth:
          type: string
          format: date
          description: Required for all members; no future dates. Private, never directory-visible.
        email:
          type: string
          format: email
          maxLength: 320
          description: Required for adults under the locally configured threshold.
        phone:
          type: string
          minLength: 1
          maxLength: 40
          description: Required alongside email for adults.
        gender:
          type: string
          minLength: 1
          description: Optional unless the club requires gender for players; not binary-only.
        isPlayer: { type: boolean, default: false }
    Team:
      type: object
      additionalProperties: false
      required: [id, name, memberCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        memberCount: { type: integer, minimum: 0 }
    TeamPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Team' }
    TeamName:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
    GrantView:
      type: object
      additionalProperties: false
      required: [capability, scope]
      properties:
        capability:
          type: string
          enum: [VIEW_MEMBER_DIRECTORY, EDIT_MEMBERS, MANAGE_PERMISSIONS, VIEW_TEAMS, MANAGE_TEAMS]
        scope: { type: string, enum: [CLUB, TEAM] }
        teamId: { type: string, format: uuid }
    GrantPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GrantView' }
    GrantMutation:
      type: object
      additionalProperties: false
      required: [memberId, capability, scope]
      properties:
        memberId: { type: string, format: uuid }
        capability:
          type: string
          enum: [VIEW_MEMBER_DIRECTORY, EDIT_MEMBERS, MANAGE_PERMISSIONS, VIEW_TEAMS, MANAGE_TEAMS]
        scope: { type: string, enum: [CLUB, TEAM] }
        teamId: { type: string, format: uuid }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
  responses:
    Invalid:
      description: Invalid input, query, cursor or member field; no private data reflected
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: Session missing or expired
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated, but caller lacks operation-level permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Unknown or non-visible member ID; indistinguishable results
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Write conflicts with an existing record or policy state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: Database or authorization service unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
