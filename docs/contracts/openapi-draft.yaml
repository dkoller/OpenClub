openapi: 3.1.0
info:
  title: OpenClub single-club management API — working draft
  version: 0.0.0-draft
  description: >
    NOT APPROVED FOR IMPLEMENTATION. Only authenticated GET /v1/club and the
    separately documented /v1/auth routes are implemented. Every member, team
    and grant operation in this file is a proposal, pending R03 privacy, R04
    review, and R06/#76 authorization acceptance. Bootstrap and emergency admin
    recovery are offline operator-only commands, never HTTP APIs. Exactly one
    club exists per installation; no clubId tenant selector or switcher exists.
    Never treat the browser session alone as permission to read personal data.
servers:
  - url: /api
security:
  - browserSession: []
tags:
  - name: Club
  - name: Members
  - name: Teams
  - name: Permissions
paths:
  /v1/club:
    get:
      tags: [Club]
      operationId: readMyClub
      summary: Read the single installation club after authorized login
      description: >
        Implemented minimal response: local club UUID only. Authentication
        does not imply club membership. No club name or private data is sent.
      responses:
        '200':
          description: Current installation's club ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubReference'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/members:
    get:
      tags: [Members]
      operationId: listLocalMembers
      summary: Proposed privacy-minimized member search (NOT IMPLEMENTED)
      description: >
        Linked club members need explicit read permission; a valid login alone
        grants nothing. Returns names and local IDs only; never DOB, gender,
        contact data, account IDs or grants. R03 must approve even this directory
        visibility before implementation. Opaque cursor represents a stable
        (lastName, firstName, id) ordering and is bound to the same filter and
        caller's permission; stale/invalid cursors return 400.
      parameters:
        - name: q
          in: query
          description: Optional trimmed case-insensitive name search; no email or DOB search.
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          description: Opaque server-issued page cursor; never encode PII in cleartext.
          schema: { type: string, minLength: 1, maxLength: 512 }
      responses:
        '200':
          description: Bounded page containing privacy-minimized members only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags: [Members]
      operationId: addLocalMember
      summary: Proposed authorized accountless member creation (NOT IMPLEMENTED)
      description: >
        Requires an explicitly authorized club-level member-write capability,
        exact configured Origin, session-bound X-CSRF-Token and JSON Content-Type.
        A verified login or legacy ADMIN label alone does not approve future
        configurable delegation. All members require DOB; adults require both
        email and phone; gender is required only for players when the club
        enables the policy. Adult age threshold is installation-local and
        provisionally defaults to 18; R03 must approve threshold and access.
        Never match an existing login by email or grant roles in this operation.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMember'
      responses:
        '201':
          description: Created local member reference; private fields not echoed
          headers:
            Location:
              description: Canonical relative member resource path
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberReference'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/members/{memberId}:
    parameters:
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Members]
      operationId: readLocalMember
      summary: Proposed permission-filtered member detail (NOT IMPLEMENTED)
      description: >
        R03 and #76 must define who may see DOB, contacts and player gender.
        This initial proposed shape returns only a directory-safe summary.
        Conceal non-existent or non-visible member IDs with the same 404.
      responses:
        '200':
          description: Minimal member summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberSummary' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      tags: [Members]
      operationId: replaceLocalMemberDetails
      summary: Proposed authorized member details replacement (NOT IMPLEMENTED)
      description: >
        The existing internal MemberDetailsUpdate replaces editable fields for
        a currently active member under an explicit live EDIT_MEMBERS grant.
        It cannot modify account links, ADMIN/MEMBER roles, grants or teams.
        Proposed HTTP write must derive the actor from the verified session
        and require exact configured Origin, session-bound CSRF and JSON input.
        Supply all editable fields on every call; omitted optional contacts
        and gender clear those values, so a browser edit form MUST NOT guess
        unseen private fields. R03 must first approve a restricted, authorized
        detail-read contract and adult/minor contact disclosure to editors,
        including policy transitions. Never round-trip a directory-only DTO
        into this write or silently reset hidden private fields. Do not enable
        this route until the privacy/contract, audit and security review gates
        are explicitly accepted.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMember'
      responses:
        '204':
          description: Active member updated; never echo private fields
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/members/{memberId}/archive:
    post:
      tags: [Members]
      operationId: archiveLocalMember
      summary: Proposed archive of an unlinked ordinary member (NOT IMPLEMENTED)
      description: >
        Internal-only MemberArchive currently requires a verified session actor
        holding a live club-wide EDIT_MEMBERS grant, an unlinked MEMBER target,
        and transactionally revokes all team assignments and capability grants.
        Archived members disappear from active directory and team workflows,
        but private records remain in database/backups. Not erasure or deletion.
        Before HTTP exposure, approve R03 retention, actor audit, field policies,
        exact configured Origin, session-bound CSRF, lifecycle authorization and
        indistinguishable non-visible member IDs. No request body or actor ID.
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Target archived; never echo personal fields
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/members/{memberId}/reactivate:
    post:
      tags: [Members]
      operationId: reactivateLocalMember
      summary: Proposed reactivation without restored rights (NOT IMPLEMENTED)
      description: >
        Internal-only MemberReactivation restores only a currently archived,
        unlinked MEMBER to active status under a live EDIT_MEMBERS grant.
        It never restores old login links, team assignments or capability grants.
        Current adult contact/gender policy must still validate at reactivation;
        conflict and audit behavior require R03/R04 approval before HTTP access.
        No request body or caller-provided actor account ID.
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Member reactivated without restoring old privileges
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/members/{memberId}/role:
    put:
      tags: [Members]
      operationId: changeLocalMemberRole
      summary: Proposed permission-admin role change (NOT IMPLEMENTED)
      description: >
        The internal MemberRoles service serializes changes with grant mutation,
        denies self-change, and preserves a final ADMIN and eligible
        permission-manager. There is NO HTTP endpoint. When approved, require
        a verified session, exact Origin, session-bound CSRF, explicitly
        authorized permission administrator, and audited outcomes. No
        client-supplied actor account ID or automatic privilege grant.
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { type: string, enum: [ADMIN, MEMBER] }
      responses:
        '204':
          description: Role updated or already at desired value
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/teams:
    get:
      tags: [Teams]
      operationId: listLocalTeams
      summary: Proposed local team list (NOT IMPLEMENTED)
      description: >
        Internal PostgreSQL teams and assignments exist, but no team routes
        are registered. Future team reads require explicit VIEW_TEAMS or
        MANAGE_TEAMS permission from a verified local session. Member counts
        must not reveal unapproved personal data.
      responses:
        '200':
          description: Teams in this installation's club; authorized callers only
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/teams/{teamId}/members:
    get:
      tags: [Teams]
      operationId: listVisibleTeamMembers
      summary: Proposed privacy-minimized exact-team roster (NOT IMPLEMENTED)
      description: >
        A verified session alone gives no directory access. The internal
        TeamMemberDirectory requires BOTH explicit club-wide
        VIEW_MEMBER_DIRECTORY and exact-team VIEW_TEAMS/MANAGE_TEAMS
        (or the equivalent club-wide team capability) on each page.
        Only active members' local UUIDs and first/last names can be returned.
        Unknown teams and team IDs outside the caller's scope must not reveal
        rosters. Public pagination cursors would require authenticated
        integrity, filter/scope binding and privacy review; internal After
        tuples are not safe to publish. R03 approval of minors' name visibility
        is required before exposing any endpoint.
      parameters:
        - name: teamId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 512 }
          description: Future opaque and authenticated cursor, never raw personal fields.
      responses:
        '200':
          description: Authorized privacy-minimized roster page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberPage' }
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/permission-grants:
    get:
      tags: [Permissions]
      operationId: listLocalGrants
      summary: Proposed authorized club/team capability grants (NOT IMPLEMENTED)
      description: >
        Internal team-specific VIEW_TEAMS and MANAGE_TEAMS grants exist in V4.
        An internal transactional grant/revoke service exists, but no HTTP grant listing, delegation or revoke endpoint exists. Only
        explicit permission-authorized ADMINs may eventually delegate, with
        last-manager, self-escalation and capability-scope checks. Do not expose
        the grant model before the authorization and privacy review.
      responses:
        '200':
          description: Scoped grants; only authorized permission managers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Grant'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: >
        Secret returned by authenticated GET /v1/auth/me; must belong to the
        same unexpired session cookie. Also require exact configured Origin.
      schema: { type: string, minLength: 43, maxLength: 43 }
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: __Host-openclub_session
      description: >
        Verified OIDC-backed server-side session, with local loopback
        development cookie openclub_dev_session. A login is not an authorization.
  schemas:
    ClubReference:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { type: string, format: uuid }
    MemberReference:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { type: string, format: uuid }
    MemberSummary:
      type: object
      additionalProperties: false
      required: [id, firstName, lastName]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string, minLength: 1, maxLength: 200 }
        lastName: { type: string, minLength: 1, maxLength: 200 }
    MemberPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/MemberSummary' }
        nextCursor:
          type: string
          minLength: 1
          maxLength: 512
          description: Absent on the last page.
    NewMember:
      type: object
      additionalProperties: false
      required: [firstName, lastName, dateOfBirth]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 200 }
        lastName: { type: string, minLength: 1, maxLength: 200 }
        dateOfBirth:
          type: string
          format: date
          description: Required for all members; no future dates. Private, never directory-visible.
        email:
          type: string
          format: email
          maxLength: 320
          description: Required for adults under the locally configured threshold.
        phone:
          type: string
          minLength: 1
          maxLength: 40
          description: Required alongside email for adults.
        gender:
          type: string
          minLength: 1
          description: Optional unless the club requires gender for players; not binary-only.
        isPlayer: { type: boolean, default: false }
    Team:
      type: object
      additionalProperties: false
      required: [id, name, memberCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        memberCount: { type: integer, minimum: 0 }
    Grant:
      description: >
        Proposed DTO, not an approved API. Team-scoped grants currently
        permit only VIEW_TEAMS or MANAGE_TEAMS; the database rejects other
        team capabilities. A TEAM scope requires a real installation-local
        teamId. No arbitrary team IDs, ADMIN promotion or account linking.
      type: object
      additionalProperties: false
      required: [memberId, capability, scope]
      properties:
        memberId: { type: string, format: uuid }
        capability:
          type: string
          enum: [VIEW_MEMBER_DIRECTORY, EDIT_MEMBERS, MANAGE_PERMISSIONS, VIEW_TEAMS, MANAGE_TEAMS]
        scope: { type: string, enum: [CLUB, TEAM] }
        teamId: { type: string, format: uuid }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
  responses:
    Invalid:
      description: Invalid input, query, cursor or member field; no private data reflected
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: Session missing or expired
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated, but caller lacks operation-level permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Unknown or non-visible member ID; indistinguishable results
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Write conflicts with an existing record or policy state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: Database or authorization service unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
