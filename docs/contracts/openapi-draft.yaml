openapi: 3.1.0
info:
  title: OpenClub single-club management API — working draft
  version: 0.0.0-draft
  description: >
    NOT APPROVED FOR IMPLEMENTATION. The runtime currently implements only
    authenticated GET /v1/club (when OIDC is configured) plus the separately
    documented /v1/auth routes. Member, team, grant and first-admin APIs below
    are proposals pending R03 privacy, R04 contract acceptance and R06/R07
    authorization. Exactly one club exists per installation; no clubId tenant
    selector, cross-club data directory, or club switcher is supported.
servers:
  - url: /api
security:
  - browserSession: []
tags:
  - name: Club
  - name: Members
  - name: Teams
  - name: Permissions
paths:
  /v1/club:
    get:
      tags: [Club]
      operationId: readMyClub
      summary: Read the single installation club after authorized login
      description: >
        Implemented minimal response: local club UUID only. Authentication
        does not imply club membership. No club name or private data is sent.
      responses:
        '200':
          description: Current installation's club ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubReference'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/members:
    get:
      tags: [Members]
      operationId: listLocalMembers
      summary: Proposed authorized member directory
      description: >
        NOT IMPLEMENTED. Field-level visibility and pagination need R03/R04
        approval. Default responses must not expose full birth dates, gender or
        contact data to unauthorized accounts.
      responses:
        '200':
          description: Local member list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Members]
      operationId: addLocalMember
      summary: Proposed admin creation of an accountless member
      description: >
        NOT IMPLEMENTED. Require local member-edit grant, Origin and CSRF
        checks, date of birth for everyone, both email and phone for adults,
        and gender only for players if configured by the installation's club.
        Adulthood threshold and field visibility require review.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMember'
      responses:
        '201':
          description: Created local member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/teams:
    get:
      tags: [Teams]
      operationId: listLocalTeams
      summary: Proposed local team list (not implemented)
      responses:
        '200':
          description: Teams in this installation's club
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
  /v1/permission-grants:
    get:
      tags: [Permissions]
      operationId: listLocalGrants
      summary: Proposed authorized club/team capability grants (not implemented)
      responses:
        '200':
          description: Scoped grants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Grant'
components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: __Host-openclub_session
      description: >
        Verified OIDC-backed server-side session, with local loopback
        development cookie openclub_dev_session. A login is not an authorization.
  schemas:
    ClubReference:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { type: string, format: uuid }
    NewMember:
      type: object
      additionalProperties: false
      required: [firstName, lastName, dateOfBirth]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 200 }
        lastName: { type: string, minLength: 1, maxLength: 200 }
        dateOfBirth: { type: string, format: date }
        email: { type: string, format: email, maxLength: 320 }
        phone: { type: string, maxLength: 40 }
        gender: { type: string }
        isPlayer: { type: boolean, default: false }
    Member:
      allOf:
        - $ref: '#/components/schemas/NewMember'
        - type: object
          required: [id, role]
          properties:
            id: { type: string, format: uuid }
            role: { type: string, enum: [ADMIN, MEMBER] }
    Team:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
    Grant:
      type: object
      required: [memberId, capability, scope]
      properties:
        memberId: { type: string, format: uuid }
        capability: { type: string }
        scope: { type: string, enum: [CLUB, TEAM] }
        teamId: { type: string, format: uuid }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
  responses:
    Invalid:
      description: Input rejected
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: Session missing or expired
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: No local club membership or insufficient grants
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: Database or authorization service unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
