openapi: 3.1.0
info:
  title: OpenClub single-club management API — working draft
  version: 0.0.0-draft
  description: >
    NOT APPROVED FOR IMPLEMENTATION. Only authenticated GET /v1/club and the
    separately documented /v1/auth routes are implemented. Every member, team
    and grant operation in this file is a proposal, pending R03 privacy, R04
    review, and R06/#76 authorization acceptance. Bootstrap and emergency admin
    recovery are offline operator-only commands, never HTTP APIs. Exactly one
    club exists per installation; no clubId tenant selector or switcher exists.
    Never treat the browser session alone as permission to read personal data.
servers:
  - url: /api
security:
  - browserSession: []
tags:
  - name: Club
  - name: Members
  - name: Teams
  - name: Permissions
paths:
  /v1/club:
    get:
      tags: [Club]
      operationId: readMyClub
      summary: Read the single installation club after authorized login
      description: >
        Implemented minimal response: local club UUID only. Authentication
        does not imply club membership. No club name or private data is sent.
      responses:
        '200':
          description: Current installation's club ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubReference'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/members:
    get:
      tags: [Members]
      operationId: listLocalMembers
      summary: Proposed privacy-minimized member search (NOT IMPLEMENTED)
      description: >
        Linked club members need explicit read permission; a valid login alone
        grants nothing. Returns names and local IDs only; never DOB, gender,
        contact data, account IDs or grants. R03 must approve even this directory
        visibility before implementation. Opaque cursor represents a stable
        (lastName, firstName, id) ordering and is bound to the same filter and
        caller's permission; stale/invalid cursors return 400.
      parameters:
        - name: q
          in: query
          description: Optional trimmed case-insensitive name search; no email or DOB search.
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          description: Opaque server-issued page cursor; never encode PII in cleartext.
          schema: { type: string, minLength: 1, maxLength: 512 }
      responses:
        '200':
          description: Bounded page containing privacy-minimized members only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags: [Members]
      operationId: addLocalMember
      summary: Proposed authorized accountless member creation (NOT IMPLEMENTED)
      description: >
        Requires an explicitly authorized club-level member-write capability,
        exact configured Origin, session-bound X-CSRF-Token and JSON Content-Type.
        A verified login or legacy ADMIN label alone does not approve future
        configurable delegation. All members require DOB; adults require both
        email and phone; gender is required only for players when the club
        enables the policy. Adult age threshold is installation-local and
        provisionally defaults to 18; R03 must approve threshold and access.
        Never match an existing login by email or grant roles in this operation.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMember'
      responses:
        '201':
          description: Created local member reference; private fields not echoed
          headers:
            Location:
              description: Canonical relative member resource path
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberReference'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/members/{memberId}:
    parameters:
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Members]
      operationId: readLocalMember
      summary: Proposed permission-filtered member detail (NOT IMPLEMENTED)
      description: >
        R03 and #76 must define who may see DOB, contacts and player gender.
        This initial proposed shape returns only a directory-safe summary.
        Conceal non-existent or non-visible member IDs with the same 404.
      responses:
        '200':
          description: Minimal member summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberSummary' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/teams:
    get:
      tags: [Teams]
      operationId: listLocalTeams
      summary: Proposed local team list (not implemented)
      responses:
        '200':
          description: Teams in this installation's club; authorized callers only
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/permission-grants:
    get:
      tags: [Permissions]
      operationId: listLocalGrants
      summary: Proposed authorized club/team capability grants (not implemented)
      responses:
        '200':
          description: Scoped grants; only authorized permission managers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Grant'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: >
        Secret returned by authenticated GET /v1/auth/me; must belong to the
        same unexpired session cookie. Also require exact configured Origin.
      schema: { type: string, minLength: 43, maxLength: 43 }
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: __Host-openclub_session
      description: >
        Verified OIDC-backed server-side session, with local loopback
        development cookie openclub_dev_session. A login is not an authorization.
  schemas:
    ClubReference:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { type: string, format: uuid }
    MemberReference:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { type: string, format: uuid }
    MemberSummary:
      type: object
      additionalProperties: false
      required: [id, firstName, lastName]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string, minLength: 1, maxLength: 200 }
        lastName: { type: string, minLength: 1, maxLength: 200 }
    MemberPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/MemberSummary' }
        nextCursor:
          type: string
          minLength: 1
          maxLength: 512
          description: Absent on the last page.
    NewMember:
      type: object
      additionalProperties: false
      required: [firstName, lastName, dateOfBirth]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 200 }
        lastName: { type: string, minLength: 1, maxLength: 200 }
        dateOfBirth:
          type: string
          format: date
          description: Required for all members; no future dates. Private, never directory-visible.
        email:
          type: string
          format: email
          maxLength: 320
          description: Required for adults under the locally configured threshold.
        phone:
          type: string
          minLength: 1
          maxLength: 40
          description: Required alongside email for adults.
        gender:
          type: string
          minLength: 1
          description: Optional unless the club requires gender for players; not binary-only.
        isPlayer: { type: boolean, default: false }
     Team:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
    Grant:
      type: object
      required: [memberId, capability, scope]
      properties:
        memberId: { type: string, format: uuid }
        capability: { type: string }
        scope: { type: string, enum: [CLUB, TEAM] }
        teamId: { type: string, format: uuid }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
  responses:
    Invalid:
      description: Invalid input, query, cursor or member field; no private data reflected
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: Session missing or expired
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated, but caller lacks operation-level permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Unknown or non-visible member ID; indistinguishable results
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Write conflicts with an existing record or policy state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: Database or authorization service unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
