openapi: 3.1.0
info:
  title: OpenClub membership API — discussion draft
  version: 0.0.0-draft
  description: >
    NOT APPROVED FOR IMPLEMENTATION. Historical discussion schemas predate accepted
    R01 pilot requirements (2026-11-15). First and last name plus club-local date
    of birth are mandatory for all; email and phone are both required for adults,
    optional for minors; player gender may be club-required. Personal data must
    never transfer between clubs, even for a shared login identity. Club/team
    capability grants and team assignments must also be modeled. The example
    AddMember, Membership and role schemas below DO NOT meet these requirements.
    R01 is closed and OIDC sessions are implemented, but R03 privacy, R04 final
    contract, R06 authorization and R07 bootstrap gates remain open. No
    unauthenticated club/member mutations. See docs/contracts/contract-review.md.
servers:
  - url: /api
security:
  - browserSession: []
tags:
  - name: Clubs
  - name: Members
paths:
  /v1/clubs:
    get:
      tags: [Clubs]
      summary: List clubs available to the signed-in person
      operationId: listMyClubs
      responses:
        '200':
          description: Authorized clubs only
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Club'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [Clubs]
      summary: Create club with protected first-admin bootstrap (design TBD)
      operationId: createClub
      description: >
        No open self-registration privilege. Only implement after R07 bootstrap
        and authenticated actor rules are approved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClub'
      responses:
        '201':
          description: Club created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/clubs/{clubId}/members:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    get:
      tags: [Members]
      summary: List members and permitted contacts within one authorized club
      description: >
        Requires authenticated membership in the requested club (ADMIN or MEMBER).
        Scope to the club; field-level contact privacy for minors still requires review.
      operationId: listClubMembers
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: Memberships belonging to the authorized club
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Members]
      summary: Add a person to a club without requiring a login
      description: Requires ADMIN membership of the requested club; invitation flow is later.
      operationId: addClubMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMember'
      responses:
        '201':
          description: Membership created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/clubs/{clubId}/members/{membershipId}/role:
    parameters:
      - $ref: '#/components/parameters/ClubId'
      - name: membershipId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Members]
      summary: Set club-scoped role; requires ADMIN and last-admin protection
      operationId: setMembershipRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '204':
          description: Role updated
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: openclub_session
      description: Approved Ktor BFF opaque HttpOnly session-cookie architecture; CSRF, store and exact cookie settings pending.
  parameters:
    ClubId:
      name: clubId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Role:
      type: string
      enum: [ADMIN, MEMBER]
    Club:
      type: object
      additionalProperties: false
      required: [id, slug, name]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        name: { type: string }
    CreateClub:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        slug: { type: string, minLength: 3, maxLength: 60, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
    AddMember:
      type: object
      additionalProperties: false
      required: [firstName, lastName]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 200 }
        lastName: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email, maxLength: 320 }
        phone: { type: string, maxLength: 40 }
    Membership:
      type: object
      additionalProperties: false
      required: [id, clubId, personId, firstName, lastName, role]
      properties:
        id: { type: string, format: uuid }
        clubId: { type: string, format: uuid }
        personId: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    MemberPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Membership' }
        nextCursor:
          type: [string, 'null']
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
  responses:
    Invalid:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: Signed-in session missing or expired
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated actor has insufficient permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource absent or concealed from caller
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Duplicate, stale update or last-admin protection
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
