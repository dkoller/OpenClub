          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [Permissions]
      operationId: revokeLocalCapability
      summary: Revoke a capability
      description: >
        Same verified ADMIN, CSRF and serialized last-manager safeguards as
        granting. A revocation is effective on the next protected read.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantMutation' }
      responses:
        '204':
          description: Grant removed or already absent
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/members/{memberId}/invitation:
    parameters:
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Members]
      operationId: createLocalMemberInvitation
      summary: Invite an adult member to sign in themselves (since 1.2.0)
      description: >
        Creates the single open invitation for an ACTIVE, unlinked ordinary member, under a live
        club-wide EDIT_MEMBERS grant. The response carries the one-time secret; only its hash is
        stored, so it can never be read again. The administrator hands the resulting link
        (https://HOST/invite#SECRET, the secret in the URL fragment so it stays out of server logs)
        to the person outside OpenClub; the system sends no email. Life is 7 days. 409 when the
        member already has an open invitation (revoke it first) or is already linked. Never created
        for administrators or archived members. Audited as INVITATION_CREATED.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: Invitation created; the secret is shown once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [Members]
      operationId: revokeLocalMemberInvitation
      summary: Revoke a member's open invitation (since 1.2.0)
      description: >
        Revokes the member's open invitation under a live club-wide EDIT_MEMBERS grant. Idempotent
        as to the outcome (no open invitation afterwards); 404 when the member does not exist.
        Audited as INVITATION_REVOKED when an invitation was actually revoked.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: No open invitation remains
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/invitations/accept:
    post:
      tags: [Members]
      operationId: acceptInvitation
      summary: Accept an invitation as a signed-in person (since 1.2.0)
      description: >
        Links the caller's verified account to the invited member. Needs both proofs: the secret in
        the body and a verified OIDC session (with exact Origin and CSRF); no capability is required
        and none is granted: the linked member keeps role MEMBER and no grants. In one transaction
        the server checks that the invitation is open, unexpired and unrevoked, that the member is
        still active, unlinked and a plain MEMBER, and that the caller's account has no member. Every
        failure, whatever the reason (unknown, used, expired, revoked, ineligible member, account
        already linked), is the same 400 with code `invalid`, so nothing about members or
        invitations is revealed. Rate limited like the authentication routes. Audited as
        INVITATION_ACCEPTED.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationSecret' }
      responses:
        '204':
          description: The caller's account is now linked to the invited member
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: Too many acceptance attempts (shared budget, like the authentication routes); retry after the interval in Retry-After
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/members/{memberId}/account-link:
    delete:
      tags: [Members]
      operationId: unlinkLocalMemberAccount
      summary: Unlink a member's sign-in account (since 1.2.0)
      description: >
        Removes the link between a member and their account, needed before archiving and for a lost
        provider login. Requires a live club-wide MANAGE_PERMISSIONS grant held by an ADMIN with a
        current verified identity, because it changes who can sign in. Deletes that account's browser
        sessions, clears the member's capability grants (as archiving does), and refuses with 409
        the last eligible permission manager, reusing the existing advisory lock. Administrators are
        unlinked only by the operator recovery procedure; the response never reveals the account.
        Audited as ACCOUNT_UNLINKED.
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: The member is no longer linked to an account
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/members/{memberId}/details:
    parameters:
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Members]
      operationId: getLocalMemberDetails
      summary: Read a member's private fields as far as the caller may (since 1.3.0)
      description: >
        Reads private fields under the owner-approved access defaults. Which fields appear depends
        on the caller's current rights, and a field the caller may not read is ABSENT from the
        response, never null: a null means "readable and not set". A holder of a live club-wide
        EDIT_MEMBERS grant (with a current verified identity) receives every field and may also read
        an ARCHIVED member, solely so the record can be exported, reactivated or erased. A holder of
        MANAGE_TEAMS for a team the member belongs to receives only names, email, phone and isPlayer,
        and only for ACTIVE members of that team; an unknown, archived or out-of-team member is 403. Every other caller gets 403. Authorization is decided before
        the path is validated. Each contact read by a team manager writes a CONTACT_READ audit event
        (identifiers only). Responses are never cacheable (Cache-Control: no-store). Since 1.8.0 an
        editor's read carries the member's version as an ETag, required by PUT /v1/members/{memberId}
        in If-Match; a team manager's read has none.
      responses:
        '200':
          description: The fields the caller may read
          headers:
            ETag:
              description: The member's version (editors only), for If-Match on the replacement
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberDetails' }
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/members/{memberId}/export:
    get:
      tags: [Members]
      operationId: exportLocalMember
      summary: Download everything stored about one member (since 1.7.0)
      description: >
        For a live club-wide EDIT_MEMBERS grant with a current verified identity: the complete
        export of one member for an access or portability request (privacy proposal section 4),
        the same content as the operator export. Active, archived and linked members can be
        exported. It contains the member's stored fields, team assignments, invitation timestamps,
        grants and guardianships (the other member only as an ID). It never contains the login
        binding, sessions, other people's names or contacts, or the audit trail. Authorization
        before validation (403 for any input without the grant), then 400 for a malformed ID;
        unknown members are 404. Every export is audited as MEMBER_EXPORTED with the editor as
        actor. Served as an attachment, never cacheable. The file holds personal data: deliver it
        to the verified requester and dispose of it under the controller's policy.
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The export as a JSON attachment
          headers:
            Content-Disposition:
              schema: { type: string }
              description: attachment; filename="member-<memberId>.json"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberExport' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/members/{memberId}/erase:
    post:
      tags: [Members]
      operationId: eraseArchivedLocalMember
      summary: Permanently erase an archived member (since 1.3.0)
      description: >
        Hard-deletes one ARCHIVED member (the existing MemberErasure service). Requires a live
        club-wide EDIT_MEMBERS grant with a current verified identity and exact Origin and session
        CSRF. The caller repeats the member's full name as a typed confirmation. Every refusal is
        the same 403 so a caller learns nothing about members they may not erase: an active, linked
        or administrator member, an unknown ID, a wrong typed name, a missing grant, a revoked
        identity. Irreversible; backups keep the member until they expire. Audited as MEMBER_ERASED.
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ErasureConfirmation' }
      responses:
        '204':
          description: Member erased
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/members/{memberId}/guardians:
    parameters:
      - name: memberId
        in: path
        required: true
        description: The minor.
        schema: { type: string, format: uuid }
    get:
      tags: [Guardians]
      operationId: listMemberGuardians
      summary: Proposed list of a minor's guardians (since 1.6.0)
      description: >
        For a live club-wide EDIT_MEMBERS grant with a current verified identity. Returns the
        current guardians of an active minor: their member id and names only. Authorization before
        validation; an unknown or adult member is 404 for editors only. Never cacheable.
      responses:
        '200':
          description: Current guardians (0 to 2)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuardianList' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [Guardians]
      operationId: addMemberGuardian
      summary: Proposed guardianship record, attested by an editor (since 1.6.0)
      description: >
        An EDIT_MEMBERS holder records that an adult member is a guardian of a minor, after
        verifying the relationship OUTSIDE OpenClub (the system cannot verify legal guardianship;
        the request is the editor's attestation). Requires exact Origin and session CSRF. The minor
        must be an active member below the club's adult age; the guardian an active adult member
        with a linked verified account, never the minor and never archived. At most two guardians
        per minor. A violation is 409 (not eligible, already a guardian, or two guardians already);
        an unknown member is 404. Grants no capability. Audited as GUARDIAN_LINKED (identifiers only).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuardianReference' }
      responses:
        '204': { description: Guardianship recorded }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/members/{memberId}/guardians/{guardianMemberId}:
    delete:
      tags: [Guardians]
      operationId: removeMemberGuardian
      summary: Proposed revocation of a guardianship (since 1.6.0)
      description: >
        An EDIT_MEMBERS holder ends a guardianship at any time (for example after a dispute; the
        reason stays in the club's private register, not in OpenClub). Exact Origin and session
        CSRF. The guardian loses access at the next request. Idempotent: an absent guardianship is
        204. Audited as GUARDIAN_UNLINKED. Guardianships also end without a request when the minor
        reaches the club's adult age (checked on every read) or when either member is archived,
        unlinked or erased.
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: guardianMemberId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Guardianship ended or absent }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/me/dependents:
    get:
      tags: [Guardians]
      operationId: listMyDependents
      summary: Proposed list of the signed-in guardian's minors (since 1.6.0)
      description: >
        The signed-in account's own member, if it is an active adult with a current verified
        identity, sees the minors it is currently a guardian of: id and names only. Access is by
        relationship, not capability, checked in the same SQL statement as the read. Anyone else
        gets an empty list (never 403), so the route reveals nothing. Never cacheable.
      responses:
        '200':
          description: Current dependents
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DependentList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/me/dependents/{memberId}:
    parameters:
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Guardians]
      operationId: getMyDependent
      summary: Proposed read of one dependent's record by their guardian (since 1.6.0)
      description: >
        A current guardian reads the minor's names, date of birth, email, phone, player flag and
        team names. Everything else is absent (gender, archive state, login, invitations, roles,
        grants). Every refusal, including an unknown member, a minor who is not theirs, a minor
        who reached the adult age and a malformed ID, is the same 403, so existence is not
        revealed. Each successful read is audited as DEPENDENT_READ (identifiers only).
      responses:
        '200':
          description: The dependent's record as far as a guardian may read it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DependentDetails' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/me/dependents/{memberId}/contacts:
    parameters:
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Guardians]
      operationId: replaceMyDependentContacts
      summary: Proposed edit of a dependent's contacts by their guardian (since 1.6.0)
      description: >
        A current guardian replaces the minor's email and phone (both optional for a minor; an
        omitted field is cleared, so the client reads them first). Exact Origin and session CSRF.
        Nothing else of the record can change. Every refusal is the same 403 as for the read,
        decided before the body is validated; an invalid body from a current guardian is 400.
        Audited as DEPENDENT_UPDATED.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DependentContacts' }
      responses:
        '204': { description: Contacts replaced }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/me/profile:
    get:
      tags: [Profile]
      operationId: getMyProfile
      summary: The signed-in member's own record (since 1.9.0)
      description: >
        Found by the verified session's account, never by an ID from the request. The caller must be
        an active member with a current verified identity; anyone else (a login without a member
        record, an unverified one) is 403. Returns the member's own fields, role and teams, and the
        member's version as a strong ETag for PUT /v1/me/profile/contacts. Not audited. Never
        cacheable (Cache-Control: no-store).
      responses:
        '200':
          description: The caller's own record
          headers:
            ETag:
              description: The member's version, for If-Match on the contacts change
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyProfile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/me/profile/contacts:
    put:
      tags: [Profile]
      operationId: replaceMyContacts
      summary: Replace the signed-in member's own email and phone (since 1.9.0)
      description: >
        Only email and phone change; an omitted field is cleared, so the client reads them first.
        Names, birth date, gender, player and role stay with editors (any other key is 400). Order
        of answers: session (401), exact Origin and session CSRF (403), the caller must be an active
        verified member (403), the body (400), If-Match (428 when missing; 412 "changed" for any
        value other than the current version, for example after an editor's change), then the
        club's rules for adults' contacts (400). Nothing changes on a refusal. Audited as
        SELF_CONTACTS_UPDATED. Returns the new ETag.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: If-Match
          in: header
          required: true
          description: The ETag of GET /v1/me/profile, for example "7"
          schema: { type: string, pattern: '^"[1-9][0-9]{0,18}"$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DependentContacts' }
      responses:
        '204':
          description: Contacts replaced
          headers:
            ETag:
              description: The member's new version
              schema: { type: string }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412':
          description: The record changed since it was read (code "changed")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '428':
          description: If-Match is missing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/me/profile/public-listing:
    put:
      tags: [Profile]
      operationId: setMyPublicListing
      summary: Show or hide the signed-in member's own name on the public member list (since 1.15.0)
      description: >
        The controller's decision C5 (ADR-0008 addendum 19): every member is on the anonymous public
        list unless they object. Order of answers: session (401), exact Origin and session CSRF
        (403), the caller must be an active verified member (403), the body (400; a boolean, not a
        string), If-Match with the ETag of GET /v1/me/profile (428 when missing, 412 "changed"
        otherwise). Audited as PUBLIC_LISTING_CHANGED. Returns the new ETag.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: If-Match
          in: header
          required: true
          description: The ETag of GET /v1/me/profile
          schema: { type: string, pattern: '^"[1-9][0-9]{0,18}"$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicListing' }
      responses:
        '204':
          description: Changed
          headers:
            ETag:
              description: The member's new version
              schema: { type: string }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412':
          description: The record changed since it was read (code "changed")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '428':
          description: If-Match is missing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/members/{memberId}/public-listing:
    parameters:
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Members]
      operationId: setMemberPublicListing
      summary: Show or hide an active member's name on the public member list (EDIT_MEMBERS, since 1.15.0)
      description: >
        For the club to honour an objection (C5), including for a minor who cannot sign in. Order of
        answers: session (401), exact Origin and session CSRF (403), EDIT_MEMBERS (403), the ID and
        body (400), If-Match with the ETag of the editor's detail read (428 when missing; 412
        "changed" when the member changed since), 404 for an unknown or archived member. Audited as
        PUBLIC_LISTING_CHANGED. Returns the new ETag.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: If-Match
          in: header
          required: true
          description: The ETag of GET /v1/members/{memberId}/details
          schema: { type: string, pattern: '^"[1-9][0-9]{0,18}"$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicListing' }
      responses:
        '204':
          description: Changed
          headers:
            ETag:
              description: The member's new version
              schema: { type: string }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412':
          description: The member changed since it was read (code "changed")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '428':
          description: If-Match is missing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/members/{memberId}/js-person-number:
    parameters:
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Members]
      operationId: setMemberJsPersonNumber
      summary: Set or clear an active member's J+S person number (EDIT_MEMBERS, since 1.27.0)
      description: >
        Digits only, 1 to 12; null clears it. Order of answers: session (401), exact Origin and
        session CSRF (403), EDIT_MEMBERS (403), the ID and body (400), If-Match with the ETag of the
        editor's detail read (428 when missing; 412 "changed" when the member changed since), 404 for
        an unknown or archived member. Audited as JS_NUMBER_CHANGED. Returns the new ETag. The number
        is shown to editors, to the member in My profile and in the member export, and is used only
        in the J+S file.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: If-Match
          in: header
          required: true
          description: The ETag of GET /v1/members/{memberId}/details
          schema: { type: string, pattern: '^"[1-9][0-9]{0,18}"$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [jsPersonNumber]
              properties:
                jsPersonNumber: { type: [string, 'null'], pattern: '^[0-9]{1,12}$' }
      responses:
        '204':
          description: Changed
          headers:
            ETag:
              description: The member's new version
              schema: { type: string }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412':
          description: The member changed since it was read (code "changed")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '428':
          description: If-Match is missing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/events/{eventId}/presence:
    parameters:
      - name: eventId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Events]
      operationId: getEventPresence
      summary: Who came to an event, for the team's managers (since 1.27.0)
      description: >
        Needs MANAGE_TEAMS club-wide or for the event's team; without MANAGE_TEAMS anywhere 403,
        another team 403; an unknown event is 404 for a holder. People: active team members as
        PARTICIPANT, active members with a team-scoped MANAGE_TEAMS grant for the team as LEADER
        (also when they are in the team), and anyone already recorded, with the recorded role. Names
        by public display name (minors' first name and surname initial), with the member's answer.
        `open` is true once the event has started, unless it is cancelled. Not audited; never cacheable.
      responses:
        '200':
          description: The people and who came
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [open, items]
                properties:
                  open: { type: boolean }
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [memberId, displayName, role, response, present]
                      properties:
                        memberId: { type: string, format: uuid }
                        displayName: { type: string }
                        role: { type: string, enum: [PARTICIPANT, LEADER] }
                        response: { type: [string, 'null'], enum: ['YES', 'NO', MAYBE, null] }
                        present: { type: boolean }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      tags: [Events]
      operationId: replaceEventPresence
      summary: Record who came to an event (MANAGE_TEAMS, since 1.27.0)
      description: >
        Replaces the list of people who came with `present` (distinct member IDs, at most 500, each
        one of the event's people as in the read; anything else is 400). Order of answers: session
        (401), exact Origin and session CSRF (403), MANAGE_TEAMS somewhere (403), the ID and body
        (400), the event (403 for another team, 404 unknown), 409 "not_started" before the event
        starts or when it is cancelled, then 400 for a person who is not one of the event's people.
        The event row is locked while saving. A record stays with the event (also when the member
        leaves the team) and is deleted with it. Not audited.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [present]
              properties:
                present:
                  type: array
                  maxItems: 500
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
        '204': { description: Saved }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The event has not started or is cancelled (code "not_started")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/me/push:
    get:
      tags: [Notifications]
      operationId: getMyPush
      summary: Whether push is available and how many of the caller's devices receive it (since 1.33.0)
      description: >
        For every active member (403 otherwise). `publicKey` is the installation's VAPID public key
        (base64url) for the browser's push manager, null when push is off.
      responses:
        '200':
          description: The push status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [enabled, publicKey, devices]
                properties:
                  enabled: { type: boolean }
                  publicKey: { type: [string, 'null'] }
                  devices: { type: integer, minimum: 0, maximum: 5 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/me/push-subscriptions:
    put:
      tags: [Notifications]
      operationId: addPushSubscription
      summary: Receive push notifications on this device (since 1.33.0)
      description: >
        Exact Origin and session CSRF, an active membership (403), 409 "push_off" without a push
        configuration, then the endpoint (400 unless https, port 443, no user info, at most 1000
        characters and on one of the operator's push hosts). An endpoint already registered moves to the
        caller (the device belongs to whoever signed in last). Each member keeps the newest 5 devices.
        The server only ever sends empty pushes; the device then reads GET /v1/me/push-inbox. Not audited.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [endpoint]
              properties:
                endpoint: { type: string, format: uri, maxLength: 1000, description: The browser's push endpoint (https on an allowed push host) }
      responses:
        '204': { description: Done }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Push is not configured on this installation (code "push_off")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [Notifications]
      operationId: removePushSubscription
      summary: Stop push notifications on this device (since 1.33.0)
      description: As for adding; removes the endpoint if it is the caller's. A push service that reports an endpoint gone also removes it.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [endpoint]
              properties:
                endpoint: { type: string, format: uri, maxLength: 1000, description: The browser's push endpoint (https on an allowed push host) }
      responses:
        '204': { description: Done }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Push is not configured on this installation (code "push_off")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/me/push-inbox:
    get:
      tags: [Notifications]
      operationId: getMyPushInbox
      summary: What a woken device shows (since 1.33.0)
      description: >
        For every active member (403 otherwise): the caller's messages queued after `since` (RFC 3339,
        default two days ago) and within the last two days, newest first, at most 10: the message kind,
        the subject (as in the email) and when it was queued. The same per-kind switches apply as for
        email. Unknown or repeated parameters or a malformed `since` are 400. Never cacheable.
      parameters:
        - name: since
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: The messages
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 10
                    items:
                      type: object
                      additionalProperties: false
                      required: [kind, subject, createdAt]
                      properties:
                        kind: { type: string }
                        subject: { type: string }
                        createdAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/me/helper-duty:
    get:
      tags: [Fees]
      operationId: getMyHelperDuty
      summary: The caller's helper shifts this season (since 1.32.0)
      description: >
        For every active member (403 otherwise). `quota` is the club's number of shifts per season for a
        liable person (an adult in a team, or the guardian of an active minor in a team) and 0 for anyone
        else or when helper duty is off. `done` counts shifts that have started, of events not cancelled,
        in the season (Swiss dates), where the caller or one of their current minors signed up.
      responses:
        '200':
          description: The count
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [quota, done, seasonFrom, seasonTo]
                properties:
                  quota: { type: integer, minimum: 0, maximum: 50 }
                  done: { type: integer, minimum: 0 }
                  seasonFrom: { type: string, format: date }
                  seasonTo: { type: string, format: date }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/helper-duty:
    get:
      tags: [Fees]
      operationId: getHelperDuty
      summary: Who still owes helper shifts this season (MANAGE_FEES, since 1.32.0)
      description: >
        Every liable person by full name (adults only) with shifts done and still owed, fewest done first,
        and the club's quota and season month. 403 without MANAGE_FEES. Not audited.
      responses:
        '200':
          description: The overview
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [quota, seasonStartMonth, seasonFrom, seasonTo, items]
                properties:
                  quota: { type: integer, minimum: 0, maximum: 50 }
                  seasonStartMonth: { type: integer, minimum: 1, maximum: 12 }
                  seasonFrom: { type: string, format: date }
                  seasonTo: { type: string, format: date }
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [memberId, displayName, done, owed]
                      properties:
                        memberId: { type: string, format: uuid }
                        displayName: { type: string }
                        done: { type: integer, minimum: 0 }
                        owed: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/club/helper-duty:
    put:
      tags: [Fees]
      operationId: setHelperDuty
      summary: Set the helper quota and the season month (MANAGE_FEES, since 1.32.0)
      description: >
        Exact Origin and session CSRF, then MANAGE_FEES (403), then the body (400): `quota` 0–50 (0
        turns helper duty off) and `seasonStartMonth` 1–12 (the season starts on the first of that month).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [quota, seasonStartMonth]
              properties:
                quota: { type: integer, minimum: 0, maximum: 50 }
                seasonStartMonth: { type: integer, minimum: 1, maximum: 12 }
      responses:
        '204': { description: Saved }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/venues:
    get:
      tags: [Venues]
      operationId: listVenues
      summary: The club's fields and halls (since 1.30.0)
      description: >
        For every active member with a current sign-in (403 otherwise). `canManage` says whether the
        caller holds MANAGE_VENUES. Club content, no personal data; never cacheable.
      responses:
        '200':
          description: The venues by name
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [canManage, items]
                properties:
                  canManage: { type: boolean }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Venue' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [Venues]
      operationId: createVenue
      summary: Add a field or hall (MANAGE_VENUES, since 1.30.0)
      description: >
        Exact Origin and session CSRF, then MANAGE_VENUES (403), then the name (1–100 characters
        after trimming, no control characters; 400). 409 "duplicate" when the name exists, ignoring
        case. Not audited.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VenueInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The name exists (code "duplicate")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/venues/{venueId}:
    parameters:
      - name: venueId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Venues]
      operationId: renameVenue
      summary: Rename a field or hall (MANAGE_VENUES, since 1.30.0)
      description: As for creating; 404 for an unknown venue.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VenueInput' }
      responses:
        '204': { description: Renamed }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The name exists (code "duplicate")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [Venues]
      operationId: deleteVenue
      summary: Delete a field or hall (MANAGE_VENUES, since 1.30.0)
      description: Events that named it stay, without a venue. 404 for an unknown venue.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/venues/{venueId}/bookings:
    parameters:
      - name: venueId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: from
        in: query
        required: false
        description: RFC 3339, default now
        schema: { type: string, format: date-time }
      - name: to
        in: query
        required: false
        description: RFC 3339, default 14 days after `from`, at most 62 days after it
        schema: { type: string, format: date-time }
    get:
      tags: [Venues]
      operationId: listVenueBookings
      summary: When a field or hall is booked (since 1.30.0)
      description: >
        For every active member (403 otherwise). The events that are not cancelled and overlap the
        range, at most 500: team name, kind, title and times, never people. 404 for an unknown venue;
        unknown or repeated parameters, malformed times or a range over 62 days are 400.
      responses:
        '200':
          description: The bookings in time order
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [eventId, teamName, kind, title, startsAt, endsAt]
                      properties:
                        eventId: { type: string, format: uuid }
                        teamName: { type: string }
                        kind: { type: string, enum: [TRAINING, MATCH, OTHER] }
                        title: { type: string }
                        startsAt: { type: string, format: date-time }
                        endsAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/events/bulk:
    post:
      tags: [Events]
      operationId: changeEventsInBulk
      summary: Cancel, reinstate or move several events at once (MANAGE_TEAMS, since 1.29.0)
      description: >
        For `teamIds` (1 to 50, MANAGE_TEAMS needed for every one), the Swiss dates `from`..`to` (at
        most 366 days apart, 2000–2099) and `kinds`: every event of those kinds that has not started
        and would change is cancelled, reinstated or given `location` (SET_LOCATION only; null
        otherwise). With `preview` true nothing changes and `matched` says how many would. Order of
        answers: session (401), exact Origin and session CSRF (403), MANAGE_TEAMS somewhere (403),
        the body (400), then 403 if any team is not the caller's to manage (an unknown team is 404
        only for a club-wide manager), 409 "too_many" above 500 events. The update checks the grant
        again for each row; the whole change applies or none of it. Each member, and each guardian
        for a minor, of the affected teams gets one summary email (EVENT_CANCELLED or EVENT_CHANGED,
        their own switch) listing the events. Not audited.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [teamIds, from, to, kinds, action, location, preview]
              properties:
                teamIds:
                  type: array
                  minItems: 1
                  maxItems: 50
                  uniqueItems: true
                  items: { type: string, format: uuid }
                from: { type: string, format: date }
                to: { type: string, format: date }
                kinds:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { type: string, enum: [TRAINING, MATCH, OTHER] }
                action: { type: string, enum: [CANCEL, REINSTATE, SET_LOCATION, SET_VENUE] }
                venueId:
                  type: [string, 'null']
                  format: uuid
                  description: Since 1.30.0, for SET_VENUE only (null clears the venue); otherwise left out or null.
                location: { type: [string, 'null'], minLength: 1, maxLength: 200 }
                preview: { type: boolean }
      responses:
        '200':
          description: How many events matched and how many were changed (0 for a preview)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [matched, changed]
                properties:
                  matched: { type: integer, minimum: 0 }
                  changed: { type: integer, minimum: 0 }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: More than 500 events (code "too_many"), or SET_VENUE would book the venue twice (code "venue_taken")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/events/{eventId}/messages:
    parameters:
      - name: eventId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Events]
      operationId: sendCoachMessage
      summary: Email part of an event's people (MANAGE_TEAMS, since 1.31.0)
      description: >
        `audience` ALL (every active team member), YES (those whose answer, or absence, is yes), NO_ANSWER
        (without an answer) or SQUAD (the squad of a match). Each of them, and the guardians of a current
        minor among them (naming the child), gets a TEAM_MESSAGE email with the event, the sender's name,
        the subject (1–150 characters, one line) and the text (1–5000) if they have a verified sign-in,
        an address and `teamMessages` on; nobody sees any address. Order of answers: session (401), exact
        Origin and session CSRF (403), MANAGE_TEAMS somewhere (403), the ID and body (400), the event
        (403 another team; unknown 404 for a club-wide holder and 403 otherwise), then 409 "email_off"
        without a mail configuration, "closed" more than a day after the event ended, "not_match" for
        SQUAD on another kind, "limit" after 10 messages for the team within 24 hours. Answers the number
        of members addressed. Only the time, audience and that number are kept, never the text.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [audience, subject, body]
              properties:
                audience: { type: string, enum: [ALL, 'YES', NO_ANSWER, SQUAD] }
                subject: { type: string, minLength: 1, maxLength: 150 }
                body: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        '200':
          description: Queued
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [members]
                properties:
                  members: { type: integer, minimum: 0 }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: email_off, closed, not_match or limit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/events/{eventId}/squad:
    parameters:
      - name: eventId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Events]
      operationId: getEventSquad
      summary: The squad for a match, for the team's managers (since 1.28.0)
      description: >
        Needs MANAGE_TEAMS club-wide or for the match's team; without MANAGE_TEAMS anywhere 403,
        another team 403; an unknown event is 404 for a holder; an event that is not a match is 409
        "not_match". Every active team member by public display name with their answer and whether
        they are called up; `open` is true until the match starts, unless it is cancelled. Not audited.
      responses:
        '200':
          description: The squad
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [open, meetAt, meetingPoint, items]
                properties:
                  open: { type: boolean }
                  meetAt: { type: [string, 'null'], format: date-time }
                  meetingPoint: { type: [string, 'null'] }
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [memberId, displayName, response, called]
                      properties:
                        memberId: { type: string, format: uuid }
                        displayName: { type: string }
                        response: { type: [string, 'null'], enum: ['YES', 'NO', MAYBE, null] }
                        called: { type: boolean }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Not a match (code "not_match")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      tags: [Events]
      operationId: replaceEventSquad
      summary: Call up members for a match (MANAGE_TEAMS, since 1.28.0)
      description: >
        Replaces the squad: `memberIds` (distinct, at most 500, each an active team member, else
        400), `meetAt` (RFC 3339 or null) and `meetingPoint` (1 to 200 characters, or null). Order of
        answers: session (401), exact Origin and session CSRF (403), MANAGE_TEAMS somewhere (403), the
        ID and body (400), the event (403 another team, 404 unknown), 409 "not_match" for an event
        that is not a match and "closed" once it started or when it is cancelled. The event row is
        locked while saving. Members who were not in the squad before get a SQUAD_CALLED email (the
        guardians of a current minor, naming the child) if they have a verified sign-in, an address
        and `squadCalls` on. Removed members are not emailed. Not audited.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [memberIds, meetAt, meetingPoint]
              properties:
                memberIds:
                  type: array
                  maxItems: 500
                  uniqueItems: true
                  items: { type: string, format: uuid }
                meetAt: { type: [string, 'null'], format: date-time }
                meetingPoint: { type: [string, 'null'], minLength: 1, maxLength: 200 }
      responses:
        '204': { description: Saved }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Not a match ("not_match"), or started or cancelled ("closed")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/teams/{teamId}/js-attendance:
    parameters:
      - name: teamId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: from
        in: query
        required: false
        description: First day (Swiss date), default 12 months before `to`
        schema: { type: string, format: date }
      - name: to
        in: query
        required: false
        description: Last day (Swiss date), default today; at most 366 days after `from`
        schema: { type: string, format: date }
    get:
      tags: [Events]
      operationId: checkTeamJsAttendance
      summary: Check the J+S attendance file before downloading it (MANAGE_TEAMS, since 1.27.0)
      description: >
        For the team's trainings and matches that started in the range and were not cancelled:
        the number of rows the file will have, the display names of recorded people without a J+S
        person number (left out of the file) and the trainings without a place (title and date; the
        NDS needs a place for a training). Same access and parameter rules as the statistics, with
        MANAGE_TEAMS. Not audited.
      responses:
        '200':
          description: The check
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [from, to, rows, withoutNumber, trainingsWithoutPlace]
                properties:
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  rows: { type: integer, minimum: 0 }
                  withoutNumber: { type: array, items: { type: string } }
                  trainingsWithoutPlace: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/teams/{teamId}/js-attendance.csv:
    parameters:
      - name: teamId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: from
        in: query
        required: false
        schema: { type: string, format: date }
      - name: to
        in: query
        required: false
        schema: { type: string, format: date }
    get:
      tags: [Events]
      operationId: downloadTeamJsAttendance
      summary: The file for the NDS attendance import (MANAGE_TEAMS, since 1.27.0)
      description: >
        Semicolon-separated, UTF-8, CRLF lines, header PERSONENNUMMER;FUNKTION;DATUM;AKTIVITAETSTYP;
        ZEIT;DAUER;ORT. One row per recorded person with a J+S person number and event: FUNKTION
        Leiter/in or Teilnehmer/in, DATUM dd.MM.yyyy in Swiss time; a training is "Training" with
        ZEIT (HH:mm), DAUER (minutes) and ORT (the place, separators and line breaks replaced by
        spaces, a leading formula character dropped); a match is "Wettkampf" with the last three
        empty; other events are left out. A request another site started (Sec-Fetch-Site) is 403.
        Audited as JS_ATTENDANCE_EXPORTED against the caller's own member record. Otherwise as the check.
      responses:
        '200':
          description: The CSV file
          content:
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/me/events:
    get:
      tags: [Events]
      operationId: listMyEvents
      summary: The signed-in member's schedule (since 1.10.0)
      description: >
        Events overlapping [from, to) of the teams the caller is assigned to and of the teams of
        their current minors (the same guardianship rule as /v1/me/dependents), each with "for":
        whom among them it concerns (ID and first name). A team grant alone adds nothing here.
        The caller must be an active verified member (403 otherwise). At most 500 events, ordered
        by start; "truncated" says a narrower range shows the rest. Never cacheable.
      parameters:
        - name: from
          in: query
          required: false
          description: RFC 3339 date-time with offset; default now
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: RFC 3339 date-time with offset, after from and at most 366 days later; default from + 56 days
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: The caller's events
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, truncated]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/MyEvent' } }
                  truncated: { type: boolean }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/teams/{teamId}/events:
    parameters:
      - name: teamId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Events]
      operationId: listTeamEvents
      summary: A team's schedule (since 1.10.0)
      description: >
        Needs VIEW_TEAMS or MANAGE_TEAMS club-wide or for this team. Without any such grant the
        answer is 403 before the input is validated; with one for another team it is 403; an
        unknown team is 404 for a club-wide holder. canManage says whether the caller may change
        this team's events. At most 500 events by start, as for /v1/me/events.
      parameters:
        - name: from
          in: query
          required: false
          description: RFC 3339 date-time with offset; default now
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: RFC 3339 date-time with offset, after from and at most 366 days later; default from + 56 days
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: The team's events
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, truncated, canManage]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/TeamEvent' } }
                  truncated: { type: boolean }
                  canManage: { type: boolean }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [Events]
      operationId: createTeamEvents
      summary: Create an event, optionally repeated weekly (since 1.10.0)
      description: >
        Needs MANAGE_TEAMS club-wide or for this team; exact Origin and session CSRF. Without the
        grant anywhere the answer is 403 before the input is validated.
        Times are RFC 3339 with an offset and answered in UTC. kind is TRAINING, MATCH or OTHER;
        the title has 1–200 characters, location 1–200 and notes 1–2000 after trimming (blank
        optional text is stored as absent); the end is after the start and at most 7 days later;
        the start lies in 2000–2099.
        With repeatWeeklyUntil (a date) and timeZone (an IANA zone, both or neither) the event is
        also created every week up to and including that local date, keeping its local time in
        that zone across daylight-saving changes; at most 52 events in all. All or none are created.
        Not audited (no personal data).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/TeamEventInput'
              properties:
                repeatWeeklyUntil: { type: string, format: date }
                timeZone: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '201':
          description: The IDs of the created events, in date order
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ids]
                properties:
                  ids: { type: array, minItems: 1, maxItems: 52, items: { type: string, format: uuid } }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The field or hall is booked by another event at that time (code "venue_taken", with the clash)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueTaken' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/events/{eventId}:
    parameters:
      - name: eventId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Events]
      operationId: replaceTeamEvent
      summary: Replace one event, including cancelling it (since 1.10.0)
      description: >
        Needs MANAGE_TEAMS club-wide or for the event's team; exact Origin and session CSRF. All
        fields are replaced (omitted location or notes are cleared); cancelled is required.
        Times are RFC 3339 with an offset and answered in UTC. kind is TRAINING, MATCH or OTHER;
        the title has 1–200 characters, location 1–200 and notes 1–2000 after trimming (blank
        optional text is stored as absent); the end is after the start and at most 7 days later;
        the start lies in 2000–2099.
        403 without the grant for this event's team; an unknown event is 404 for a club-wide
        MANAGE_TEAMS holder and 403 for a team-scoped one (since 1.14.1).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/TeamEventInput'
              required: [cancelled]
              properties:
                cancelled: { type: boolean }
      responses:
        '204': { description: Event replaced }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The field or hall is booked by another event at that time (code "venue_taken", with the clash)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueTaken' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [Events]
      operationId: deleteTeamEvent
      summary: Delete one event (since 1.10.0)
      description: >
        Needs MANAGE_TEAMS club-wide or for the event's team; exact Origin and session CSRF. 403
        without the grant for this event's team; an unknown event is 404 for a club-wide holder
        and 403 for a team-scoped one (since 1.14.1). Deleting a team deletes its events.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Event deleted }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/public/join-requests:
    get:
      tags: [Join requests]
      operationId: getJoinRequestForm
      summary: Whether the public join form is open, and which teams one may wish for (since 1.22.0)
      description: No session. Team names only while the form is open; never cacheable.
      security: []
      responses:
        '200':
          description: The form state
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [open, teams]
                properties:
                  open: { type: boolean }
                  teams:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, name]
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [Join requests]
      operationId: submitJoinRequest
      summary: Apply to join the club (no session, since 1.22.0)
      description: >
        Order of answers: the exact Origin of the club's site (403); at most 5 submissions per
        client address and hour, kept only in memory, the address being the last X-Forwarded-For
        entry set by the bundled reverse proxy (429); the body (400): every required key, booleans as
        booleans, a strict date, the privacy notice accepted, kind SELF without parent fields or
        CHILD with both parent names. A non-empty `website` (a field hidden from people) is answered
        202 and dropped. Then 409 "closed" while the form is off, 409 "full" at 200 open requests,
        400 when SELF is not of adult age, CHILD is, or the team is unknown. A person (address, first
        name, birth date) who already has an open request is answered 202 and not stored again. No IP
        address is stored and no email is sent. Open requests are deleted after 60 days.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, firstName, lastName, dateOfBirth, email, phone, acceptedPrivacyNotice, website]
              properties:
                kind: { type: string, enum: [SELF, CHILD] }
                firstName: { type: string, minLength: 1, maxLength: 200, description: The applicant, or the child }
                lastName: { type: string, minLength: 1, maxLength: 200 }
                dateOfBirth: { type: string, format: date }
                email: { type: string, maxLength: 320, description: The applicant's, or for a child the parent's }
                phone: { type: string, maxLength: 40, description: The applicant's, or for a child the parent's }
                parentFirstName: { type: [string, 'null'], maxLength: 200, description: CHILD only }
                parentLastName: { type: [string, 'null'], maxLength: 200, description: CHILD only }
                teamId: { type: [string, 'null'], format: uuid }
                message: { type: [string, 'null'], maxLength: 500 }
                acceptedPrivacyNotice: { type: boolean, const: true }
                website: { type: string, description: Must be empty (honeypot) }
      responses:
        '202': { description: Received (also for a honeypot hit or a repeat) }
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The form is closed ("closed") or too many requests are open ("full")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Too many submissions from this address (code "too_many_requests")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/club/join-requests/settings:
    get:
      tags: [Join requests]
      operationId: getJoinRequestSettings
      summary: Whether the public join form is open (EDIT_MEMBERS, since 1.22.0)
      responses:
        '200':
          description: The switch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinRequestSettings' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      tags: [Join requests]
      operationId: setJoinRequestSettings
      summary: Open or close the public join form (EDIT_MEMBERS, since 1.22.0)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JoinRequestSettings' }
      responses:
        '204': { description: Changed }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/join-requests:
    get:
      tags: [Join requests]
      operationId: listJoinRequests
      summary: The open join requests, oldest first (EDIT_MEMBERS, since 1.22.0)
      description: >
        Includes the applicant's (or parent's) email and phone, so editors can get in touch. At most
        200. Never cacheable. Not audited (no member data).
      responses:
        '200':
          description: The requests
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, createdAt, kind, firstName, lastName, dateOfBirth, email, phone, parentFirstName, parentLastName, teamName, message]
                      properties:
                        id: { type: string, format: uuid }
                        createdAt: { type: string, format: date-time }
                        kind: { type: string, enum: [SELF, CHILD] }
                        firstName: { type: string }
                        lastName: { type: string }
                        dateOfBirth: { type: string, format: date }
                        email: { type: string }
                        phone: { type: string }
                        parentFirstName: { type: [string, 'null'] }
                        parentLastName: { type: [string, 'null'] }
                        teamName: { type: [string, 'null'] }
                        message: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/join-requests/{requestId}:
    parameters:
      - name: requestId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Join requests]
      operationId: declineJoinRequest
      summary: Decline (delete) a join request (EDIT_MEMBERS, since 1.22.0)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Declined and deleted }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/join-requests/{requestId}/accept:
    parameters:
      - name: requestId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Join requests]
      operationId: acceptJoinRequest
      summary: Accept a join request, creating the member (EDIT_MEMBERS, since 1.22.0)
      description: >
        In one transaction: creates the member with the usual checks and the MEMBER_CREATED audit
        event (an adult with the given email and phone, a child without contacts: link the parent as
        a guardian afterwards), assigns the wished team if it still exists, and deletes the request.
        409 "rejected" when the member cannot be created as requested (for example a child who has
        come of age needs contacts). 404 for an unknown request.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: The new member
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [memberId]
                properties:
                  memberId: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The member cannot be created as requested (code "rejected")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/me/absences:
    get:
      tags: [Absences]
      operationId: listMyAbsences
      summary: Current and future absences of the signed-in member and their minors (since 1.20.0)
      description: >
        For an active verified member (403 otherwise). `people` are the member and their current
        minors, for whom they may enter absences. Days are calendar days in the club's time zone.
        Never cacheable.
      responses:
        '200':
          description: The absences
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, people]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, memberId, firstName, from, to]
                      properties:
                        id: { type: string, format: uuid }
                        memberId: { type: string, format: uuid }
                        firstName: { type: string }
                        from: { type: string, format: date }
                        to: { type: string, format: date }
                  people:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, firstName]
                      properties:
                        id: { type: string, format: uuid }
                        firstName: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [Absences]
      operationId: createAbsence
      summary: Enter an absence for oneself or one's minor (since 1.20.0)
      description: >
        Session (401), exact Origin and session CSRF (403), an active verified member (403), the
        body (400), 403 for a member the caller may not act for, then 400 unless from is today or
        later, to is not before from, the absence lasts at most 366 days, ends within two years and
        the member has fewer than 20 current or future absences. No reason is stored. Every event of
        the member's teams that starts on one of these days and has no explicit answer counts as No
        for everyone who sees answers, counts or statistics; an explicit answer wins. Not audited;
        deleted 12 months after the last day; in the member export.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [memberId, from, to]
              properties:
                memberId: { type: string, format: uuid }
                from: { type: string, format: date }
                to: { type: string, format: date }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/absences/{absenceId}:
    parameters:
      - name: absenceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Absences]
      operationId: deleteAbsence
      summary: Delete an absence of oneself or one's minor (since 1.20.0)
      description: >
        Same order as entering; one 403 for every absence the caller may not delete, known or not.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/me/notifications:
    get:
      tags: [Notifications]
      operationId: getMyNotificationSettings
      summary: The signed-in member's email notification settings (since 1.19.0)
      description: >
        For an active member with a current verified identity (403 otherwise). Every switch is on
        and the language German until the member changes them. `emailEnabled` says whether this
        installation sends email at all (an SMTP server is configured); `hasEmail` whether the
        member has an address. Never cacheable.
      responses:
        '200':
          description: The settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/NotificationSettings'
                  - type: object
                    required: [helpersWanted, answerReminders, squadCalls, teamMessages, emailEnabled, hasEmail]
                    properties:
                      emailEnabled: { type: boolean }
                      hasEmail: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      tags: [Notifications]
      operationId: replaceMyNotificationSettings
      summary: Replace the signed-in member's email notification settings (since 1.19.0)
      description: >
        Session (401), exact Origin and session CSRF (403), an active verified member (403), then
        the body (400: every key exactly once, booleans as JSON booleans, language de, en, fr or
        it). Not audited.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationSettings' }
      responses:
        '204': { description: Replaced }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/me/calendar-feed:
    get:
      tags: [Calendar]
      operationId: getMyCalendarFeed
      summary: Whether the signed-in member has a calendar feed link (since 1.17.0)
      description: >
        For an active member with a current verified identity (403 otherwise). Never returns the
        link: it is shown only when created. Never cacheable.
      responses:
        '200':
          description: The feed status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [active, createdAt]
                properties:
                  active: { type: boolean }
                  createdAt: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [Calendar]
      operationId: createMyCalendarFeed
      summary: Create or replace the signed-in member's calendar feed link (since 1.17.0)
      description: >
        Session (401), exact Origin and session CSRF (403), an active verified member (403). Creates
        a new 256-bit secret and returns the full link once; only its SHA-256 is stored. Any earlier
        link stops working. No body. The link ends when it is replaced or revoked, when the member
        is archived or their login link changes, and stops answering while the member has no
        current verified identity.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: The new feed link, shown once
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [url]
                properties:
                  url: { type: string, format: uri, description: Absolute link, e.g. https://club.example/api/v1/calendar/<secret> }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [Calendar]
      operationId: revokeMyCalendarFeed
      summary: Revoke the signed-in member's calendar feed link (since 1.17.0)
      description: Same order of answers as creating. Revoking when there is no link is also 204.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/calendar/{secret}:
    parameters:
      - name: secret
        in: path
        required: true
        description: The feed secret (43 base64url characters). It is the credential; never log it.
        schema: { type: string }
    get:
      tags: [Calendar]
      operationId: getCalendarFeed
      summary: A member's calendar feed, for calendar apps (since 1.17.0)
      description: >
        No session: the secret is the credential. Returns RFC 5545 iCalendar with the events of My
        schedule (the member's own and their current minors' teams) from four weeks back to six
        months ahead: team and title, start and end in UTC, place, notes and whether the event is
        cancelled. Never names, answers, counts or shifts. An unknown, malformed or revoked secret,
        or one whose member may no longer sign in, is one 404. Cache-Control private, no-store;
        Referrer-Policy no-referrer; the web proxy does not log these requests.
      security: []
      responses:
        '200':
          description: The calendar
          content:
            text/calendar:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/events/{eventId}/shifts:
    parameters:
      - name: eventId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Shifts]
      operationId: listEventShifts
      summary: The volunteer shifts of one event (since 1.16.0)
      description: >
        For holders of VIEW_TEAMS or MANAGE_TEAMS for the event's team (club-wide or for the team),
        the team's members and the guardians of its current minor members. Without an active
        membership 403 before the ID is validated; 403 for an event the caller may not see; an
        unknown event is 404 for a club-wide VIEW_TEAMS or MANAGE_TEAMS holder and 403 otherwise.
        Each shift lists its volunteers by public display name only (adults' full names, minors'
        first name and surname initial), in sign-up order. `people` are the caller and their
        minors who belong to the team (whom the caller may sign up); `signedUp` lists which of
        them are signed up for a shift. Never cacheable. Not audited.
      responses:
        '200':
          description: The event's shifts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftList' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [Shifts]
      operationId: createEventShift
      summary: Add a volunteer shift to an event (MANAGE_TEAMS for the event's team, since 1.16.0)
      description: >
        Order of answers: session (401), exact Origin and session CSRF (403), an active membership
        (403), the ID and body (400), then 403 without MANAGE_TEAMS for the event's team (an
        unknown event is 404 only for a club-wide team holder). A shift lasts at most 24 hours, lies
        between a day before the event's start and a day after its end, and an event has at most 50
        shifts (400 otherwise). Not audited.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShiftInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/shifts/unfilled:
    get:
      tags: [Shifts]
      operationId: listUnfilledShifts
      summary: Helper shifts of the next 14 days that still need people (MANAGE_TEAMS, since 1.23.0)
      description: >
        For holders of MANAGE_TEAMS, club-wide or for at least one team. Lists the shifts that start
        within the next 14 days, belong to an event that is not cancelled and have fewer volunteers than
        places, only for the teams the caller manages, soonest first, at most 100 (`truncated` when there
        are more). Counts only: never who signed up. Without an active membership, or without
        MANAGE_TEAMS anywhere, 403. Never cacheable. Not audited.
      responses:
        '200':
          description: The shifts that still need people
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnfilledShiftList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/shifts/{shiftId}:
    parameters:
      - name: shiftId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Shifts]
      operationId: replaceShift
      summary: Change a shift (MANAGE_TEAMS for the event's team, since 1.16.0)
      description: >
        Same rules and order as creating. 409 "conflict" when the new number of places is below the
        number of volunteers (nothing changes); remove volunteers by deleting and re-creating the
        shift, or ask them to withdraw. The shift is locked, so no sign-up slips in between.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShiftInput' }
      responses:
        '204': { description: Changed }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Fewer places than volunteers (code "conflict")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [Shifts]
      operationId: deleteShift
      summary: Delete a shift with its sign-ups (MANAGE_TEAMS for the event's team, since 1.16.0)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/shifts/{shiftId}/volunteers/{memberId}:
    parameters:
      - name: shiftId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Shifts]
      operationId: signUpForShift
      summary: Sign up oneself or one's minor for a shift (since 1.16.0)
      description: >
        A member signs up themselves, a guardian their current minor, only for shifts of a team
        that member is assigned to. Order of answers: session (401), exact Origin and session CSRF
        (403), an active membership (403), the IDs (400), then one 403 for every shift or member the
        caller may not act for (including unknown ones), 409 "closed" once the shift has started or
        its event is cancelled and 409 "full" when no place is free. Signing up again is 204. Two
        sign-ups for the last place run one after the other, so exactly one succeeds. No body. Not
        audited; leaving the team ends the sign-ups.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Signed up }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The shift has started or its event is cancelled ("closed"), or it is full ("full")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [Shifts]
      operationId: withdrawFromShift
      summary: Withdraw oneself or one's minor from a shift (since 1.16.0)
      description: >
        Same rules as signing up; 409 "closed" once the shift has started. Withdrawing someone who
        is not signed up is 204.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Withdrawn }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The shift has started or its event is cancelled (code "closed")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/teams/{teamId}/attendance-statistics:
    parameters:
      - name: teamId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: from
        in: query
        required: false
        description: First day (UTC date), default 12 months before `to`
        schema: { type: string, format: date }
      - name: to
        in: query
        required: false
        description: Last day (UTC date), default today; at most 366 days after `from`
        schema: { type: string, format: date }
    get:
      tags: [Events]
      operationId: getTeamAttendanceStatistics
      summary: How each team member answered the team's past events (since 1.18.0)
      description: >
        Needs VIEW_TEAMS or MANAGE_TEAMS club-wide or for the team; without any such grant 403
        before the parameters are validated, 403 for another team; an unknown team is 404 for a
        club-wide holder and 403 otherwise. `held` counts the team's events that started in the
        range (UTC dates) and were not cancelled. Each active team member appears by public
        display name only (adults' full names, minors' first name and surname initial) with their
        Yes, No and Maybe answers to those events and the events without an answer; assignments
        carry no dates, so a member who joined later counts earlier events as unanswered. Answers
        are deleted 12 months after an event, so older ranges show them as unanswered. Unknown or
        repeated query parameters, malformed dates, from after to or a range over 366 days are
        400. Uses stored answers only; not audited; never cacheable.
      responses:
        '200':
          description: The statistics
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [from, to, held, items, totals]
                properties:
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  held: { type: integer, minimum: 0 }
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [displayName, 'yes', 'no', maybe, noAnswer]
                      properties:
                        displayName: { type: string }
                        'yes': { type: integer, minimum: 0 }
                        'no': { type: integer, minimum: 0 }
                        maybe: { type: integer, minimum: 0 }
                        noAnswer: { type: integer, minimum: 0 }
                  totals:
                    type: object
                    additionalProperties: false
                    required: ['yes', 'no', maybe, noAnswer]
                    properties:
                      'yes': { type: integer, minimum: 0 }
                      'no': { type: integer, minimum: 0 }
                      maybe: { type: integer, minimum: 0 }
                      noAnswer: { type: integer, minimum: 0 }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/events/{eventId}/rides:
    parameters:
      - name: eventId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Rides]
      operationId: listEventRides
      summary: The ride offers of one event (since 1.21.0)
      description: >
        Who may see them, and the order of refusals, are as for volunteer shifts: VIEW_TEAMS or
        MANAGE_TEAMS for the team, the team's members and the guardians of its current minor
        members (403 otherwise; an unknown event is 404 only for a club-wide team holder). Drivers
        and passengers appear by display name. Phones (owner decision): `driverPhone` only for a
        caller who booked a seat on that ride (for themselves or a minor); each passenger's `phone`
        only for the driver (for a minor, the phone of the guardian who booked); null otherwise.
        `people` are the caller and their minors in the team (whom they may book for), `booked`
        which of them hold a seat, `canOffer` whether the caller may offer a ride. Never cacheable.
      responses:
        '200':
          description: The rides
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideList' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [Rides]
      operationId: offerRide
      summary: Offer a ride to an event (since 1.21.0)
      description: >
        Session (401), exact Origin and session CSRF (403), an active membership (403), the ID and
        body (400), then 403 unless the caller is an adult in the event's team or the guardian of a
        current minor in it (an unknown event is 404 only for a club-wide team holder), 400 for a
        departure outside a day before the event's start to its end, 409 "exists" when the caller
        already offers a ride to this event. Not audited.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RideInput' }
      responses:
        '201':
          description: Offered
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The caller already offers a ride to this event (code "exists")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/rides/{rideId}:
    parameters:
      - name: rideId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Rides]
      operationId: replaceRide
      summary: Change one's own ride offer (since 1.21.0)
      description: >
        Only the driver (403 otherwise; an unknown ride is 404 only for a club-wide team holder).
        Same rules as offering; 409 "conflict" for fewer seats than bookings. The ride is locked,
        so no booking slips in between.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RideInput' }
      responses:
        '204': { description: Changed }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Fewer seats than bookings (code "conflict")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [Rides]
      operationId: deleteRide
      summary: Withdraw a ride (the driver) or remove it (MANAGE_TEAMS for the team) (since 1.21.0)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Deleted with its bookings }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/rides/{rideId}/passengers/{memberId}:
    parameters:
      - name: rideId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Rides]
      operationId: bookRideSeat
      summary: Book a seat for oneself or one's minor (since 1.21.0)
      description: >
        Only for a member of the event's team: oneself, or a guardian for their current minor. One
        403 for every ride or member the caller may not book for; 409 "closed" after departure or
        for a cancelled event; 409 "full" without a free seat (the ride is locked, so the last seat
        goes to one person). Booking again is 204. Leaving the team ends the booking.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Booked }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Departed or cancelled ("closed"), or no free seat ("full")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [Rides]
      operationId: cancelRideSeat
      summary: Cancel a seat for oneself or one's minor (since 1.21.0)
      description: Same rules as booking; 409 "closed" after departure; cancelling a seat not held is 204.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Cancelled }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Departed or cancelled (code "closed")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/events/{eventId}/attendance:
    parameters:
      - name: eventId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Events]
      operationId: listEventAttendance
      summary: Every team member's answer for one event (since 1.11.0)
      description: >
        Needs VIEW_TEAMS or MANAGE_TEAMS club-wide or for the event's team; without any such grant
        403 before the ID is validated, 403 for another team's event; an unknown event is 404 for a
        club-wide VIEW_TEAMS or MANAGE_TEAMS holder and 403 otherwise (since 1.14.1).
        Lists the team's active members by public display name only (adults' full names, minors'
        first name and surname initial; no IDs, birth dates or contacts) with their answer or null,
        and the totals. Never cacheable.
      responses:
        '200':
          description: Answers and totals
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, counts]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [displayName, response]
                      properties:
                        displayName: { type: string }
                        response: { type: [string, 'null'], enum: ['YES', 'NO', MAYBE, null] }
                  counts: { $ref: '#/components/schemas/AttendanceCounts' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/events/{eventId}/attendance-reminders:
    parameters:
      - name: eventId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Events]
      operationId: remindMissingAnswers
      summary: Remind everyone in the team who has not answered (MANAGE_TEAMS for the event's team, since 1.25.0)
      description: >
        Order of answers: session (401), exact Origin and session CSRF (403), MANAGE_TEAMS for some
        team (403), the ID (400), then 403 without MANAGE_TEAMS for the event's team (an unknown
        event is 404 only for a club-wide team holder). 409 `closed` once the event has started or
        is cancelled, 409 `email_off` when the installation sends no email, 409 `recent` within
        12 hours of the previous reminder for this event. Otherwise each active team member without
        an answer (an absence counts as an answer) and, for a current minor, their guardians are
        emailed if they have a verified sign-in, an address and `answerReminders` on. The answer
        says how many members had not answered; never who. Not audited.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Reminders queued
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [reminded]
                properties:
                  reminded: { type: integer, minimum: 0, description: Team members without an answer }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/events/{eventId}/attendance/{memberId}:
    parameters:
      - name: eventId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Events]
      operationId: answerEventAttendance
      summary: Answer for oneself or one's minor (since 1.11.0)
      description: >
        The caller answers for themselves or for their current minor (the guardianship rule of
        /v1/me/dependents), for an event of a team that member is assigned to. Order: session (401),
        exact Origin and CSRF (403), an active verified membership (403), IDs and body (400; only
        "response", no reason), then one 403 for every event or member the caller may not answer
        for, and 409 once the event has started or is cancelled. Replaces an earlier answer.
        Not audited.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [response]
              properties:
                response: { type: string, enum: ['YES', 'NO', MAYBE] }
      responses:
        '204': { description: Answer saved }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [Events]
      operationId: clearEventAttendance
      summary: Clear one's own or one's minor's answer (since 1.11.0)
      description: >
        The same rules as the answer; clearing a missing answer is also 204. 409 once the event has
        started or is cancelled.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Answer cleared }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/fee-periods:
    get:
      tags: [Fees]
      operationId: listFeePeriods
      summary: Fee periods with totals (since 1.12.0)
      description: >
        Needs the club-wide MANAGE_FEES capability (403 otherwise). Newest due date first, with the
        number of members included, how many paid, and the total and paid amounts in Swiss cents.
      responses:
        '200':
          description: Fee periods
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, name, dueDate, amountCents, members, paid, totalCents, paidCents]
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        dueDate: { type: string, format: date }
                        amountCents: { type: integer, minimum: 0 }
                        members: { type: integer, minimum: 0 }
                        paid: { type: integer, minimum: 0 }
                        totalCents: { type: integer, minimum: 0 }
                        paidCents: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [Fees]
      operationId: createFeePeriod
      summary: Create a fee period that includes every active member (since 1.12.0)
      description: >
        MANAGE_FEES, exact Origin and session CSRF; 403 before the body is validated. name has
        1–200 characters after trimming and is unique ignoring case (409); dueDate lies in
        2000–2099; amountCents is a whole JSON number from 0 to 10,000,000 (CHF 100,000). Every
        active member gets a fee at that amount, each audited as FEE_ASSIGNED. Tracking only.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, dueDate, amountCents]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                dueDate: { type: string, format: date }
                amountCents: { type: integer, minimum: 0, maximum: 10000000 }
      responses:
        '201':
          description: The new period
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/fee-periods/{periodId}:
    parameters:
      - name: periodId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Fees]
      operationId: renameFeePeriod
      summary: Change a period's name and due date (since 1.12.0)
      description: >
        MANAGE_FEES, exact Origin and session CSRF. The members' amounts are unchanged. 404 for an
        unknown period, 409 when another period has the name.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, dueDate]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                dueDate: { type: string, format: date }
      responses:
        '204': { description: Period changed }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [Fees]
      operationId: deleteFeePeriod
      summary: Delete a period and all its fees (since 1.12.0)
      description: >
        MANAGE_FEES, exact Origin and session CSRF. The body repeats the period's exact name as a
        confirmation (409 when it differs). Each removed fee is audited as FEE_REMOVED.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string }
      responses:
        '204': { description: Period deleted }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/fee-periods/{periodId}/fees:
    parameters:
      - name: periodId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Fees]
      operationId: listFees
      summary: The members' fees in one period (since 1.12.0)
      description: >
        MANAGE_FEES (403 before the input is validated). status is all (default: every fee, also of
        archived members), open, paid, or excluded (active members without a fee, amountCents and
        paidOn null). By last and first name. 404 for an unknown period.
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [all, open, paid, excluded] }
      responses:
        '200':
          description: Fees
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [memberId, firstName, lastName, archived, amountCents, paidOn, reference]
                      properties:
                        memberId: { type: string, format: uuid }
                        firstName: { type: string }
                        lastName: { type: string }
                        archived: { type: boolean }
                        amountCents: { type: [integer, 'null'], minimum: 0 }
                        paidOn: { type: [string, 'null'], format: date }
                        reference:
                          type: [string, 'null']
                          description: >
                            Since 1.26.0. The payment reference printed on this member's QR bill, formatted as on the
                            bill (a 27-digit QR reference for a QR-IBAN, otherwise an ISO 11649 creditor reference
                            RFxx P<period>M<fee>); null for an excluded member or while no payment details are set.
                          examples: ['RF79 P12M 345', '00 00001 20000 00000 00000 03450']
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/fee-periods/{periodId}/fees/{memberId}:
    parameters:
      - name: periodId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Fees]
      operationId: setFee
      summary: Set one member's amount and payment (since 1.12.0)
      description: >
        MANAGE_FEES, exact Origin and session CSRF. Includes an excluded active member (409 for an
        archived member who has no fee; an archived member's existing fee can still be marked
        paid). paidOn is a date or null (open). Audited per change: FEE_ASSIGNED, FEE_CHANGED,
        FEE_PAID, FEE_UNPAID. 404 for an unknown period or member.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amountCents, paidOn]
              properties:
                amountCents: { type: integer, minimum: 0, maximum: 10000000 }
                paidOn: { type: [string, 'null'], format: date }
      responses:
        '204': { description: Fee set }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [Fees]
      operationId: removeFee
      summary: Exclude a member from a period (since 1.12.0)
      description: >
        MANAGE_FEES, exact Origin and session CSRF. Audited as FEE_REMOVED when a fee existed;
        excluding again is 204. 404 for an unknown period.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Member excluded }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/me/fees:
    get:
      tags: [Fees]
      operationId: listMyFees
      summary: The signed-in member's own fees and their minors' (since 1.12.0)
      description: >
        For an active verified member (403 otherwise): their own fees and those of their current
        minors (the rule of /v1/me/dependents), newest due date first, each with whom it is for.
        Not audited. Never cacheable.
      responses:
        '200':
          description: Fees
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [periodId, periodName, dueDate, amountCents, paidOn, for, qrBill]
                      properties:
                        periodId: { type: string, format: uuid }
                        periodName: { type: string }
                        dueDate: { type: string, format: date }
                        amountCents: { type: integer, minimum: 0 }
                        paidOn: { type: [string, 'null'], format: date }
                        for:
                          type: object
                          additionalProperties: false
                          required: [id, firstName]
                          properties:
                            id: { type: string, format: uuid }
                            firstName: { type: string }
                        qrBill:
                          type: boolean
                          description: >
                            Since 1.26.0. True when a QR bill can be downloaded: the fee is open, its amount is above
                            zero and the club has payment details.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/me/fees/{periodId}/{memberId}/qr-bill:
    parameters:
      - name: periodId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Fees]
      operationId: downloadQrBill
      summary: The Swiss QR bill of an open fee as an A4 PDF (since 1.26.0)
      description: >
        Order: session (401), an active verified member (403), the input (400), then the member must be
        the caller or the caller's current minor (the rule of GET /v1/me/fees, 403 otherwise), a fee in
        that period (404 for an unknown period or an excluded member), an open fee above zero (409
        not_open for a paid fee or nothing to pay) and the club's payment details (409
        no_payment_details). The bill carries the amount in CHF, the club's account and address, the
        payment reference (a QR reference for a QR-IBAN, otherwise an ISO 11649 creditor reference,
        the same as in the treasurer's list) and the message "<period name> - <first name> <last name>"
        (at most 140 characters); a header above it names the period, the member, the amount, the due
        date and the reference. The payer's address stays empty. lang chooses the language of the bill.
        Generated on demand, never stored, not audited. An attachment, never cacheable, nosniff.
      parameters:
        - name: lang
          in: query
          required: false
          schema: { type: string, enum: [de, en, fr, it], default: en }
      responses:
        '200':
          description: The PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/club/payment-details:
    get:
      tags: [Fees]
      operationId: getPaymentDetails
      summary: The club's payment details for QR bills (MANAGE_FEES, since 1.26.0)
      description: MANAGE_FEES (403). 404 while none are set. Not personal data of members.
      responses:
        '200':
          description: The payment details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentDetails' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      tags: [Fees]
      operationId: setPaymentDetails
      summary: Replace the club's payment details (MANAGE_FEES, since 1.26.0)
      description: >
        Exact Origin, session CSRF and MANAGE_FEES (403) before the body is read. The IBAN must be
        Swiss or Liechtenstein (21 characters, spaces ignored) with a valid mod-97 checksum; a QR-IBAN
        (institution ID 30000-31999) is detected and gets QR references. Holder name 1-70 characters,
        street up to 70, building number up to 16 (only with a street), postal code 1-16, town 1-35,
        country CH or LI; street and building number may be left out or null. Text is trimmed. Each
        change is audited as PAYMENT_DETAILS_CHANGED (actor and time, identifiers only).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentDetailsInput' }
      responses:
        '204': { description: Replaced }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/members/export.csv:
    get:
      tags: [Members]
      operationId: exportMemberList
      summary: The active members as a CSV file for Excel (since 1.13.0)
      description: >
        Needs EDIT_MEMBERS. Order: session (401), a browser request started by another site
        (Sec-Fetch-Site other than same-origin or none, 403), the grant (403), then lang (400).
        Semicolon-separated UTF-8 with a BOM; header in the chosen language; one row per active
        member: first name, last name, date of birth (31.12.2010), email, phone, gender, player
        (yes/no in that language), role, team names. A cell starting with =, +, -, @, tab or CR is
        prefixed with an apostrophe so no spreadsheet evaluates it. Every listed member is audited
        as MEMBER_LISTED. An attachment, never cacheable, nosniff.
      parameters:
        - name: lang
          in: query
          required: false
          schema: { type: string, enum: [de, en, fr, it], default: en }
      responses:
        '200':
          description: The CSV file
          content:
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/members/import:
    post:
      tags: [Members]
      operationId: importMemberList
      summary: Preview or import new members from a CSV file (since 1.13.0)
      description: >
        Needs EDIT_MEMBERS; exact Origin and session CSRF; 403 before the file is read. The body is
        a CSV file (Content-Type text/csv, at most 512 KiB and 1,000 data rows; UTF-8 with or
        without BOM, or Windows-1252; semicolon or comma separated). The header row needs first
        name, last name and date of birth columns and may have email, phone, gender and player, in
        German, English, French or Italian; other columns are ignored. Dates as 31.12.2010 or
        2010-12-31. An unusable file is 400. Each row is OK, DUPLICATE (an existing member, also
        archived, with the same first name, last name and birth date ignoring case) or INVALID
        with its problems, under the club's current rules. mode=preview changes nothing;
        mode=commit creates exactly the OK rows in one transaction (never changing an existing
        member), each audited as MEMBER_CREATED, and reports how many were created.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: mode
          in: query
          required: true
          schema: { type: string, enum: [preview, commit] }
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string, maxLength: 524288 }
      responses:
        '200':
          description: Every row's result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [rows, counts, created]
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [line, firstName, lastName, status, problems]
                      properties:
                        line: { type: integer, minimum: 2 }
                        firstName: { type: string }
                        lastName: { type: string }
                        status: { type: string, enum: [OK, DUPLICATE, INVALID] }
                        problems:
                          type: array
                          items:
                            type: string
                            enum: [FIRST_NAME, LAST_NAME, DATE_OF_BIRTH, EMAIL, PHONE, GENDER, PLAYER,
                                   ADULT_CONTACTS, GENDER_REQUIRED, DUPLICATE_IN_FILE]
                  counts:
                    type: object
                    additionalProperties: false
                    required: [ok, duplicate, invalid]
                    properties:
                      ok: { type: integer, minimum: 0 }
                      duplicate: { type: integer, minimum: 0 }
                      invalid: { type: integer, minimum: 0 }
                  created: { type: [integer, 'null'], minimum: 0 }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/me/announcements:
    get:
      tags: [Announcements]
      operationId: listMyAnnouncements
      summary: The signed-in member's current announcements (since 1.14.0)
      description: >
        For an active verified member (403 otherwise): announcements whose show-until date is
        today or later, newest first (at most 100): club-wide ones, those of the teams the caller
        is assigned to, of their current minors' teams (the rule of /v1/me/dependents) and of the
        teams they manage. canManage says whether the caller may change one; audiences lists where
        the caller may post (teamId null for the whole club). Never cacheable.
      responses:
        '200':
          description: Announcements
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, audiences]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, teamId, teamName, title, body, showUntil, createdAt, canManage]
                      properties:
                        id: { type: string, format: uuid }
                        teamId: { type: [string, 'null'], format: uuid }
                        teamName: { type: [string, 'null'] }
                        title: { type: string }
                        body: { type: string, description: Plain text with line breaks }
                        showUntil: { type: string, format: date }
                        createdAt: { type: string, format: date-time }
                        canManage: { type: boolean }
                  audiences:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [teamId, teamName]
                      properties:
                        teamId: { type: [string, 'null'], format: uuid }
                        teamName: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/announcements:
    post:
      tags: [Announcements]
      operationId: createAnnouncement
      summary: Post an announcement to the club or one team (since 1.14.0)
      description: >
        Exact Origin and session CSRF. A caller holding neither POST_ANNOUNCEMENTS nor MANAGE_TEAMS
        anywhere gets 403 before the body is read. teamId null posts club-wide and needs the
        club-wide POST_ANNOUNCEMENTS; a team id needs MANAGE_TEAMS for that team (403 otherwise; an
        unknown team is 404 for a club-wide holder of MANAGE_TEAMS or POST_ANNOUNCEMENTS and 403
        otherwise, since 1.14.1). Plain text only, up to 32 KiB of JSON. Not audited (club content).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                body: { type: string, minLength: 1, maxLength: 5000 }
                showUntil: { type: string, format: date, description: 'From today to one year ahead; default today + 60 days' }
                teamId: { type: [string, 'null'], format: uuid }
              required: [teamId, title, body]
      responses:
        '201':
          description: The new announcement
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/announcements/{announcementId}:
    parameters:
      - name: announcementId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Announcements]
      operationId: replaceAnnouncement
      summary: Change an announcement's text and show-until date (since 1.14.0)
      description: >
        The same rights as posting to its audience, which cannot change. 403 without them; an
        unknown announcement is 404 for a club-wide holder and 403 otherwise (since 1.14.1).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                body: { type: string, minLength: 1, maxLength: 5000 }
                showUntil: { type: string, format: date, description: 'From today to one year ahead; default today + 60 days' }
              required: [title, body]
      responses:
        '204': { description: Announcement changed }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [Announcements]
      operationId: deleteAnnouncement
      summary: Delete an announcement (since 1.14.0)
      description: >
        The same rights as posting to its audience; 403 without them; an unknown announcement is
        404 for a club-wide holder and 403 otherwise (since 1.14.1).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Announcement deleted }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: >
        Secret returned by authenticated GET /v1/auth/me; must belong to the
        same unexpired session cookie. Also require exact configured Origin.
      schema: { type: string, minLength: 43, maxLength: 43 }
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: __Host-openclub_session
      description: >
        Verified OIDC-backed server-side session, with local loopback
        development cookie openclub_dev_session. A login is not an authorization.
  schemas:
    ClubReference:
      type: object
      additionalProperties: false
      required: [id, name, slug, genderRequiredForPlayers, adultAgeYears]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        slug: { type: string, minLength: 3, maxLength: 60, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        genderRequiredForPlayers: { type: boolean }
        adultAgeYears:
          type: integer
          minimum: 13
          maximum: 25
          description: Age from which a member is an adult in this club (since 1.1.0).
    MemberReference:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { type: string, format: uuid }
    PublicMemberName:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 402
          examples: [Peter Smith, Peter S.]
          description: Only the server-formatted public name; minors get first name and last-name initial.
    MemberSummary:
      type: object
      additionalProperties: false
      required: [id, firstName, lastName]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string, minLength: 1, maxLength: 200 }
        lastName: { type: string, minLength: 1, maxLength: 200 }
    ArchivedMemberPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [id, firstName, lastName, archivedAt]
            properties:
              id: { type: string, format: uuid }
              firstName: { type: string, minLength: 1, maxLength: 200 }
              lastName: { type: string, minLength: 1, maxLength: 200 }
              archivedAt: { type: string, format: date-time }
        nextCursor: { type: string, minLength: 1, maxLength: 2048 }
    MemberPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/MemberSummary' }
        nextCursor:
          type: string
          minLength: 1
          maxLength: 2048
          description: Absent on the last page.
    MemberNames:
      type: object
      additionalProperties: false
      required: [firstName, lastName]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 200 }
        lastName: { type: string, minLength: 1, maxLength: 200 }
    NewMember:
      type: object
      additionalProperties: false
      required: [firstName, lastName, dateOfBirth]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 200 }
        lastName: { type: string, minLength: 1, maxLength: 200 }
        dateOfBirth:
          type: string
          format: date
          description: Required for all members; no future dates. Private, never directory-visible.
        email:
          type: string
          format: email
          maxLength: 320
          description: Required for adults under the locally configured threshold.
        phone:
          type: string
          minLength: 1
          maxLength: 40
          description: Required alongside email for adults.
        gender:
          type: string
          minLength: 1
          description: Optional unless the club requires gender for players; not binary-only.
        isPlayer: { type: boolean, default: false }
    Team:
      type: object
      additionalProperties: false
      required: [id, name, memberCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        memberCount: { type: integer, minimum: 0 }
    TeamPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Team' }
    TeamName:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
    GrantView:
      type: object
      additionalProperties: false
      required: [capability, scope]
      properties:
        capability:
          type: string
          enum: [VIEW_MEMBER_DIRECTORY, EDIT_MEMBERS, MANAGE_PERMISSIONS, VIEW_TEAMS, MANAGE_TEAMS, MANAGE_FEES, POST_ANNOUNCEMENTS, MANAGE_VENUES]
        scope: { type: string, enum: [CLUB, TEAM] }
        teamId: { type: string, format: uuid }
    GrantPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GrantView' }
    GrantMutation:
      type: object
      additionalProperties: false
      required: [memberId, capability, scope]
      properties:
        memberId: { type: string, format: uuid }
        capability:
          type: string
          enum: [VIEW_MEMBER_DIRECTORY, EDIT_MEMBERS, MANAGE_PERMISSIONS, VIEW_TEAMS, MANAGE_TEAMS, MANAGE_FEES, POST_ANNOUNCEMENTS, MANAGE_VENUES]
        scope: { type: string, enum: [CLUB, TEAM] }
        teamId: { type: string, format: uuid }
    Invitation:
      type: object
      additionalProperties: false
      required: [secret, expiresAt]
      properties:
        secret:
          type: string
          minLength: 43
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
          description: 256 random bits, base64url. Returned once; only its hash is stored.
        expiresAt: { type: string, format: date-time }
    InvitationSecret:
      type: object
      additionalProperties: false
      required: [secret]
      properties:
        secret:
          type: string
          minLength: 43
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
    MemberDetails:
      type: object
      additionalProperties: false
      required: [id, firstName, lastName]
      description: >
        Only the fields the caller may read are present. null means readable and not set; an absent
        key means not permitted. Team managers see only id, names, email, phone and isPlayer.
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string, minLength: 1, maxLength: 200 }
        lastName: { type: string, minLength: 1, maxLength: 200 }
        dateOfBirth: { type: [string, 'null'], format: date }
        email: { type: [string, 'null'], format: email, maxLength: 320 }
        phone: { type: [string, 'null'], minLength: 1, maxLength: 40 }
        gender: { type: [string, 'null'], minLength: 1, maxLength: 200 }
        isPlayer: { type: boolean }
        archivedAt: { type: [string, 'null'], format: date-time }
        hasLinkedLogin:
          type: boolean
          description: Whether a sign-in account is linked; never the account or its identifiers.
        listedPublicly:
          type: boolean
          description: Whether the name is on the public member list (editors only, since 1.15.0).
        jsPersonNumber:
          type: [string, 'null']
          pattern: '^[0-9]{1,12}$'
          description: The J+S person number (editors only, since 1.27.0).
        invitation:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status: { type: string, enum: [NONE, OPEN] }
            expiresAt: { type: string, format: date-time }
    ErasureConfirmation:
      type: object
      additionalProperties: false
      required: [confirmation]
      properties:
        confirmation:
          type: string
          minLength: 1
          maxLength: 402
          description: The member's full name, first name then last name, exactly as stored.
    GuardianReference:
      type: object
      additionalProperties: false
      required: [guardianMemberId]
      properties:
        guardianMemberId: { type: string, format: uuid }
    GuardianList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 2
          items: { $ref: '#/components/schemas/MemberSummary' }
    DependentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/MemberSummary' }
    DependentDetails:
      type: object
      additionalProperties: false
      required: [id, firstName, lastName, dateOfBirth, email, phone, isPlayer, teams]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string, minLength: 1, maxLength: 200 }
        lastName: { type: string, minLength: 1, maxLength: 200 }
        dateOfBirth: { type: string, format: date }
        email: { type: [string, 'null'], format: email, maxLength: 320 }
        phone: { type: [string, 'null'], minLength: 1, maxLength: 40 }
        isPlayer: { type: boolean }
        teams:
          type: array
          items: { type: string, minLength: 1, maxLength: 200 }
    MyProfile:
      type: object
      additionalProperties: false
      required: [id, firstName, lastName, dateOfBirth, email, phone, gender, isPlayer, role, teams, listedPublicly, jsPersonNumber]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        dateOfBirth: { type: string, format: date }
        email: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        gender: { type: [string, 'null'] }
        isPlayer: { type: boolean }
        role: { type: string, enum: [ADMIN, MEMBER] }
        listedPublicly: { type: boolean, description: Whether the name is on the public member list (since 1.15.0) }
        jsPersonNumber: { type: [string, 'null'], description: The J+S person number set by the club (since 1.27.0) }
        teams:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
    TeamEventInput:
      type: object
      required: [kind, title, startsAt, endsAt]
      properties:
        kind: { type: string, enum: [TRAINING, MATCH, OTHER] }
        title: { type: string, minLength: 1, maxLength: 200 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        location: { type: [string, 'null'], maxLength: 200 }
        notes: { type: [string, 'null'], maxLength: 2000 }
        venueId:
          type: [string, 'null']
          format: uuid
          description: >
            Since 1.30.0. A field or hall of the club (unknown is 400). Two events that are not
            cancelled never hold the same venue at overlapping times (409 venue_taken); every weekly
            copy is checked, and all or none are created.
    TeamEvent:
      type: object
      additionalProperties: false
      required: [id, teamId, teamName, kind, title, startsAt, endsAt, location, notes, cancelled, counts, venueId, venueName]
      properties:
        id: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        teamName: { type: string }
        kind: { type: string, enum: [TRAINING, MATCH, OTHER] }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        location: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        cancelled: { type: boolean }
        counts: { $ref: '#/components/schemas/AttendanceCounts' }
        venueId: { type: [string, 'null'], format: uuid, description: Since 1.30.0 }
        venueName: { type: [string, 'null'], description: Since 1.30.0 }
    Venue:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    VenueInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    VenueTaken:
      type: object
      additionalProperties: false
      required: [code, clash]
      properties:
        code: { type: string, enum: [venue_taken] }
        clash:
          type: object
          additionalProperties: false
          required: [teamName, title, startsAt]
          properties:
            teamName: { type: string }
            title: { type: string }
            startsAt: { type: string, format: date-time }
    AttendanceCounts:
      type: object
      additionalProperties: false
      required: ['yes', 'no', maybe]
      properties:
        'yes': { type: integer, minimum: 0 }
        'no': { type: integer, minimum: 0 }
        maybe: { type: integer, minimum: 0 }
    MyEvent:
      allOf:
        - $ref: '#/components/schemas/TeamEvent'
      required: [for]
      properties:
        for:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [id, firstName, response, squad]
            properties:
              id: { type: string, format: uuid }
              firstName: { type: string }
              response: { type: [string, 'null'], enum: ['YES', 'NO', MAYBE, null] }
              squad:
                description: >
                  Since 1.28.0. Null unless the event is a match with a saved squad; then whether this person
                  is called up, with the meeting time and point only when called.
                oneOf:
                  - type: 'null'
                  - type: object
                    additionalProperties: false
                    required: [called, meetAt, meetingPoint]
                    properties:
                      called: { type: boolean }
                      meetAt: { type: [string, 'null'], format: date-time }
                      meetingPoint: { type: [string, 'null'] }
    DependentContacts:
      type: object
      additionalProperties: false
      properties:
        email: { type: string, format: email, minLength: 3, maxLength: 320 }
        phone: { type: string, minLength: 1, maxLength: 40 }
    NotificationSettings:
      type: object
      required: [eventChanges, newEvents, announcements, shiftReminders, language]
      description: >
        Which emails the member receives: changed or cancelled events, new events (a weekly series
        is one message), announcements, a reminder within 24 hours before a volunteer shift, and
        (since 1.24.0) a call for helpers seven days before a shift of their team that still has
        free places, once per shift and one message per event, not to people who already help at
        that event or whose child does. A guardian receives them for their current minors' teams too.
      properties:
        eventChanges: { type: boolean }
        newEvents: { type: boolean }
        announcements: { type: boolean }
        shiftReminders: { type: boolean }
        helpersWanted: { type: boolean, description: Since 1.24.0. Always in GET; optional in PUT (left out keeps the stored value). }
        answerReminders: { type: boolean, description: Since 1.25.0. Email when an event of the member's team (or a minor's) still lacks their answer, two days before and when a coach asks. Always in GET; optional in PUT. }
        squadCalls: { type: boolean, description: Since 1.28.0. Email when the member (or a minor) is called up for a match. Always in GET; optional in PUT. }
        teamMessages: { type: boolean, description: Since 1.31.0. Email messages from the coach of the member's (or a minor's) team. Always in GET; optional in PUT. }
        language: { type: string, enum: [de, en, fr, it] }
    PaymentDetailsInput:
      type: object
      additionalProperties: false
      required: [iban, holderName, postalCode, town, country]
      properties:
        iban: { type: string, examples: ['CH93 0076 2011 6238 5295 7'] }
        holderName: { type: string, minLength: 1, maxLength: 70 }
        street: { type: [string, 'null'], maxLength: 70 }
        buildingNumber: { type: [string, 'null'], maxLength: 16 }
        postalCode: { type: string, minLength: 1, maxLength: 16 }
        town: { type: string, minLength: 1, maxLength: 35 }
        country: { type: string, enum: [CH, LI] }
    PaymentDetails:
      type: object
      additionalProperties: false
      required: [iban, qrIban, holderName, street, buildingNumber, postalCode, town, country]
      properties:
        iban: { type: string, pattern: '^(CH|LI)[0-9]{7}[0-9A-Z]{12}$', description: Compact, upper case. }
        qrIban: { type: boolean, description: 'Institution ID 30000-31999: bills carry a QR reference.' }
        holderName: { type: string, minLength: 1, maxLength: 70 }
        street: { type: [string, 'null'], maxLength: 70 }
        buildingNumber: { type: [string, 'null'], maxLength: 16 }
        postalCode: { type: string, minLength: 1, maxLength: 16 }
        town: { type: string, minLength: 1, maxLength: 35 }
        country: { type: string, enum: [CH, LI] }
    JoinRequestSettings:
      type: object
      additionalProperties: false
      required: [open]
      properties:
        open: { type: boolean }
    RideInput:
      type: object
      additionalProperties: false
      required: [direction, seats, meetingPoint, departsAt]
      properties:
        direction: { type: string, enum: [THERE, BACK, BOTH] }
        seats: { type: integer, minimum: 1, maximum: 8 }
        meetingPoint: { type: string, minLength: 1, maxLength: 200, description: Trimmed; no control characters }
        departsAt: { type: string, format: date-time, description: RFC 3339 with offset; from a day before the event's start to its end }
    RideList:
      type: object
      additionalProperties: false
      required: [items, people, canOffer]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, driver, mine, direction, seats, meetingPoint, departsAt, driverPhone, passengers, booked]
            properties:
              id: { type: string, format: uuid }
              driver: { type: string, description: The driver's full name }
              mine: { type: boolean, description: Whether the caller is the driver }
              direction: { type: string, enum: [THERE, BACK, BOTH] }
              seats: { type: integer }
              meetingPoint: { type: string }
              departsAt: { type: string, format: date-time }
              driverPhone: { type: [string, 'null'], description: Only for a caller who booked a seat on this ride }
              passengers:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [displayName, phone]
                  properties:
                    displayName: { type: string }
                    phone: { type: [string, 'null'], description: Only for the driver; a minor's is the booking guardian's }
              booked:
                type: array
                items: { type: string, format: uuid }
        people:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, firstName]
            properties:
              id: { type: string, format: uuid }
              firstName: { type: string }
        canOffer: { type: boolean }
    ShiftInput:
      type: object
      additionalProperties: false
      required: [title, startsAt, endsAt, needed]
      properties:
        title: { type: string, minLength: 1, maxLength: 200, description: Trimmed; no control characters }
        startsAt: { type: string, format: date-time, description: RFC 3339 with offset }
        endsAt: { type: string, format: date-time, description: After startsAt, at most 24 hours later }
        needed: { type: integer, minimum: 1, maximum: 100, description: Number of places }
    UnfilledShiftList:
      type: object
      additionalProperties: false
      required: [items, truncated]
      properties:
        truncated: { type: boolean, description: More than 100 shifts matched; the soonest 100 are listed. }
        items:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [id, title, startsAt, endsAt, needed, filled, eventId, eventTitle, teamId, teamName]
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              startsAt: { type: string, format: date-time }
              endsAt: { type: string, format: date-time }
              needed: { type: integer, minimum: 1 }
              filled: { type: integer, minimum: 0, description: Volunteers signed up so far; always below needed. }
              eventId: { type: string, format: uuid }
              eventTitle: { type: string }
              teamId: { type: string, format: uuid }
              teamName: { type: string }
    ShiftList:
      type: object
      additionalProperties: false
      required: [items, people, canManage]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, title, startsAt, endsAt, needed, volunteers, signedUp]
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              startsAt: { type: string, format: date-time }
              endsAt: { type: string, format: date-time }
              needed: { type: integer }
              volunteers:
                type: array
                description: Public display names of the volunteers, in sign-up order
                items: { type: string }
              signedUp:
                type: array
                description: Which of `people` are signed up for this shift
                items: { type: string, format: uuid }
        people:
          type: array
          description: The caller and their current minors who belong to the event's team
          items:
            type: object
            additionalProperties: false
            required: [id, firstName]
            properties:
              id: { type: string, format: uuid }
              firstName: { type: string }
        canManage: { type: boolean, description: Whether the caller may add, change and delete shifts }
    PublicListing:
      type: object
      additionalProperties: false
      required: [listedPublicly]
      properties:
        listedPublicly: { type: boolean }
    MemberExport:
      type: object
      additionalProperties: false
      required: [exportedAt, member, teams, invitations, guardianships, fees, attendance, shifts, absences, rides, clubGrants, teamGrants]
      properties:
        exportedAt: { type: string, format: date-time }
        member:
          type: object
          additionalProperties: false
          required: [id, firstName, lastName, dateOfBirth, email, phone, gender, isPlayer, role, createdAt, archivedAt, hasLinkedLogin, listedPublicly, jsPersonNumber]
          properties:
            id: { type: string, format: uuid }
            firstName: { type: string }
            lastName: { type: string }
            dateOfBirth: { type: string, format: date }
            email: { type: [string, 'null'] }
            phone: { type: [string, 'null'] }
            gender: { type: [string, 'null'] }
            isPlayer: { type: boolean }
            role: { type: string, enum: [MEMBER, ADMIN] }
            createdAt: { type: string }
            archivedAt: { type: [string, 'null'] }
            hasLinkedLogin: { type: boolean }
            listedPublicly: { type: boolean }
            jsPersonNumber: { type: [string, 'null'] }
        teams:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name]
            properties: { id: { type: string, format: uuid }, name: { type: string } }
        invitations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [createdAt, expiresAt, usedAt, revokedAt]
            properties:
              createdAt: { type: string }
              expiresAt: { type: string }
              usedAt: { type: [string, 'null'] }
              revokedAt: { type: [string, 'null'] }
        guardianships:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [relation, memberId, since]
            properties:
              relation: { type: string, enum: [guardianOf, guardedBy] }
              memberId: { type: string, format: uuid }
              since: { type: string }
        fees:
          description: The member's fees (since 1.12.0), by due date
          type: array
          items:
            type: object
            additionalProperties: false
            required: [periodId, periodName, dueDate, amountCents, paidOn]
            properties:
              periodId: { type: string, format: uuid }
              periodName: { type: string }
              dueDate: { type: string, format: date }
              amountCents: { type: integer, minimum: 0 }
              paidOn: { type: [string, 'null'], format: date }
        attendance:
          description: The member's attendance answers (since 1.14.1), by event start
          type: array
          items:
            type: object
            additionalProperties: false
            required: [eventId, startsAt, response, answeredAt]
            properties:
              eventId: { type: string, format: uuid }
              startsAt: { type: string, format: date-time }
              response: { type: string, enum: ['YES', 'NO', MAYBE] }
              answeredAt: { type: string, format: date-time }
        shifts:
          description: The member's volunteer shift sign-ups (since 1.16.0), by shift start
          type: array
          items:
            type: object
            additionalProperties: false
            required: [shiftId, eventId, title, startsAt, endsAt, signedUpAt]
            properties:
              shiftId: { type: string, format: uuid }
              eventId: { type: string, format: uuid }
              title: { type: string }
              startsAt: { type: string, format: date-time }
              endsAt: { type: string, format: date-time }
              signedUpAt: { type: string, format: date-time }
        absences:
          description: The member's absences (since 1.20.0), by first day
          type: array
          items:
            type: object
            additionalProperties: false
            required: [from, to]
            properties:
              from: { type: string, format: date }
              to: { type: string, format: date }
        rides:
          description: The member's ride offers (DRIVER) and seats (PASSENGER) (since 1.21.0), by departure
          type: array
          items:
            type: object
            additionalProperties: false
            required: [rideId, eventId, role, direction, departsAt]
            properties:
              rideId: { type: string, format: uuid }
              eventId: { type: string, format: uuid }
              role: { type: string, enum: [DRIVER, PASSENGER] }
              direction: { type: string, enum: [THERE, BACK, BOTH] }
              departsAt: { type: string, format: date-time }
        clubGrants: { type: array, items: { type: string } }
        teamGrants:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [teamId, teamName, capability]
            properties:
              teamId: { type: string, format: uuid }
              teamName: { type: string }
              capability: { type: string }
    Error:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string }
        message:
          type: string
          description: Optional generic detail; some M1 routes return code only, while member routes include a safe message.
  responses:
    Invalid:
      description: Invalid input, query, cursor or member field; no private data reflected
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: Session missing or expired
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated, but caller lacks operation-level permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Unknown or non-visible member ID; indistinguishable results
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Write conflicts with an existing record or policy state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: Database or authorization service unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
