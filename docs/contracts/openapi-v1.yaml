openapi: 3.1.0
info:
  title: OpenClub single-club management API — synthetic M1
  version: 1.33.0
  description: >
    Frozen contract for the implemented synthetic M1 HTTP surface, accepted by
    the owner on 2026-11-17 (ADR-0007, #13). 1.1.0 adds the per-club adult-age
    setting (PATCH /v1/club/adult-age-policy and adultAgeYears in GET /v1/club, #17). 1.2.0 adds invitations
    and account unlinking (owner-approved 2026-11-18, ADR-0008 addendum 4): create and revoke an invitation,
    accept an invitation, and unlink a member's account. 1.3.0 adds the restricted member detail read (GET /v1/members/{memberId}/details) and permanent erasure of an archived member (POST /v1/members/{memberId}/erase), owner-approved 2026-11-18. 1.4.0 adds full member replacement (PUT /v1/members/{memberId}) and reactivation (POST /v1/members/{memberId}/reactivate), owner-approved 2026-11-19 (ADR-0008 addendum 5). 1.5.0 adds the archived-member search for editors (GET /v1/members/archived), owner-approved 2026-11-19 (ADR-0008 addendum 7). 1.6.0 adds guardians signing in for a minor: editors manage a minor's guardians and a guardian reads their own minors and replaces their contacts, owner-approved 2026-11-19 (ADR-0008 addendum 8). 1.7.0 adds the member export for editors (GET /v1/members/{memberId}/export), owner-approved 2026-11-19 (ADR-0008 addendum 10). 1.8.0 makes the full member replacement conditional: the editor's detail read returns the member's version as an ETag, and PUT /v1/members/{memberId} requires it in If-Match (428 when missing, 412 when the member changed since), owner-approved 2026-11-19 (ADR-0008 addendum 11). 1.9.0 adds My profile: a member reads their own record (GET /v1/me/profile) and replaces their own email and phone (PUT /v1/me/profile/contacts), owner-approved 2026-11-19 (ADR-0008 addendum 12). 1.10.0 adds trainings and events: team schedules managed with MANAGE_TEAMS, read with VIEW_TEAMS or MANAGE_TEAMS, and each member's own schedule including their minors' (GET /v1/me/events), owner-approved 2026-11-19 (ADR-0008 addendum 13). 1.11.0 adds attendance: members and guardians answer YES, NO or MAYBE until an event starts, team viewers and managers see the answers by public display name, and every event carries the totals, owner-approved 2026-11-19 (ADR-0008 addendum 14). 1.12.0 adds membership fees: the club-wide MANAGE_FEES capability, fee periods and each member's fee and payment (tracking only), each member's own and children's fees (GET /v1/me/fees), and fees in the member export, owner-approved 2026-11-19 (ADR-0008 addendum 15). 1.13.0 adds the member list as CSV for editors: an audited export (GET /v1/members/export.csv) and an import that is previewed, creates only new valid members and skips duplicates (POST /v1/members/import), owner-approved 2026-11-19 (ADR-0008 addendum 17). 1.14.0 adds announcements: club-wide with the new POST_ANNOUNCEMENTS capability, per team with MANAGE_TEAMS, and each member's current announcements (GET /v1/me/announcements), owner-approved 2026-11-19 (ADR-0008 addendum 18). 1.14.1 (security review of 1.9.0–1.14.0) adds the member's attendance answers to the member export and answers 404 for an unknown event, announcement or team only to club-wide holders (403 otherwise), so team-scoped holders learn nothing about IDs they cannot reach. 1.15.0 adds the public member list opt-out decided by the club as controller (ADR-0008 addendum 19, decision C5): a member hides or shows their own name (PUT /v1/me/profile/public-listing) and an editor does it for any active member (PUT /v1/members/{memberId}/public-listing); My profile, the editor's detail read and the member export carry listedPublicly. 1.16.0 adds volunteer shifts (ADR-0008 addendum 20): team managers add shifts with a number of places to a team event, the team sees them with the volunteers' public display names, members and guardians sign up or withdraw until a shift starts and while places are free, and the member export lists a member's sign-ups. 1.17.0 adds private calendar feeds (ADR-0008 addendum 21): a member creates, replaces or revokes one secret feed link (shown once, only its hash stored) that calendar apps load without a session (GET /v1/calendar/{secret}, iCalendar with the events of My schedule, four weeks back to six months ahead, including notes, never names). 1.18.0 adds attendance statistics per team for VIEW_TEAMS and MANAGE_TEAMS holders (GET /v1/teams/{teamId}/attendance-statistics, ADR-0008 addendum 22). 1.19.0 adds email notifications (ADR-0008 addendum 23): a member's own switches for event changes, new events, announcements and shift reminders, all on by default, and the email language (GET and PUT /v1/me/notifications); messages go only to members with a verified sign-in, through the operator's SMTP server. 1.20.0 adds absences (ADR-0008 addendum 24): a member, or a guardian for their minor, enters days away, and every unanswered event of their teams on those days counts as No everywhere answers are shown or counted. 1.21.0 adds carpooling (ADR-0008 addendum 25): adults of an event's team or guardians of its minors offer rides, team members and guardians book seats, and a driver and the people they carry see each other's phone. 1.22.0 adds join requests (ADR-0008 addendum 26): a public form, off until an EDIT_MEMBERS holder switches it on, where adults apply for themselves and parents for a child; editors accept (creating the member) or decline. 1.23.0 adds the managers' overview of helper shifts that still need people (GET /v1/shifts/unfilled, ADR-0008 addendum 27): counts only, for the teams the caller manages, the next 14 days. 1.24.0 adds the helpers-wanted email (ADR-0008 addendum 28): seven days before a helper shift that still has free places, the team and the guardians of its minors are asked once, counts only, with the member's own `helpersWanted` switch in the notification settings (on by default; optional in PUT, where leaving it out keeps the stored value). 1.25.0 adds answer reminders (ADR-0008 addendum 29): an automatic email two days before an event to team members without an answer (guardians for their minors), a coach's reminder (POST /v1/events/{eventId}/attendance-reminders, MANAGE_TEAMS, at most every 12 hours) and the member's own `answerReminders` switch. 1.26.0 adds Swiss QR bills for fees (ADR-0008 addendum 30): MANAGE_FEES holders read and replace the club's payment details (GET and PUT /v1/club/payment-details: a Swiss or Liechtenstein IBAN or QR-IBAN, the account holder and their postal address), a member or guardian downloads the A4 PDF QR bill of their own or their current minor's open fee (GET /v1/me/fees/{periodId}/{memberId}/qr-bill, generated on demand, never stored, the payer's address left empty), GET /v1/me/fees says per fee whether a bill is available (qrBill), and the treasurer's fee list shows each member's payment reference (reference). 1.27.0 adds actual attendance and the J+S export (ADR-0008 addendum 31): a team manager records who came once an event has started (GET and PUT /v1/events/{eventId}/presence), editors set a member's J+S person number (PUT /v1/members/{memberId}/js-person-number, also in the detail read, My profile and the member export), and team managers check and download the file for the NDS attendance import (GET /v1/teams/{teamId}/js-attendance and its .csv). 1.28.0 adds match squads (ADR-0008 addendum 32): team managers call up team members for a match with an optional meeting time and point until it starts (GET and PUT /v1/events/{eventId}/squad), newly called members (guardians for a minor) are emailed unless their new `squadCalls` switch is off, and GET /v1/me/events shows each person only their own status (`squad`). 1.29.0 adds bulk changes (ADR-0008 addendum 33): for one or more teams the caller manages and a date range, cancel, reinstate or move to a new place every matching event that has not started, with a preview and one summary email per person (POST /v1/events/bulk). 1.30.0 adds fields and halls (ADR-0008 addendum 34): the club-wide MANAGE_VENUES capability (given to the first administrator), the venue list and each venue's bookings for every member (GET /v1/venues, GET /v1/venues/{venueId}/bookings), adding, renaming and deleting venues (POST /v1/venues, PUT and DELETE /v1/venues/{venueId}), an optional `venueId` on events with 409 `venue_taken` for a double booking, and SET_VENUE in bulk changes. 1.31.0 adds coach messages (ADR-0008 addendum 35): a team manager emails everyone in an event, those who said yes, those without an answer or the squad, sent by the server, at most 10 per team and day (POST /v1/events/{eventId}/messages), with the member's own `teamMessages` switch. 1.32.0 adds helper duty (ADR-0008 addendum 36): MANAGE_FEES holders set a number of helper shifts per season and the season month (PUT /v1/club/helper-duty) and see who still owes shifts (GET /v1/helper-duty); each member sees their own count (GET /v1/me/helper-duty). 1.33.0 adds push notifications (ADR-0008 addendum 37): with the operator's VAPID keys and allowed push hosts, a member's browser registers its push endpoint (GET /v1/me/push, PUT and DELETE /v1/me/push-subscriptions), the server sends only empty wake-up pushes for queued messages, and the woken device reads the subjects from GET /v1/me/push-inbox; messages are queued for members with an email address or a device. It contains exactly the operations
    registered in Ktor and checked by `dev/verify-m1-openapi.py`. Authentication
    routes (/v1/auth) are documented separately in auth-api-proposal.yaml.
    Version 1.0.0 covers synthetic data only. It does not approve real member
    data, private-field reads or writes, export or erasure (M2, #12). Proposed
    M2 operations live in openapi-m2-draft.yaml and are not part of this
    contract. Bootstrap and emergency admin recovery are offline operator-only
    commands, never HTTP APIs. Exactly one club exists per installation; there
    is no clubId tenant selector. Never treat the browser session alone as
    permission to read personal data: every private operation checks explicit
    grants server-side.
servers:
  - url: /api
security:
  - browserSession: []
tags:
  - name: Club
  - name: Members
  - name: Teams
  - name: Permissions
  - name: Guardians
  - name: Profile
  - name: Events
  - name: Venues
  - name: Shifts
  - name: Calendar
  - name: Notifications
  - name: Absences
  - name: Rides
  - name: Join requests
  - name: Fees
  - name: Announcements
paths:
  /v1/club:
    get:
      tags: [Club]
      operationId: readMyClub
      summary: Read the single installation club after authorized login
      description: >
        Implemented session-linked response: local club UUID, name, slug and
        genderRequiredForPlayers boolean for an active linked member only. Authentication alone is insufficient;
        this read never authorizes club settings writes or private member data.
      responses:
        '200':
          description: Current installation's ID, name, slug and player-gender requirement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubReference'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      tags: [Club]
      operationId: updateMyClubName
      summary: Update only the singleton club name
      description: >
        A verified, active, identity-bound ADMIN with an explicit current
        MANAGE_PERMISSIONS club grant may update the name only. Exact Origin and
        session CSRF token required. No slug, age or gender-policy writes.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '204':
          description: Club name changed
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/club/player-gender-policy:
    patch:
      tags: [Club]
      operationId: setPlayerGenderRequirement
      summary: Configure requirement for player gender in synthetic M1
      description: >
        Verified active identity-bound ADMIN with explicit MANAGE_PERMISSIONS,
        matching Origin and session CSRF. Only a boolean flag is accepted;
        existing players missing gender block enabling this rule under the
        database's serialized member/policy constraints. No gender values are
        returned and this is not production privacy approval.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [genderRequiredForPlayers]
              properties:
                genderRequiredForPlayers: { type: boolean }
      responses:
        '204':
          description: Policy updated
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/club/adult-age-policy:
    patch:
      tags: [Club]
      operationId: setAdultAge
      summary: Configure the club's adult age (since 1.1.0)
      description: >
        ADR-0007: the adult age is configurable per club, default 18, within
        13–25. Same guards as the player-gender policy: verified active
        identity-bound ADMIN with explicit MANAGE_PERMISSIONS, matching Origin
        and session CSRF. Only a whole number is accepted. Lowering the age is
        rejected with 409 while members who would become adults lack email or
        phone; the response never identifies those members. Raising it never
        conflicts. Not production privacy approval.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [adultAgeYears]
              properties:
                adultAgeYears: { type: integer, minimum: 13, maximum: 25 }
      responses:
        '204':
          description: Adult age updated
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/public/members:
    get:
      tags: [Members]
      operationId: listPublicMemberNames
      summary: Anonymous active-member display-name list
      security: []
      description: >
        Owner-approved synthetic M1 public display: adult 'Peter Smith',
        minor 'Peter S.'. Determine minor status server-side using stored DOB,
        current date and configured adult threshold. Each item contains ONLY
        a displayName; no local UUID, full minor surname, DOB, age, contact,
        gender, role, account link or team grant. Exclude archived members and, since 1.15.0, members who switched off listedPublicly.
        No full-surname search, identifiers or raw-name cursor may leak
        unmasked minors' surnames; any future search/pagination requires
        separate inference-resistant contract review. Current implementation
        returns the complete active list, with no search or cursor parameters.
        This is NOT approval to publish real personal data.
      responses:
        '200':
          description: Public names of active synthetic members, safely displayed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicMemberName'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/members:
    get:
      tags: [Members]
      operationId: listLocalMembers
      summary: Authorized member search
      description: >
        This authenticated, full-name/UUID administration directory is distinct
        from the anonymous /v1/public/members display-name list. Linked club
        members need explicit VIEW_MEMBER_DIRECTORY permission; login alone
        grants nothing. Never expose its full minor surnames or UUIDs through
        the public route. No DOB, gender, contacts, account IDs or grants.
        Opaque cursor represents a stable (lastName, firstName, id) ordering
        and is bound to the filter and caller's permission; stale or invalid
        cursors return 400.
      parameters:
        - name: q
          in: query
          description: Optional name search; empty q is accepted as an unfiltered directory read. No email or DOB search.
          schema: { type: string, maxLength: 100 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          description: Opaque server-issued page cursor; never encode PII in cleartext.
          schema: { type: string, minLength: 1, maxLength: 2048 }
      responses:
        '200':
          description: Bounded page containing privacy-minimized members only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags: [Members]
      operationId: addLocalMember
      summary: Accountless member creation
      description: >
        Requires an explicitly authorized club-level member-write capability,
        exact configured Origin, session-bound X-CSRF-Token and JSON Content-Type.
        A verified login or legacy ADMIN label alone does not approve future
        configurable delegation. All members require DOB; adults require both
        email and phone; gender is required only for players when the club
        enables the policy. Adult age threshold is installation-local and
        provisionally defaults to 18; R03 must approve threshold and access.
        Never match an existing login by email or grant roles in this operation.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMember'
      responses:
        '201':
          description: Created local member reference; private fields not echoed
          headers:
            Location:
              description: Canonical relative member resource path
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberReference'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/members/archived:
    get:
      tags: [Members]
      operationId: listArchivedLocalMembers
      summary: Search archived members (since 1.5.0)
      description: >
        Name search over ARCHIVED members for a live club-wide EDIT_MEMBERS grant with a current
        verified identity, so editors can find a member archived earlier and reactivate them
        (POST /v1/members/{memberId}/reactivate). Same paging, query rules and order of answers as
        GET /v1/members: authorization before validation (403 for any input without the grant),
        then 400 for an invalid query, limit or cursor. Returns names and the archive time only;
        never birth dates, contacts, gender, account IDs or grants (the restricted detail read
        serves editors those). Cursors are bound to the caller, the query and this list, so a
        cursor from GET /v1/members is rejected here. Never cacheable.
      parameters:
        - name: q
          in: query
          description: Optional name search; empty q lists all archived members.
          schema: { type: string, maxLength: 100 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          description: Opaque server-issued page cursor.
          schema: { type: string, minLength: 1, maxLength: 2048 }
      responses:
        '200':
          description: Bounded page of archived members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchivedMemberPage'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/members/{memberId}:
    parameters:
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Members]
      operationId: readLocalMember
      summary: Authorized minimal member detail
      description: >
        This member-ID detail is for authenticated, explicitly authorized
        administration only, not the public name list. It returns only the
        member ID and full name. DOB, contacts and player gender are never
        returned in 1.0.0; under ADR-0007, any future contact read is limited
        to explicitly granted roles (M2). Non-existent and non-visible IDs are
        concealed with the same 404.
      responses:
        '200':
          description: Minimal member summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberSummary' }
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      tags: [Members]
      operationId: changeLocalMemberNames
      summary: Name-only update preserving private fields
      description: >
        The internal MemberDetailsUpdate.updateNames changes first and last
        name only for an active member under an explicit EDIT_MEMBERS grant.
        It never reads or modifies DOB, contacts, gender, roles, accounts or
        capability grants. Unlike full replacement, it does not depend on
        an editor being authorized to read private contact/birth fields.
        HTTP implementation requires a verified session, exact Origin,
        session-bound CSRF and explicit EDIT_MEMBERS capability. Hidden/private
        member fields are never read or modified by this operation.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberNames'
      responses:
        '204':
          description: Names updated; no private values returned
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      tags: [Members]
      operationId: replaceLocalMemberDetails
      summary: Replace an active member's editable fields (since 1.4.0)
      description: >
        Replaces every editable field of an ACTIVE member under a live club-wide EDIT_MEMBERS grant
        with a current verified identity, exact Origin and session CSRF. It cannot change account
        links, roles, grants or teams. Every editable field is sent on every call: an omitted
        email, phone or gender clears it and an omitted isPlayer is false, so a client MUST first
        read the current values with GET /v1/members/{memberId}/details and never guess unseen
        fields. The database rules stay authoritative: an adult (club adult age) needs email and
        phone, and a player needs a gender when the club policy requires it; a violation is 400.
        Unknown or archived members are 404. Audited as MEMBER_UPDATED (identifiers only).
        Since 1.8.0 the replacement is conditional: If-Match must carry exactly the ETag of the
        caller's GET /v1/members/{memberId}/details (or of a previous replacement), so a change made
        in between, such as a guardian's contact update, is never silently overwritten. Missing
        If-Match is 428; a different, malformed, weak or wildcard value is 412 with code "changed"
        and nothing changes. Session, Origin/CSRF, the grant and the body are checked first.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: If-Match
          in: header
          required: true
          description: The member's ETag from the editor's detail read, for example "7"
          schema: { type: string, pattern: '^"[1-9][0-9]{0,18}"$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMember'
      responses:
        '204':
          description: Member updated; never echo private fields
          headers:
            ETag:
              description: The member's new version, for a further replacement
              schema: { type: string }
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          description: The member changed since the caller read it (code "changed"); read it again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '428':
          description: If-Match is missing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/members/{memberId}/archive:
    post:
      tags: [Members]
      operationId: archiveLocalMember
      summary: Archive an unlinked ordinary member
      description: >
        Internal-only MemberArchive currently requires a verified session actor
        holding a live club-wide EDIT_MEMBERS grant, an unlinked MEMBER target,
        and transactionally revokes all team assignments and capability grants.
        Archived members disappear from active directory and team workflows,
        but private records remain in database/backups. Not erasure or deletion.
        This synthetic M1 HTTP operation is implemented with verified session,
        current member-write grant, exact Origin and session-bound CSRF.
        R03 retention, real-data audit/erasure and full lifecycle policy still
        require independent M2 approval. No request body or actor ID.
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Target archived; never echo personal fields
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/members/{memberId}/reactivate:
    post:
      tags: [Members]
      operationId: reactivateLocalMember
      summary: Reactivate an archived member without restoring rights (since 1.4.0)
      description: >
        Restores an ARCHIVED, unlinked ordinary member to active status under a live club-wide
        EDIT_MEMBERS grant with a current verified identity, exact Origin and session CSRF. It
        never restores old login links, team assignments or capability grants. The record is
        validated against the club's CURRENT adult-contact and player-gender policy; if it no
        longer satisfies it the answer is 409 and nothing changes (edit after reactivation is not
        possible, so the policy must be relaxed or the record erased instead). Unknown or active
        members are 404. No request body. Audited as MEMBER_REACTIVATED.
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Member reactivated without restoring old privileges
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/members/{memberId}/role:
    parameters:
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Members]
      operationId: readLocalMemberRole
      summary: Read a local active member role
      description: >
        Requires an active, verified ADMIN session with a current club
        MANAGE_PERMISSIONS grant; role lookup never exposes contact fields.
      responses:
        '200':
          description: Current role of active member
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [role]
                properties:
                  role: { type: string, enum: [ADMIN, MEMBER] }
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      tags: [Members]
      operationId: changeLocalMemberRole
      summary: Change a local member role
      description: >
        Verifies session, exact Origin and CSRF, then uses serialized
        MemberRoles checks with a live eligible ADMIN/MANAGE_PERMISSIONS
        grant and linked identity. Refuses self-mutation, archived targets and
        last-administrator lockout. Role changes never auto-grant permissions.
        Missing or non-visible targets are denied without disclosing roles.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { type: string, enum: [ADMIN, MEMBER] }
      responses:
        '204':
          description: Role updated or already at desired value
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/teams:
    get:
      tags: [Teams]
      operationId: listLocalTeams
