openapi: 3.1.0
info:
  title: OpenClub single-club management API — synthetic M1
  version: 1.12.0
  description: >
    Frozen contract for the implemented synthetic M1 HTTP surface, accepted by
    the owner on 2026-11-17 (ADR-0007, #13). 1.1.0 adds the per-club adult-age
    setting (PATCH /v1/club/adult-age-policy and adultAgeYears in GET /v1/club, #17). 1.2.0 adds invitations
    and account unlinking (owner-approved 2026-11-18, ADR-0008 addendum 4): create and revoke an invitation,
    accept an invitation, and unlink a member's account. 1.3.0 adds the restricted member detail read (GET /v1/members/{memberId}/details) and permanent erasure of an archived member (POST /v1/members/{memberId}/erase), owner-approved 2026-11-18. 1.4.0 adds full member replacement (PUT /v1/members/{memberId}) and reactivation (POST /v1/members/{memberId}/reactivate), owner-approved 2026-11-19 (ADR-0008 addendum 5). 1.5.0 adds the archived-member search for editors (GET /v1/members/archived), owner-approved 2026-11-19 (ADR-0008 addendum 7). 1.6.0 adds guardians signing in for a minor: editors manage a minor's guardians and a guardian reads their own minors and replaces their contacts, owner-approved 2026-11-19 (ADR-0008 addendum 8). 1.7.0 adds the member export for editors (GET /v1/members/{memberId}/export), owner-approved 2026-11-19 (ADR-0008 addendum 10). 1.8.0 makes the full member replacement conditional: the editor's detail read returns the member's version as an ETag, and PUT /v1/members/{memberId} requires it in If-Match (428 when missing, 412 when the member changed since), owner-approved 2026-11-19 (ADR-0008 addendum 11). 1.9.0 adds My profile: a member reads their own record (GET /v1/me/profile) and replaces their own email and phone (PUT /v1/me/profile/contacts), owner-approved 2026-11-19 (ADR-0008 addendum 12). 1.10.0 adds trainings and events: team schedules managed with MANAGE_TEAMS, read with VIEW_TEAMS or MANAGE_TEAMS, and each member's own schedule including their minors' (GET /v1/me/events), owner-approved 2026-11-19 (ADR-0008 addendum 13). 1.11.0 adds attendance: members and guardians answer YES, NO or MAYBE until an event starts, team viewers and managers see the answers by public display name, and every event carries the totals, owner-approved 2026-11-19 (ADR-0008 addendum 14). 1.12.0 adds membership fees: the club-wide MANAGE_FEES capability, fee periods and each member's fee and payment (tracking only), each member's own and children's fees (GET /v1/me/fees), and fees in the member export, owner-approved 2026-11-19 (ADR-0008 addendum 15). It contains exactly the operations
    registered in Ktor and checked by `dev/verify-m1-openapi.py`. Authentication
    routes (/v1/auth) are documented separately in auth-api-proposal.yaml.
    Version 1.0.0 covers synthetic data only. It does not approve real member
    data, private-field reads or writes, export or erasure (M2, #12). Proposed
    M2 operations live in openapi-m2-draft.yaml and are not part of this
    contract. Bootstrap and emergency admin recovery are offline operator-only
    commands, never HTTP APIs. Exactly one club exists per installation; there
    is no clubId tenant selector. Never treat the browser session alone as
    permission to read personal data: every private operation checks explicit
    grants server-side.
servers:
  - url: /api
security:
  - browserSession: []
tags:
  - name: Club
  - name: Members
  - name: Teams
  - name: Permissions
  - name: Guardians
  - name: Profile
  - name: Events
  - name: Fees
paths:
  /v1/club:
    get:
      tags: [Club]
      operationId: readMyClub
      summary: Read the single installation club after authorized login
      description: >
        Implemented session-linked response: local club UUID, name, slug and
        genderRequiredForPlayers boolean for an active linked member only. Authentication alone is insufficient;
        this read never authorizes club settings writes or private member data.
      responses:
        '200':
          description: Current installation's ID, name, slug and player-gender requirement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubReference'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      tags: [Club]
      operationId: updateMyClubName
      summary: Update only the singleton club name
      description: >
        A verified, active, identity-bound ADMIN with an explicit current
        MANAGE_PERMISSIONS club grant may update the name only. Exact Origin and
        session CSRF token required. No slug, age or gender-policy writes.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '204':
          description: Club name changed
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/club/player-gender-policy:
    patch:
      tags: [Club]
      operationId: setPlayerGenderRequirement
      summary: Configure requirement for player gender in synthetic M1
      description: >
        Verified active identity-bound ADMIN with explicit MANAGE_PERMISSIONS,
        matching Origin and session CSRF. Only a boolean flag is accepted;
        existing players missing gender block enabling this rule under the
        database's serialized member/policy constraints. No gender values are
        returned and this is not production privacy approval.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [genderRequiredForPlayers]
              properties:
                genderRequiredForPlayers: { type: boolean }
      responses:
        '204':
          description: Policy updated
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/club/adult-age-policy:
    patch:
      tags: [Club]
      operationId: setAdultAge
      summary: Configure the club's adult age (since 1.1.0)
      description: >
        ADR-0007: the adult age is configurable per club, default 18, within
        13–25. Same guards as the player-gender policy: verified active
        identity-bound ADMIN with explicit MANAGE_PERMISSIONS, matching Origin
        and session CSRF. Only a whole number is accepted. Lowering the age is
        rejected with 409 while members who would become adults lack email or
        phone; the response never identifies those members. Raising it never
        conflicts. Not production privacy approval.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [adultAgeYears]
              properties:
                adultAgeYears: { type: integer, minimum: 13, maximum: 25 }
      responses:
        '204':
          description: Adult age updated
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/public/members:
    get:
      tags: [Members]
      operationId: listPublicMemberNames
      summary: Anonymous active-member display-name list
      security: []
      description: >
        Owner-approved synthetic M1 public display: adult 'Peter Smith',
        minor 'Peter S.'. Determine minor status server-side using stored DOB,
        current date and configured adult threshold. Each item contains ONLY
        a displayName; no local UUID, full minor surname, DOB, age, contact,
        gender, role, account link or team grant. Exclude archived members.
        No full-surname search, identifiers or raw-name cursor may leak
        unmasked minors' surnames; any future search/pagination requires
        separate inference-resistant contract review. Current implementation
        returns the complete active list, with no search or cursor parameters.
        This is NOT approval to publish real personal data.
      responses:
        '200':
          description: Public names of active synthetic members, safely displayed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicMemberName'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/members:
    get:
      tags: [Members]
      operationId: listLocalMembers
      summary: Authorized member search
      description: >
        This authenticated, full-name/UUID administration directory is distinct
        from the anonymous /v1/public/members display-name list. Linked club
        members need explicit VIEW_MEMBER_DIRECTORY permission; login alone
        grants nothing. Never expose its full minor surnames or UUIDs through
        the public route. No DOB, gender, contacts, account IDs or grants.
        Opaque cursor represents a stable (lastName, firstName, id) ordering
        and is bound to the filter and caller's permission; stale or invalid
        cursors return 400.
      parameters:
        - name: q
          in: query
          description: Optional name search; empty q is accepted as an unfiltered directory read. No email or DOB search.
          schema: { type: string, maxLength: 100 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          description: Opaque server-issued page cursor; never encode PII in cleartext.
          schema: { type: string, minLength: 1, maxLength: 2048 }
      responses:
        '200':
          description: Bounded page containing privacy-minimized members only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags: [Members]
      operationId: addLocalMember
      summary: Accountless member creation
      description: >
        Requires an explicitly authorized club-level member-write capability,
        exact configured Origin, session-bound X-CSRF-Token and JSON Content-Type.
        A verified login or legacy ADMIN label alone does not approve future
        configurable delegation. All members require DOB; adults require both
        email and phone; gender is required only for players when the club
        enables the policy. Adult age threshold is installation-local and
        provisionally defaults to 18; R03 must approve threshold and access.
        Never match an existing login by email or grant roles in this operation.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMember'
      responses:
        '201':
          description: Created local member reference; private fields not echoed
          headers:
            Location:
              description: Canonical relative member resource path
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberReference'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/members/archived:
    get:
      tags: [Members]
      operationId: listArchivedLocalMembers
      summary: Search archived members (since 1.5.0)
      description: >
        Name search over ARCHIVED members for a live club-wide EDIT_MEMBERS grant with a current
        verified identity, so editors can find a member archived earlier and reactivate them
        (POST /v1/members/{memberId}/reactivate). Same paging, query rules and order of answers as
        GET /v1/members: authorization before validation (403 for any input without the grant),
        then 400 for an invalid query, limit or cursor. Returns names and the archive time only;
        never birth dates, contacts, gender, account IDs or grants (the restricted detail read
        serves editors those). Cursors are bound to the caller, the query and this list, so a
        cursor from GET /v1/members is rejected here. Never cacheable.
      parameters:
        - name: q
          in: query
          description: Optional name search; empty q lists all archived members.
          schema: { type: string, maxLength: 100 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          description: Opaque server-issued page cursor.
          schema: { type: string, minLength: 1, maxLength: 2048 }
      responses:
        '200':
          description: Bounded page of archived members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchivedMemberPage'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/members/{memberId}:
    parameters:
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Members]
      operationId: readLocalMember
      summary: Authorized minimal member detail
      description: >
        This member-ID detail is for authenticated, explicitly authorized
        administration only, not the public name list. It returns only the
        member ID and full name. DOB, contacts and player gender are never
        returned in 1.0.0; under ADR-0007, any future contact read is limited
        to explicitly granted roles (M2). Non-existent and non-visible IDs are
        concealed with the same 404.
      responses:
        '200':
          description: Minimal member summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberSummary' }
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      tags: [Members]
      operationId: changeLocalMemberNames
      summary: Name-only update preserving private fields
      description: >
        The internal MemberDetailsUpdate.updateNames changes first and last
        name only for an active member under an explicit EDIT_MEMBERS grant.
        It never reads or modifies DOB, contacts, gender, roles, accounts or
        capability grants. Unlike full replacement, it does not depend on
        an editor being authorized to read private contact/birth fields.
        HTTP implementation requires a verified session, exact Origin,
        session-bound CSRF and explicit EDIT_MEMBERS capability. Hidden/private
        member fields are never read or modified by this operation.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberNames'
      responses:
        '204':
          description: Names updated; no private values returned
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      tags: [Members]
      operationId: replaceLocalMemberDetails
      summary: Replace an active member's editable fields (since 1.4.0)
      description: >
        Replaces every editable field of an ACTIVE member under a live club-wide EDIT_MEMBERS grant
        with a current verified identity, exact Origin and session CSRF. It cannot change account
        links, roles, grants or teams. Every editable field is sent on every call: an omitted
        email, phone or gender clears it and an omitted isPlayer is false, so a client MUST first
        read the current values with GET /v1/members/{memberId}/details and never guess unseen
        fields. The database rules stay authoritative: an adult (club adult age) needs email and
        phone, and a player needs a gender when the club policy requires it; a violation is 400.
        Unknown or archived members are 404. Audited as MEMBER_UPDATED (identifiers only).
        Since 1.8.0 the replacement is conditional: If-Match must carry exactly the ETag of the
        caller's GET /v1/members/{memberId}/details (or of a previous replacement), so a change made
        in between, such as a guardian's contact update, is never silently overwritten. Missing
        If-Match is 428; a different, malformed, weak or wildcard value is 412 with code "changed"
        and nothing changes. Session, Origin/CSRF, the grant and the body are checked first.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: If-Match
          in: header
          required: true
          description: The member's ETag from the editor's detail read, for example "7"
          schema: { type: string, pattern: '^"[1-9][0-9]{0,18}"$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMember'
      responses:
        '204':
          description: Member updated; never echo private fields
          headers:
            ETag:
              description: The member's new version, for a further replacement
              schema: { type: string }
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          description: The member changed since the caller read it (code "changed"); read it again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '428':
          description: If-Match is missing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/members/{memberId}/archive:
    post:
      tags: [Members]
      operationId: archiveLocalMember
      summary: Archive an unlinked ordinary member
      description: >
        Internal-only MemberArchive currently requires a verified session actor
        holding a live club-wide EDIT_MEMBERS grant, an unlinked MEMBER target,
        and transactionally revokes all team assignments and capability grants.
        Archived members disappear from active directory and team workflows,
        but private records remain in database/backups. Not erasure or deletion.
        This synthetic M1 HTTP operation is implemented with verified session,
        current member-write grant, exact Origin and session-bound CSRF.
        R03 retention, real-data audit/erasure and full lifecycle policy still
        require independent M2 approval. No request body or actor ID.
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Target archived; never echo personal fields
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/members/{memberId}/reactivate:
    post:
      tags: [Members]
      operationId: reactivateLocalMember
      summary: Reactivate an archived member without restoring rights (since 1.4.0)
      description: >
        Restores an ARCHIVED, unlinked ordinary member to active status under a live club-wide
        EDIT_MEMBERS grant with a current verified identity, exact Origin and session CSRF. It
        never restores old login links, team assignments or capability grants. The record is
        validated against the club's CURRENT adult-contact and player-gender policy; if it no
        longer satisfies it the answer is 409 and nothing changes (edit after reactivation is not
        possible, so the policy must be relaxed or the record erased instead). Unknown or active
        members are 404. No request body. Audited as MEMBER_REACTIVATED.
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Member reactivated without restoring old privileges
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/members/{memberId}/role:
    parameters:
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Members]
      operationId: readLocalMemberRole
      summary: Read a local active member role
      description: >
        Requires an active, verified ADMIN session with a current club
        MANAGE_PERMISSIONS grant; role lookup never exposes contact fields.
      responses:
        '200':
          description: Current role of active member
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [role]
                properties:
                  role: { type: string, enum: [ADMIN, MEMBER] }
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      tags: [Members]
      operationId: changeLocalMemberRole
      summary: Change a local member role
      description: >
        Verifies session, exact Origin and CSRF, then uses serialized
        MemberRoles checks with a live eligible ADMIN/MANAGE_PERMISSIONS
        grant and linked identity. Refuses self-mutation, archived targets and
        last-administrator lockout. Role changes never auto-grant permissions.
        Missing or non-visible targets are denied without disclosing roles.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { type: string, enum: [ADMIN, MEMBER] }
      responses:
        '204':
          description: Role updated or already at desired value
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/teams:
    get:
      tags: [Teams]
      operationId: listLocalTeams
      summary: Authorized team list
      description: >
        Verified active member with explicit club or exact-team VIEW_TEAMS or
        MANAGE_TEAMS grant. Only authorized teams and aggregate member counts
        are returned. No anonymous roster or member identifiers.
      responses:
        '200':
          description: Visible teams within the singleton club
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamPage' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags: [Teams]
      operationId: createLocalTeam
      summary: Create a team
      description: >
        Requires verified session, exact Origin, session CSRF and club-wide
        MANAGE_TEAMS; a team-scoped grant cannot create a club team.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamName' }
      responses:
        '201':
          description: Created team reference
          headers:
            Location:
              schema: { type: string }
              description: Relative team resource location
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberReference' }
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/teams/{teamId}:
    parameters:
      - name: teamId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Teams]
      operationId: renameLocalTeam
      summary: Rename a team
      description: >
        Club-wide MANAGE_TEAMS, exact Origin and session CSRF required.
        Existing assignments remain attached to the same team ID.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamName' }
      responses:
        '204':
          description: Renamed
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [Teams]
      operationId: deleteLocalTeam
      summary: Confirmed restricted team removal
      description: >
        Club-wide MANAGE_TEAMS and exact Origin/CSRF required. Caller must
        supply the current exact name. A name mismatch is rejected, and
        populated/delegated teams are protected by the database service.
        Do not use deletion for personal data erasure.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamName' }
      responses:
        '204':
          description: Eligible team removed
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/teams/{teamId}/members:
    get:
      tags: [Teams]
      operationId: listVisibleTeamMembers
      summary: Authenticated exact-team private roster
      description: >
        Requires BOTH explicit club VIEW_MEMBER_DIRECTORY and exact-team
        VIEW_TEAMS/MANAGE_TEAMS (or club-wide team capability).
        Only active member UUIDs and first/last names are returned.
        Opaque encrypted cursors are bound to account and exact team;
        no DOB, contact, account link or gender is exposed.
      parameters:
        - name: teamId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 2048 }
          description: Authenticated per-account, per-team cursor
      responses:
        '200':
          description: Authorized, bounded roster page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberPage' }
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/teams/{teamId}/members/{memberId}:
    parameters:
      - name: teamId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Teams]
      operationId: assignLocalTeamMember
      summary: Assign active member to team
      description: >
        Exact team or club MANAGE_TEAMS, verified session, exact Origin and
        session CSRF. Duplicate/archived member assignments are rejected.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Assignment created
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [Teams]
      operationId: unassignLocalTeamMember
      summary: Remove team assignment
      description: >
        Exact team or club MANAGE_TEAMS, verified session, exact Origin and
        session CSRF; no member record is deleted.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Assignment removed
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/grants:
    get:
      tags: [Permissions]
      operationId: listLocalGrants
      summary: Inspect member grants
      description: >
        A verified, linked ADMIN with explicit current club MANAGE_PERMISSIONS
        may inspect club and exact-team capabilities for a given member ID.
        The response contains no names, birth dates or contact details.
      parameters:
        - name: memberId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current scoped capability grants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrantPage' }
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags: [Permissions]
      operationId: grantLocalCapability
      summary: Delegate a capability
      description: >
        Verified ADMIN/MANAGE_PERMISSIONS and session Origin/CSRF required.
        Serialized mutation prevents self-escalation, undelegable team scope
        and last-manager lockout. Never accept a caller-supplied actor ID.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantMutation' }
      responses:
        '204':
          description: Grant added or already present
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [Permissions]
      operationId: revokeLocalCapability
      summary: Revoke a capability
      description: >
        Same verified ADMIN, CSRF and serialized last-manager safeguards as
        granting. A revocation is effective on the next protected read.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantMutation' }
      responses:
        '204':
          description: Grant removed or already absent
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/members/{memberId}/invitation:
    parameters:
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Members]
      operationId: createLocalMemberInvitation
      summary: Invite an adult member to sign in themselves (since 1.2.0)
      description: >
        Creates the single open invitation for an ACTIVE, unlinked ordinary member, under a live
        club-wide EDIT_MEMBERS grant. The response carries the one-time secret; only its hash is
        stored, so it can never be read again. The administrator hands the resulting link
        (https://HOST/invite#SECRET, the secret in the URL fragment so it stays out of server logs)
        to the person outside OpenClub; the system sends no email. Life is 7 days. 409 when the
        member already has an open invitation (revoke it first) or is already linked. Never created
        for administrators or archived members. Audited as INVITATION_CREATED.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: Invitation created; the secret is shown once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [Members]
      operationId: revokeLocalMemberInvitation
      summary: Revoke a member's open invitation (since 1.2.0)
      description: >
        Revokes the member's open invitation under a live club-wide EDIT_MEMBERS grant. Idempotent
        as to the outcome (no open invitation afterwards); 404 when the member does not exist.
        Audited as INVITATION_REVOKED when an invitation was actually revoked.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: No open invitation remains
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/invitations/accept:
    post:
      tags: [Members]
      operationId: acceptInvitation
      summary: Accept an invitation as a signed-in person (since 1.2.0)
      description: >
        Links the caller's verified account to the invited member. Needs both proofs: the secret in
        the body and a verified OIDC session (with exact Origin and CSRF); no capability is required
        and none is granted: the linked member keeps role MEMBER and no grants. In one transaction
        the server checks that the invitation is open, unexpired and unrevoked, that the member is
        still active, unlinked and a plain MEMBER, and that the caller's account has no member. Every
        failure, whatever the reason (unknown, used, expired, revoked, ineligible member, account
        already linked), is the same 400 with code `invalid`, so nothing about members or
        invitations is revealed. Rate limited like the authentication routes. Audited as
        INVITATION_ACCEPTED.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationSecret' }
      responses:
        '204':
          description: The caller's account is now linked to the invited member
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: Too many acceptance attempts (shared budget, like the authentication routes); retry after the interval in Retry-After
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/members/{memberId}/account-link:
    delete:
      tags: [Members]
      operationId: unlinkLocalMemberAccount
      summary: Unlink a member's sign-in account (since 1.2.0)
      description: >
        Removes the link between a member and their account, needed before archiving and for a lost
        provider login. Requires a live club-wide MANAGE_PERMISSIONS grant held by an ADMIN with a
        current verified identity, because it changes who can sign in. Deletes that account's browser
        sessions, clears the member's capability grants (as archiving does), and refuses with 409
        the last eligible permission manager, reusing the existing advisory lock. Administrators are
        unlinked only by the operator recovery procedure; the response never reveals the account.
        Audited as ACCOUNT_UNLINKED.
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: The member is no longer linked to an account
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/members/{memberId}/details:
    parameters:
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Members]
      operationId: getLocalMemberDetails
      summary: Read a member's private fields as far as the caller may (since 1.3.0)
      description: >
        Reads private fields under the owner-approved access defaults. Which fields appear depends
        on the caller's current rights, and a field the caller may not read is ABSENT from the
        response, never null: a null means "readable and not set". A holder of a live club-wide
        EDIT_MEMBERS grant (with a current verified identity) receives every field and may also read
        an ARCHIVED member, solely so the record can be exported, reactivated or erased. A holder of
        MANAGE_TEAMS for a team the member belongs to receives only names, email, phone and isPlayer,
        and only for ACTIVE members of that team; an unknown, archived or out-of-team member is 403. Every other caller gets 403. Authorization is decided before
        the path is validated. Each contact read by a team manager writes a CONTACT_READ audit event
        (identifiers only). Responses are never cacheable (Cache-Control: no-store). Since 1.8.0 an
        editor's read carries the member's version as an ETag, required by PUT /v1/members/{memberId}
        in If-Match; a team manager's read has none.
      responses:
        '200':
          description: The fields the caller may read
          headers:
            ETag:
              description: The member's version (editors only), for If-Match on the replacement
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberDetails' }
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/members/{memberId}/export:
    get:
      tags: [Members]
      operationId: exportLocalMember
      summary: Download everything stored about one member (since 1.7.0)
      description: >
        For a live club-wide EDIT_MEMBERS grant with a current verified identity: the complete
        export of one member for an access or portability request (privacy proposal section 4),
        the same content as the operator export. Active, archived and linked members can be
        exported. It contains the member's stored fields, team assignments, invitation timestamps,
        grants and guardianships (the other member only as an ID). It never contains the login
        binding, sessions, other people's names or contacts, or the audit trail. Authorization
        before validation (403 for any input without the grant), then 400 for a malformed ID;
        unknown members are 404. Every export is audited as MEMBER_EXPORTED with the editor as
        actor. Served as an attachment, never cacheable. The file holds personal data: deliver it
        to the verified requester and dispose of it under the controller's policy.
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The export as a JSON attachment
          headers:
            Content-Disposition:
              schema: { type: string }
              description: attachment; filename="member-<memberId>.json"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberExport' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/members/{memberId}/erase:
    post:
      tags: [Members]
      operationId: eraseArchivedLocalMember
      summary: Permanently erase an archived member (since 1.3.0)
      description: >
        Hard-deletes one ARCHIVED member (the existing MemberErasure service). Requires a live
        club-wide EDIT_MEMBERS grant with a current verified identity and exact Origin and session
        CSRF. The caller repeats the member's full name as a typed confirmation. Every refusal is
        the same 403 so a caller learns nothing about members they may not erase: an active, linked
        or administrator member, an unknown ID, a wrong typed name, a missing grant, a revoked
        identity. Irreversible; backups keep the member until they expire. Audited as MEMBER_ERASED.
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ErasureConfirmation' }
      responses:
        '204':
          description: Member erased
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/members/{memberId}/guardians:
    parameters:
      - name: memberId
        in: path
        required: true
        description: The minor.
        schema: { type: string, format: uuid }
    get:
      tags: [Guardians]
      operationId: listMemberGuardians
      summary: Proposed list of a minor's guardians (since 1.6.0)
      description: >
        For a live club-wide EDIT_MEMBERS grant with a current verified identity. Returns the
        current guardians of an active minor: their member id and names only. Authorization before
        validation; an unknown or adult member is 404 for editors only. Never cacheable.
      responses:
        '200':
          description: Current guardians (0 to 2)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuardianList' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [Guardians]
      operationId: addMemberGuardian
      summary: Proposed guardianship record, attested by an editor (since 1.6.0)
      description: >
        An EDIT_MEMBERS holder records that an adult member is a guardian of a minor, after
        verifying the relationship OUTSIDE OpenClub (the system cannot verify legal guardianship;
        the request is the editor's attestation). Requires exact Origin and session CSRF. The minor
        must be an active member below the club's adult age; the guardian an active adult member
        with a linked verified account, never the minor and never archived. At most two guardians
        per minor. A violation is 409 (not eligible, already a guardian, or two guardians already);
        an unknown member is 404. Grants no capability. Audited as GUARDIAN_LINKED (identifiers only).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuardianReference' }
      responses:
        '204': { description: Guardianship recorded }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/members/{memberId}/guardians/{guardianMemberId}:
    delete:
      tags: [Guardians]
      operationId: removeMemberGuardian
      summary: Proposed revocation of a guardianship (since 1.6.0)
      description: >
        An EDIT_MEMBERS holder ends a guardianship at any time (for example after a dispute; the
        reason stays in the club's private register, not in OpenClub). Exact Origin and session
        CSRF. The guardian loses access at the next request. Idempotent: an absent guardianship is
        204. Audited as GUARDIAN_UNLINKED. Guardianships also end without a request when the minor
        reaches the club's adult age (checked on every read) or when either member is archived,
        unlinked or erased.
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: guardianMemberId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Guardianship ended or absent }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/me/dependents:
    get:
      tags: [Guardians]
      operationId: listMyDependents
      summary: Proposed list of the signed-in guardian's minors (since 1.6.0)
      description: >
        The signed-in account's own member, if it is an active adult with a current verified
        identity, sees the minors it is currently a guardian of: id and names only. Access is by
        relationship, not capability, checked in the same SQL statement as the read. Anyone else
        gets an empty list (never 403), so the route reveals nothing. Never cacheable.
      responses:
        '200':
          description: Current dependents
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DependentList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/me/dependents/{memberId}:
    parameters:
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Guardians]
      operationId: getMyDependent
      summary: Proposed read of one dependent's record by their guardian (since 1.6.0)
      description: >
        A current guardian reads the minor's names, date of birth, email, phone, player flag and
        team names. Everything else is absent (gender, archive state, login, invitations, roles,
        grants). Every refusal, including an unknown member, a minor who is not theirs, a minor
        who reached the adult age and a malformed ID, is the same 403, so existence is not
        revealed. Each successful read is audited as DEPENDENT_READ (identifiers only).
      responses:
        '200':
          description: The dependent's record as far as a guardian may read it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DependentDetails' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/me/dependents/{memberId}/contacts:
    parameters:
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Guardians]
      operationId: replaceMyDependentContacts
      summary: Proposed edit of a dependent's contacts by their guardian (since 1.6.0)
      description: >
        A current guardian replaces the minor's email and phone (both optional for a minor; an
        omitted field is cleared, so the client reads them first). Exact Origin and session CSRF.
        Nothing else of the record can change. Every refusal is the same 403 as for the read,
        decided before the body is validated; an invalid body from a current guardian is 400.
        Audited as DEPENDENT_UPDATED.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DependentContacts' }
      responses:
        '204': { description: Contacts replaced }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/me/profile:
    get:
      tags: [Profile]
      operationId: getMyProfile
      summary: The signed-in member's own record (since 1.9.0)
      description: >
        Found by the verified session's account, never by an ID from the request. The caller must be
        an active member with a current verified identity; anyone else (a login without a member
        record, an unverified one) is 403. Returns the member's own fields, role and teams, and the
        member's version as a strong ETag for PUT /v1/me/profile/contacts. Not audited. Never
        cacheable (Cache-Control: no-store).
      responses:
        '200':
          description: The caller's own record
          headers:
            ETag:
              description: The member's version, for If-Match on the contacts change
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyProfile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/me/profile/contacts:
    put:
      tags: [Profile]
      operationId: replaceMyContacts
      summary: Replace the signed-in member's own email and phone (since 1.9.0)
      description: >
        Only email and phone change; an omitted field is cleared, so the client reads them first.
        Names, birth date, gender, player and role stay with editors (any other key is 400). Order
        of answers: session (401), exact Origin and session CSRF (403), the caller must be an active
        verified member (403), the body (400), If-Match (428 when missing; 412 "changed" for any
        value other than the current version, for example after an editor's change), then the
        club's rules for adults' contacts (400). Nothing changes on a refusal. Audited as
        SELF_CONTACTS_UPDATED. Returns the new ETag.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: If-Match
          in: header
          required: true
          description: The ETag of GET /v1/me/profile, for example "7"
          schema: { type: string, pattern: '^"[1-9][0-9]{0,18}"$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DependentContacts' }
      responses:
        '204':
          description: Contacts replaced
          headers:
            ETag:
              description: The member's new version
              schema: { type: string }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412':
          description: The record changed since it was read (code "changed")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '428':
          description: If-Match is missing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/me/events:
    get:
      tags: [Events]
      operationId: listMyEvents
      summary: The signed-in member's schedule (since 1.10.0)
      description: >
        Events overlapping [from, to) of the teams the caller is assigned to and of the teams of
        their current minors (the same guardianship rule as /v1/me/dependents), each with "for":
        whom among them it concerns (ID and first name). A team grant alone adds nothing here.
        The caller must be an active verified member (403 otherwise). At most 500 events, ordered
        by start; "truncated" says a narrower range shows the rest. Never cacheable.
      parameters:
        - name: from
          in: query
          required: false
          description: RFC 3339 date-time with offset; default now
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: RFC 3339 date-time with offset, after from and at most 366 days later; default from + 56 days
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: The caller's events
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, truncated]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/MyEvent' } }
                  truncated: { type: boolean }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/teams/{teamId}/events:
    parameters:
      - name: teamId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Events]
      operationId: listTeamEvents
      summary: A team's schedule (since 1.10.0)
      description: >
        Needs VIEW_TEAMS or MANAGE_TEAMS club-wide or for this team. Without any such grant the
        answer is 403 before the input is validated; with one for another team it is 403; an
        unknown team is 404 for a club-wide holder. canManage says whether the caller may change
        this team's events. At most 500 events by start, as for /v1/me/events.
      parameters:
        - name: from
          in: query
          required: false
          description: RFC 3339 date-time with offset; default now
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: RFC 3339 date-time with offset, after from and at most 366 days later; default from + 56 days
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: The team's events
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, truncated, canManage]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/TeamEvent' } }
                  truncated: { type: boolean }
                  canManage: { type: boolean }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [Events]
      operationId: createTeamEvents
      summary: Create an event, optionally repeated weekly (since 1.10.0)
      description: >
        Needs MANAGE_TEAMS club-wide or for this team; exact Origin and session CSRF. Without the
        grant anywhere the answer is 403 before the input is validated.
        Times are RFC 3339 with an offset and answered in UTC. kind is TRAINING, MATCH or OTHER;
        the title has 1–200 characters, location 1–200 and notes 1–2000 after trimming (blank
        optional text is stored as absent); the end is after the start and at most 7 days later;
        the start lies in 2000–2099.
        With repeatWeeklyUntil (a date) and timeZone (an IANA zone, both or neither) the event is
        also created every week up to and including that local date, keeping its local time in
        that zone across daylight-saving changes; at most 52 events in all. All or none are created.
        Not audited (no personal data).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/TeamEventInput'
              properties:
                repeatWeeklyUntil: { type: string, format: date }
                timeZone: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '201':
          description: The IDs of the created events, in date order
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ids]
                properties:
                  ids: { type: array, minItems: 1, maxItems: 52, items: { type: string, format: uuid } }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/events/{eventId}:
    parameters:
      - name: eventId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Events]
      operationId: replaceTeamEvent
      summary: Replace one event, including cancelling it (since 1.10.0)
      description: >
        Needs MANAGE_TEAMS club-wide or for the event's team; exact Origin and session CSRF. All
        fields are replaced (omitted location or notes are cleared); cancelled is required.
        Times are RFC 3339 with an offset and answered in UTC. kind is TRAINING, MATCH or OTHER;
        the title has 1–200 characters, location 1–200 and notes 1–2000 after trimming (blank
        optional text is stored as absent); the end is after the start and at most 7 days later;
        the start lies in 2000–2099.
        403 without the grant for this event's team, 404 for an unknown event.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/TeamEventInput'
              required: [cancelled]
              properties:
                cancelled: { type: boolean }
      responses:
        '204': { description: Event replaced }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [Events]
      operationId: deleteTeamEvent
      summary: Delete one event (since 1.10.0)
      description: >
        Needs MANAGE_TEAMS club-wide or for the event's team; exact Origin and session CSRF. 403
        without the grant for this event's team, 404 for an unknown event. Deleting a team
        deletes its events.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Event deleted }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/events/{eventId}/attendance:
    parameters:
      - name: eventId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Events]
      operationId: listEventAttendance
      summary: Every team member's answer for one event (since 1.11.0)
      description: >
        Needs VIEW_TEAMS or MANAGE_TEAMS club-wide or for the event's team; without any such grant
        403 before the ID is validated, 403 for another team's event, 404 for an unknown event.
        Lists the team's active members by public display name only (adults' full names, minors'
        first name and surname initial; no IDs, birth dates or contacts) with their answer or null,
        and the totals. Never cacheable.
      responses:
        '200':
          description: Answers and totals
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, counts]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [displayName, response]
                      properties:
                        displayName: { type: string }
                        response: { type: [string, 'null'], enum: ['YES', 'NO', MAYBE, null] }
                  counts: { $ref: '#/components/schemas/AttendanceCounts' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/events/{eventId}/attendance/{memberId}:
    parameters:
      - name: eventId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Events]
      operationId: answerEventAttendance
      summary: Answer for oneself or one's minor (since 1.11.0)
      description: >
        The caller answers for themselves or for their current minor (the guardianship rule of
        /v1/me/dependents), for an event of a team that member is assigned to. Order: session (401),
        exact Origin and CSRF (403), an active verified membership (403), IDs and body (400; only
        "response", no reason), then one 403 for every event or member the caller may not answer
        for, and 409 once the event has started or is cancelled. Replaces an earlier answer.
        Not audited.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [response]
              properties:
                response: { type: string, enum: ['YES', 'NO', MAYBE] }
      responses:
        '204': { description: Answer saved }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [Events]
      operationId: clearEventAttendance
      summary: Clear one's own or one's minor's answer (since 1.11.0)
      description: >
        The same rules as the answer; clearing a missing answer is also 204. 409 once the event has
        started or is cancelled.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Answer cleared }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/fee-periods:
    get:
      tags: [Fees]
      operationId: listFeePeriods
      summary: Fee periods with totals (since 1.12.0)
      description: >
        Needs the club-wide MANAGE_FEES capability (403 otherwise). Newest due date first, with the
        number of members included, how many paid, and the total and paid amounts in Swiss cents.
      responses:
        '200':
          description: Fee periods
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, name, dueDate, amountCents, members, paid, totalCents, paidCents]
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        dueDate: { type: string, format: date }
                        amountCents: { type: integer, minimum: 0 }
                        members: { type: integer, minimum: 0 }
                        paid: { type: integer, minimum: 0 }
                        totalCents: { type: integer, minimum: 0 }
                        paidCents: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [Fees]
      operationId: createFeePeriod
      summary: Create a fee period that includes every active member (since 1.12.0)
      description: >
        MANAGE_FEES, exact Origin and session CSRF; 403 before the body is validated. name has
        1–200 characters after trimming and is unique ignoring case (409); dueDate lies in
        2000–2099; amountCents is a whole JSON number from 0 to 10,000,000 (CHF 100,000). Every
        active member gets a fee at that amount, each audited as FEE_ASSIGNED. Tracking only.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, dueDate, amountCents]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                dueDate: { type: string, format: date }
                amountCents: { type: integer, minimum: 0, maximum: 10000000 }
      responses:
        '201':
          description: The new period
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/fee-periods/{periodId}:
    parameters:
      - name: periodId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Fees]
      operationId: renameFeePeriod
      summary: Change a period's name and due date (since 1.12.0)
      description: >
        MANAGE_FEES, exact Origin and session CSRF. The members' amounts are unchanged. 404 for an
        unknown period, 409 when another period has the name.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, dueDate]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                dueDate: { type: string, format: date }
      responses:
        '204': { description: Period changed }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [Fees]
      operationId: deleteFeePeriod
      summary: Delete a period and all its fees (since 1.12.0)
      description: >
        MANAGE_FEES, exact Origin and session CSRF. The body repeats the period's exact name as a
        confirmation (409 when it differs). Each removed fee is audited as FEE_REMOVED.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string }
      responses:
        '204': { description: Period deleted }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/fee-periods/{periodId}/fees:
    parameters:
      - name: periodId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Fees]
      operationId: listFees
      summary: The members' fees in one period (since 1.12.0)
      description: >
        MANAGE_FEES (403 before the input is validated). status is all (default: every fee, also of
        archived members), open, paid, or excluded (active members without a fee, amountCents and
        paidOn null). By last and first name. 404 for an unknown period.
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [all, open, paid, excluded] }
      responses:
        '200':
          description: Fees
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [memberId, firstName, lastName, archived, amountCents, paidOn]
                      properties:
                        memberId: { type: string, format: uuid }
                        firstName: { type: string }
                        lastName: { type: string }
                        archived: { type: boolean }
                        amountCents: { type: [integer, 'null'], minimum: 0 }
                        paidOn: { type: [string, 'null'], format: date }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/fee-periods/{periodId}/fees/{memberId}:
    parameters:
      - name: periodId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Fees]
      operationId: setFee
      summary: Set one member's amount and payment (since 1.12.0)
      description: >
        MANAGE_FEES, exact Origin and session CSRF. Includes an excluded active member (409 for an
        archived member who has no fee; an archived member's existing fee can still be marked
        paid). paidOn is a date or null (open). Audited per change: FEE_ASSIGNED, FEE_CHANGED,
        FEE_PAID, FEE_UNPAID. 404 for an unknown period or member.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amountCents, paidOn]
              properties:
                amountCents: { type: integer, minimum: 0, maximum: 10000000 }
                paidOn: { type: [string, 'null'], format: date }
      responses:
        '204': { description: Fee set }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [Fees]
      operationId: removeFee
      summary: Exclude a member from a period (since 1.12.0)
      description: >
        MANAGE_FEES, exact Origin and session CSRF. Audited as FEE_REMOVED when a fee existed;
        excluding again is 204. 404 for an unknown period.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Member excluded }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/me/fees:
    get:
      tags: [Fees]
      operationId: listMyFees
      summary: The signed-in member's own fees and their minors' (since 1.12.0)
      description: >
        For an active verified member (403 otherwise): their own fees and those of their current
        minors (the rule of /v1/me/dependents), newest due date first, each with whom it is for.
        Not audited. Never cacheable.
      responses:
        '200':
          description: Fees
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [periodId, periodName, dueDate, amountCents, paidOn, for]
                      properties:
                        periodId: { type: string, format: uuid }
                        periodName: { type: string }
                        dueDate: { type: string, format: date }
                        amountCents: { type: integer, minimum: 0 }
                        paidOn: { type: [string, 'null'], format: date }
                        for:
                          type: object
                          additionalProperties: false
                          required: [id, firstName]
                          properties:
                            id: { type: string, format: uuid }
                            firstName: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: >
        Secret returned by authenticated GET /v1/auth/me; must belong to the
        same unexpired session cookie. Also require exact configured Origin.
      schema: { type: string, minLength: 43, maxLength: 43 }
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: __Host-openclub_session
      description: >
        Verified OIDC-backed server-side session, with local loopback
        development cookie openclub_dev_session. A login is not an authorization.
  schemas:
    ClubReference:
      type: object
      additionalProperties: false
      required: [id, name, slug, genderRequiredForPlayers, adultAgeYears]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        slug: { type: string, minLength: 3, maxLength: 60, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        genderRequiredForPlayers: { type: boolean }
        adultAgeYears:
          type: integer
          minimum: 13
          maximum: 25
          description: Age from which a member is an adult in this club (since 1.1.0).
    MemberReference:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { type: string, format: uuid }
    PublicMemberName:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 402
          examples: [Peter Smith, Peter S.]
          description: Only the server-formatted public name; minors get first name and last-name initial.
    MemberSummary:
      type: object
      additionalProperties: false
      required: [id, firstName, lastName]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string, minLength: 1, maxLength: 200 }
        lastName: { type: string, minLength: 1, maxLength: 200 }
    ArchivedMemberPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [id, firstName, lastName, archivedAt]
            properties:
              id: { type: string, format: uuid }
              firstName: { type: string, minLength: 1, maxLength: 200 }
              lastName: { type: string, minLength: 1, maxLength: 200 }
              archivedAt: { type: string, format: date-time }
        nextCursor: { type: string, minLength: 1, maxLength: 2048 }
    MemberPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/MemberSummary' }
        nextCursor:
          type: string
          minLength: 1
          maxLength: 2048
          description: Absent on the last page.
    MemberNames:
      type: object
      additionalProperties: false
      required: [firstName, lastName]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 200 }
        lastName: { type: string, minLength: 1, maxLength: 200 }
    NewMember:
      type: object
      additionalProperties: false
      required: [firstName, lastName, dateOfBirth]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 200 }
        lastName: { type: string, minLength: 1, maxLength: 200 }
        dateOfBirth:
          type: string
          format: date
          description: Required for all members; no future dates. Private, never directory-visible.
        email:
          type: string
          format: email
          maxLength: 320
          description: Required for adults under the locally configured threshold.
        phone:
          type: string
          minLength: 1
          maxLength: 40
          description: Required alongside email for adults.
        gender:
          type: string
          minLength: 1
          description: Optional unless the club requires gender for players; not binary-only.
        isPlayer: { type: boolean, default: false }
    Team:
      type: object
      additionalProperties: false
      required: [id, name, memberCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        memberCount: { type: integer, minimum: 0 }
    TeamPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Team' }
    TeamName:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
    GrantView:
      type: object
      additionalProperties: false
      required: [capability, scope]
      properties:
        capability:
          type: string
          enum: [VIEW_MEMBER_DIRECTORY, EDIT_MEMBERS, MANAGE_PERMISSIONS, VIEW_TEAMS, MANAGE_TEAMS, MANAGE_FEES]
        scope: { type: string, enum: [CLUB, TEAM] }
        teamId: { type: string, format: uuid }
    GrantPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GrantView' }
    GrantMutation:
      type: object
      additionalProperties: false
      required: [memberId, capability, scope]
      properties:
        memberId: { type: string, format: uuid }
        capability:
          type: string
          enum: [VIEW_MEMBER_DIRECTORY, EDIT_MEMBERS, MANAGE_PERMISSIONS, VIEW_TEAMS, MANAGE_TEAMS, MANAGE_FEES]
        scope: { type: string, enum: [CLUB, TEAM] }
        teamId: { type: string, format: uuid }
    Invitation:
      type: object
      additionalProperties: false
      required: [secret, expiresAt]
      properties:
        secret:
          type: string
          minLength: 43
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
          description: 256 random bits, base64url. Returned once; only its hash is stored.
        expiresAt: { type: string, format: date-time }
    InvitationSecret:
      type: object
      additionalProperties: false
      required: [secret]
      properties:
        secret:
          type: string
          minLength: 43
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
    MemberDetails:
      type: object
      additionalProperties: false
      required: [id, firstName, lastName]
      description: >
        Only the fields the caller may read are present. null means readable and not set; an absent
        key means not permitted. Team managers see only id, names, email, phone and isPlayer.
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string, minLength: 1, maxLength: 200 }
        lastName: { type: string, minLength: 1, maxLength: 200 }
        dateOfBirth: { type: [string, 'null'], format: date }
        email: { type: [string, 'null'], format: email, maxLength: 320 }
        phone: { type: [string, 'null'], minLength: 1, maxLength: 40 }
        gender: { type: [string, 'null'], minLength: 1, maxLength: 200 }
        isPlayer: { type: boolean }
        archivedAt: { type: [string, 'null'], format: date-time }
        hasLinkedLogin:
          type: boolean
          description: Whether a sign-in account is linked; never the account or its identifiers.
        invitation:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status: { type: string, enum: [NONE, OPEN] }
            expiresAt: { type: string, format: date-time }
    ErasureConfirmation:
      type: object
      additionalProperties: false
      required: [confirmation]
      properties:
        confirmation:
          type: string
          minLength: 1
          maxLength: 402
          description: The member's full name, first name then last name, exactly as stored.
    GuardianReference:
      type: object
      additionalProperties: false
      required: [guardianMemberId]
      properties:
        guardianMemberId: { type: string, format: uuid }
    GuardianList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 2
          items: { $ref: '#/components/schemas/MemberSummary' }
    DependentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/MemberSummary' }
    DependentDetails:
      type: object
      additionalProperties: false
      required: [id, firstName, lastName, dateOfBirth, email, phone, isPlayer, teams]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string, minLength: 1, maxLength: 200 }
        lastName: { type: string, minLength: 1, maxLength: 200 }
        dateOfBirth: { type: string, format: date }
        email: { type: [string, 'null'], format: email, maxLength: 320 }
        phone: { type: [string, 'null'], minLength: 1, maxLength: 40 }
        isPlayer: { type: boolean }
        teams:
          type: array
          items: { type: string, minLength: 1, maxLength: 200 }
    MyProfile:
      type: object
      additionalProperties: false
      required: [id, firstName, lastName, dateOfBirth, email, phone, gender, isPlayer, role, teams]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        dateOfBirth: { type: string, format: date }
        email: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        gender: { type: [string, 'null'] }
        isPlayer: { type: boolean }
        role: { type: string, enum: [ADMIN, MEMBER] }
        teams:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
    TeamEventInput:
      type: object
      required: [kind, title, startsAt, endsAt]
      properties:
        kind: { type: string, enum: [TRAINING, MATCH, OTHER] }
        title: { type: string, minLength: 1, maxLength: 200 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        location: { type: [string, 'null'], maxLength: 200 }
        notes: { type: [string, 'null'], maxLength: 2000 }
    TeamEvent:
      type: object
      additionalProperties: false
      required: [id, teamId, teamName, kind, title, startsAt, endsAt, location, notes, cancelled, counts]
      properties:
        id: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        teamName: { type: string }
        kind: { type: string, enum: [TRAINING, MATCH, OTHER] }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        location: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        cancelled: { type: boolean }
        counts: { $ref: '#/components/schemas/AttendanceCounts' }
    AttendanceCounts:
      type: object
      additionalProperties: false
      required: ['yes', 'no', maybe]
      properties:
        'yes': { type: integer, minimum: 0 }
        'no': { type: integer, minimum: 0 }
        maybe: { type: integer, minimum: 0 }
    MyEvent:
      allOf:
        - $ref: '#/components/schemas/TeamEvent'
      required: [for]
      properties:
        for:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [id, firstName, response]
            properties:
              id: { type: string, format: uuid }
              firstName: { type: string }
              response: { type: [string, 'null'], enum: ['YES', 'NO', MAYBE, null] }
    DependentContacts:
      type: object
      additionalProperties: false
      properties:
        email: { type: string, format: email, minLength: 3, maxLength: 320 }
        phone: { type: string, minLength: 1, maxLength: 40 }
    MemberExport:
      type: object
      additionalProperties: false
      required: [exportedAt, member, teams, invitations, guardianships, fees, clubGrants, teamGrants]
      properties:
        exportedAt: { type: string, format: date-time }
        member:
          type: object
          additionalProperties: false
          required: [id, firstName, lastName, dateOfBirth, email, phone, gender, isPlayer, role, createdAt, archivedAt, hasLinkedLogin]
          properties:
            id: { type: string, format: uuid }
            firstName: { type: string }
            lastName: { type: string }
            dateOfBirth: { type: string, format: date }
            email: { type: [string, 'null'] }
            phone: { type: [string, 'null'] }
            gender: { type: [string, 'null'] }
            isPlayer: { type: boolean }
            role: { type: string, enum: [MEMBER, ADMIN] }
            createdAt: { type: string }
            archivedAt: { type: [string, 'null'] }
            hasLinkedLogin: { type: boolean }
        teams:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name]
            properties: { id: { type: string, format: uuid }, name: { type: string } }
        invitations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [createdAt, expiresAt, usedAt, revokedAt]
            properties:
              createdAt: { type: string }
              expiresAt: { type: string }
              usedAt: { type: [string, 'null'] }
              revokedAt: { type: [string, 'null'] }
        guardianships:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [relation, memberId, since]
            properties:
              relation: { type: string, enum: [guardianOf, guardedBy] }
              memberId: { type: string, format: uuid }
              since: { type: string }
        fees:
          description: The member's fees (since 1.12.0), by due date
          type: array
          items:
            type: object
            additionalProperties: false
            required: [periodId, periodName, dueDate, amountCents, paidOn]
            properties:
              periodId: { type: string, format: uuid }
              periodName: { type: string }
              dueDate: { type: string, format: date }
              amountCents: { type: integer, minimum: 0 }
              paidOn: { type: [string, 'null'], format: date }
        clubGrants: { type: array, items: { type: string } }
        teamGrants:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [teamId, teamName, capability]
            properties:
              teamId: { type: string, format: uuid }
              teamName: { type: string }
              capability: { type: string }
    Error:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string }
        message:
          type: string
          description: Optional generic detail; some M1 routes return code only, while member routes include a safe message.
  responses:
    Invalid:
      description: Invalid input, query, cursor or member field; no private data reflected
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: Session missing or expired
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated, but caller lacks operation-level permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Unknown or non-visible member ID; indistinguishable results
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Write conflicts with an existing record or policy state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: Database or authorization service unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
