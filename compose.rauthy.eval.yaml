# Optional disposable Rauthy identity-provider evaluation only.
# DO NOT use LOCAL_TEST or self-signed TLS for public/production deployments.
# Existing compose.auth.dev.yaml Keycloak integration stays supported unchanged.
services:
  rauthy:
    image: ghcr.io/sebadob/rauthy:0.37.2
    environment:
      LOCAL_TEST: "true"
      BOOTSTRAP_DIR: /app/bootstrap
      # Synthetic virtual authenticator tests require discoverable credentials.
      # Never mandate resident keys on real hardware by copying this overlay.
      WEBAUTHN_PASSKEY_REG_TYPE: "resident_key"
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - rauthy_eval_data:/app/data
      - ./dev/rauthy/bootstrap:/app/bootstrap:ro
    restart: "no"

volumes:
  rauthy_eval_data:
