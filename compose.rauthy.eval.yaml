# Optional disposable Rauthy identity-provider evaluation only.
# DO NOT use LOCAL_TEST or self-signed TLS for public/production deployments.
# Existing compose.auth.dev.yaml Keycloak integration stays supported unchanged.
services:
  rauthy:
    image: ghcr.io/sebadob/rauthy:0.36.1
    environment:
      LOCAL_TEST: "true"
      # Rauthy 0.36.1 advertises non-BCP47 'zhhans' by default; use only
      # valid locale tags rather than relaxing Kotlin OIDC metadata validation.
      FILTER_LANG_COMMON: "en de fr"
      BOOTSTRAP_DIR: /app/bootstrap
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - rauthy_eval_data:/app/data
      - ./dev/rauthy/bootstrap:/app/bootstrap:ro
    restart: "no"

volumes:
  rauthy_eval_data:
