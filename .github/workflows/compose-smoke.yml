name: Compose smoke test
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['loopcounter*.txt']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.detect.outputs.api }}
      web: ${{ steps.detect.outputs.web }}
      compose: ${{ steps.detect.outputs.compose }}
    steps:
      - name: Classify pull request files
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          api=false; web=false; compose=false
          if [[ "$EVENT" != pull_request ]]; then
            api=true; web=true; compose=true
          else
            changed="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename')"
            if [[ -z "$changed" ]]; then
              api=true; web=true; compose=true
            fi
            while IFS= read -r file; do
              [[ -z "$file" ]] && continue
              [[ "$file" =~ ^loopcounter[0-9]+\.txt$ ]] && continue
              case "$file" in
                # Docs-only changes should not rebuild the application.
                docs/contracts/*) api=true; web=true ;;
                # Rauthy browser specs run in rauthy-e2e.yml; no image or stack changes.
                dev/auth-e2e/rauthy-*.spec.js) ;;
                docs/*|README.md|.gitignore|AGENTS.md|apps/api/AGENTS.md|apps/web/AGENTS.md|.github/pull_request_template.md|.github/workflows/pr-size.yml) ;;
                apps/api/*)
                  api=true
                  [[ "$file" == apps/api/Dockerfile || "$file" == apps/api/.dockerignore ]] && compose=true
                  ;;
                apps/web/*)
                  web=true
                  [[ "$file" == apps/web/Dockerfile || "$file" == apps/web/.dockerignore || "$file" == apps/web/nginx.conf ]] && compose=true
                  ;;
                compose.yaml|compose.dev.yaml|compose.auth.dev.yaml|compose.rauthy.eval.yaml|dev/keycloak/*|.github/workflows/compose-smoke.yml) compose=true ;;
                compose.https.demo.yaml|compose.rauthy.demo.yaml|dev/deployment/*) compose=true ;;
                .github/workflows/build.yml) api=true; web=true ;;
                # Unknown paths run everything rather than silently missing coverage.
                *) api=true; web=true; compose=true ;;
              esac
            done <<< "$changed"
          fi
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "compose=$compose" >> "$GITHUB_OUTPUT"
          echo "Run selected: api=$api web=$web compose=$compose"

  compose:
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: openclub
    steps:
      - uses: actions/checkout@v4
      - name: Validate optional Keycloak dev overlay and realm JSON
        env:
          KEYCLOAK_DEV_ADMIN_PASSWORD: ci-validation-only-not-a-real-credential
        run: |
          set -euo pipefail
          docker compose -f compose.yaml -f compose.auth.dev.yaml config --quiet
          python3 -m json.tool dev/keycloak/openclub-realm.json > /dev/null
      - name: Validate opt-in synthetic HTTPS overlay and TLS ingress without provisioning
        shell: bash
        run: |
          set -euo pipefail
          export POSTGRES_PASSWORD=ci-synthetic-only-unique-password
          export OPENCLUB_DEMO_HOST=demo.example.invalid
          export OPENCLUB_OIDC_ISSUER=https://issuer.example.invalid/realms/openclub
          export OPENCLUB_OIDC_AUTHORIZATION_ENDPOINT=https://issuer.example.invalid/realms/openclub/protocol/openid-connect/auth
          export OPENCLUB_OIDC_CLIENT_ID=synthetic-test-client
          export OPENCLUB_OIDC_CLIENT_SECRET=synthetic-only-not-a-real-client-secret-12345
          docker compose -f compose.yaml -f compose.https.demo.yaml config --quiet
          docker compose -f compose.yaml -f compose.https.demo.yaml config --format json |
            jq -e '((.services.web.ports // []) | length) == 0 and
                   ((.services.postgres.ports // []) | length) == 0 and
                   (.services["demo-https"].ports | length) == 2 and
                   ([.services.postgres, .services.api, .services.web, .services["demo-https"]] | all(.restart == "unless-stopped")) and
                    .services.api.environment.OPENCLUB_AUTH_MODE == "production"'
          docker run --rm -e OPENCLUB_DEMO_HOST="$OPENCLUB_DEMO_HOST"             -v "$PWD/dev/deployment/Caddyfile:/etc/caddy/Caddyfile:ro"             caddy:2.11.9-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Validate one-host demo kit (Infomaniak runbook) and production Rauthy discovery
        shell: bash
        run: |
          set -euo pipefail
          env_dir="$RUNNER_TEMP/openclub-demo-env"
          host=club.demo.example.invalid
          id_host=id.demo.example.invalid
          # Every script reads the operator's YAML config; the template must stay valid as shipped.
          OPENCLUB_DEMO_CONFIG=dev/deployment/demo.example.yaml python3 dev/deployment/demo-config.py check
          export OPENCLUB_DEMO_CONFIG="$RUNNER_TEMP/demo.yaml"
          {
            echo "clubHost: $host"
            echo "idHost: $id_host"
            echo "adminEmail: admin@example.invalid"
            echo "envDirectory: $env_dir"
            echo "clubName: CI Demo Club"
            echo "email:"
            echo "  sender: demo@example.invalid"
          } > "$OPENCLUB_DEMO_CONFIG"
          python3 dev/deployment/demo-config.py check
          # An unknown key must fail instead of falling back to a default.
          { cat "$OPENCLUB_DEMO_CONFIG"; echo 'clubHots: typo.example.invalid'; } > "$RUNNER_TEMP/demo-typo.yaml"
          typo="$(OPENCLUB_DEMO_CONFIG="$RUNNER_TEMP/demo-typo.yaml" python3 dev/deployment/demo-config.py check 2>&1)" &&
            { echo 'Demo config accepted an unknown key' >&2; exit 1; }
          [[ "$typo" == *"unknown setting(s): clubHots"* ]] || { echo "Unexpected config error: $typo" >&2; exit 1; }
          bash dev/deployment/generate-demo-env.sh --synthetic-only
          # Rerunning must refuse to replace an existing installation's keys.
          if bash dev/deployment/generate-demo-env.sh --synthetic-only 2>/dev/null; then
            echo 'Generator overwrote an existing environment directory' >&2; exit 1
          fi
          [[ "$(stat -c %a "$env_dir/.env")" == 600 ]] || { echo 'Generated env file is not owner-only' >&2; exit 1; }
          python3 -m json.tool "$env_dir/rauthy-bootstrap/clients.json" > /dev/null
          jq -e --arg cb "https://$host/api/v1/auth/callback" \
            '.[0].redirect_uris == [$cb] and .[0].challenges == ["S256"] and .[0].secret == "generate"' \
            "$env_dir/rauthy-bootstrap/clients.json" > /dev/null
          export OPENCLUB_DEMO_PROJECT=openclub-demo-ci
          demo=(bash dev/deployment/demo-compose.sh)
          "${demo[@]}" config --quiet
          "${demo[@]}" config --format json |
            jq -e --arg id "$id_host" '
              (.services.rauthy.environment.LOCAL_TEST // null) == null and
              .services.rauthy.environment.PROXY_MODE == "true" and
              .services.rauthy.environment.PUB_URL == $id and
              ((.services.rauthy.ports // []) | length) == 0 and
              ((.services.postgres.ports // []) | length) == 0 and
              ((.services.web.ports // []) | length) == 0 and
              (.services["demo-https"].ports | length) == 2 and
              ([.services[]] | all(.restart == "unless-stopped")) and
              (.services.api.extra_hosts | tostring | contains($id)) and
              .services.api.environment.OPENCLUB_OIDC_ISSUER == ("https://" + $id + "/auth/v1/") and
              ([.services["demo-https"].volumes[] | select(.target == "/etc/caddy/Caddyfile") | .source] | .[0] | endswith("Caddyfile.rauthy"))' > /dev/null
          docker run --rm -e OPENCLUB_DEMO_HOST="$host" -e OPENCLUB_ID_HOST="$id_host" \
            -v "$PWD/dev/deployment/Caddyfile.rauthy:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.9-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          # Boot the production-configured provider alone and read discovery from inside the Compose
          # network, as Caddy would forward it. TLS and ACME need the real host and are not exercised here.
          "${demo[@]}" up -d --no-deps rauthy
          trap '"${demo[@]}" down -v >/dev/null 2>&1 || true' EXIT
          ready=false
          for attempt in {1..60}; do
            if docker run --rm --network openclub-demo-ci_default curlimages/curl:8.11.1 \
              --fail --silent --max-time 3 -H "Host: $id_host" -H 'X-Forwarded-For: 203.0.113.9' \
              -H 'X-Forwarded-Proto: https' http://rauthy:8080/.well-known/openid-configuration \
              > "$RUNNER_TEMP/demo-discovery.json" 2>/dev/null; then
              ready=true; break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            # Rauthy may echo rejected values in its errors: redact every quoted or long token.
            "${demo[@]}" logs --no-color rauthy 2>&1 | grep -Ei 'ERROR|panic|invalid|missing' |
              sed -E "s/'[^']*'/'[REDACTED]'/g; s/(password|secret|token|key)[=:][^ ]+/[REDACTED]/Ig; s/[A-Za-z0-9+\/=_-]{24,}/[REDACTED]/g" |
              tail -n 15 >&2 || true
            echo 'Production-configured Rauthy did not serve discovery' >&2; exit 1
          fi
          jq -e --arg iss "https://$id_host/auth/v1/" '
            .issuer == $iss and
            (.authorization_endpoint | startswith("https://" + ($iss | ltrimstr("https://") | split("/")[0]) + "/")) and
            (.token_endpoint | startswith("https://"))' "$RUNNER_TEMP/demo-discovery.json" > /dev/null ||
            { echo "Unexpected issuer metadata: $(jq -c '{issuer, authorization_endpoint}' "$RUNNER_TEMP/demo-discovery.json")" >&2; exit 1; }
          # The runbook's next step: copy the client secret Rauthy generated into the env file, unprinted.
          bash dev/deployment/fetch-demo-client-secret.sh --synthetic-only
          stored="$(sed -n 's/^OPENCLUB_OIDC_CLIENT_SECRET=//p' "$env_dir/.env")"
          [[ "${#stored}" -ge 32 && "$stored" != pending-* ]] || { echo 'Client secret was not stored' >&2; exit 1; }
          [[ "$(stat -c %a "$env_dir/.env")" == 600 ]] || { echo 'Env file lost owner-only permissions' >&2; exit 1; }
          "${demo[@]}" config --quiet
          # Email: the wrapper adds the email overlay once settings exist; the password comes from stdin.
          printf '%s' 'ci-only-mailbox-password' |
            bash dev/deployment/configure-demo-email.sh --synthetic-only
          "${demo[@]}" config --format json | jq -e '
            .services.rauthy.environment.SMTP_URL == "mail.infomaniak.com" and
            .services.rauthy.environment.SMTP_PORT == "465" and
            .services.rauthy.environment.SMTP_TLS_MODE == "tls" and
            .services.rauthy.environment.SMTP_USERNAME == "demo@example.invalid" and
            (.services.rauthy.environment.SMTP_FROM | contains("<demo@example.invalid>")) and
            .services.rauthy.environment.SMTP_PASSWORD == "ci-only-mailbox-password"' > /dev/null
          echo 'Demo kit validated: generated secrets, merged Compose, Caddy routes, production Rauthy issuer, client secret and email overlay.'
      - name: Verify optional Rauthy OIDC discovery with isolated localhost TLS
        shell: bash
        run: |
          set -euo pipefail
          overlay=(docker compose -f compose.yaml -f compose.rauthy.eval.yaml)
          "${overlay[@]}" config --quiet
          python3 -m json.tool dev/rauthy/bootstrap/clients.json > /dev/null
          python3 -m json.tool dev/rauthy/bootstrap/users.json > /dev/null
          "${overlay[@]}" up -d --no-deps mailpit rauthy
          trap '"${overlay[@]}" stop rauthy mailpit' EXIT
          ready=false
          for attempt in {1..45}; do
            # Local self-signed evaluation fixture ONLY; never disable TLS
            # validation for production or remotely hosted OIDC issuers.
            if curl --fail --silent --insecure --max-time 3 \
              https://localhost:8443/.well-known/openid-configuration \
              -o /tmp/openclub-rauthy-discovery.json 2>/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            # A synthetic-only startup failure: expose matching error diagnostics,
            # never full logs (the Rauthy first-boot log can contain credentials).
            "${overlay[@]}" logs --no-color rauthy 2>&1 |
              grep -Ei 'ERROR|panic|validation failed|invalid role|role.*not found' |
              sed -E 's/(password|secret|token)[=:][^ ]+/[REDACTED]/Ig' |
              tail -n 12 >&2 || true
            echo "Rauthy local discovery unavailable" >&2
            exit 1
          fi
          jq -e '
            .issuer == "https://localhost:8443/auth/v1/" and
            (.authorization_endpoint | startswith("https://localhost:8443/")) and
            (.token_endpoint | startswith("https://localhost:8443/")) and
            (.jwks_uri | startswith("https://localhost:8443/")) and
            (.id_token_signing_alg_values_supported | index("RS256") != null)
          ' /tmp/openclub-rauthy-discovery.json
          # Rauthy creates the client only at first boot of an empty fixture DB.
          # Never echo a generated client secret or place it in CI artifacts.
          client_secret="$("${overlay[@]}" exec -T rauthy /app/rauthy bootstrap get \
            -c /app/config-local-test.toml --kind client --id openclub-rauthy-ci --field secret --format raw)"
          [[ "${#client_secret}" -ge 32 ]] || { echo "No confidential Rauthy client secret bootstrapped" >&2; exit 1; }
          user_password="$("${overlay[@]}" exec -T rauthy /app/rauthy bootstrap get \
            -c /app/config-local-test.toml --kind user \
            --id openclub-rauthy-ci@example.invalid --field password --format raw)"
          [[ "${#user_password}" -ge 16 ]] ||
            { echo "Synthetic Rauthy user did not receive generated credentials" >&2; exit 1; }
          echo "Synthetic unprivileged Rauthy user and confidential OIDC client are provisioned."
          # Validate that a real OIDC authorization-code request with PKCE
          # reaches Rauthy. Never follow redirects or print callback/state.
          auth_endpoint="$(jq -er '.authorization_endpoint' /tmp/openclub-rauthy-discovery.json)"
          challenge="$(printf '%s' 'openclub-disposable-pkce-verifier-with-at-least-forty-three-characters' |
            openssl dgst -binary -sha256 | openssl base64 -A | tr '+/' '-_' | tr -d '=')"
          auth_status="$(curl --silent --insecure --max-time 10 -o /dev/null -w '%{http_code}' \
            -G "$auth_endpoint" \
            --data-urlencode 'response_type=code' \
            --data-urlencode 'client_id=openclub-rauthy-ci' \
            --data-urlencode 'redirect_uri=http://localhost:5173/api/v1/auth/callback' \
            --data-urlencode 'scope=openid' \
            --data-urlencode 'state=synthetic-ci-only-state' \
            --data-urlencode 'nonce=synthetic-ci-only-nonce' \
            --data-urlencode "code_challenge=$challenge" \
            --data-urlencode 'code_challenge_method=S256')"
          [[ "$auth_status" == 200 || "$auth_status" == 302 || "$auth_status" == 303 ]] ||
            { echo "Rauthy declined valid confidential authorization-code initiation: HTTP $auth_status" >&2; exit 1; }
          echo "Rauthy accepted synthetic confidential authorization-code initiation."

          # Never persist the private signing keys or accept an empty JWKS.
          jwks="$(jq -er '.jwks_uri' /tmp/openclub-rauthy-discovery.json)"
          curl --fail --silent --insecure --max-time 5 "$jwks" |
            jq -e '.keys | any(.kty == "RSA" and .kid != null and .n != null and .e != null and .d == null)'
          # A provider container restart must NOT rotate its OIDC signing
          # identity or lose the confidential client in the persistent volume.
          public_keys_before="$(curl --fail --silent --insecure --max-time 5 "$jwks" |
            jq -cS '[.keys[] | select(.kty == "RSA") | {kid, n, e}] | sort_by(.kid)')"
          "${overlay[@]}" stop rauthy
          "${overlay[@]}" up -d --no-deps rauthy
          ready=false
          for attempt in {1..45}; do
            if curl --fail --silent --insecure --max-time 3 \
              https://localhost:8443/.well-known/openid-configuration -o /dev/null 2>/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          [[ "$ready" == true ]] || { echo "Rauthy failed to restart with persistent identity" >&2; exit 1; }
          public_keys_after="$(curl --fail --silent --insecure --max-time 5 "$jwks" |
            jq -cS '[.keys[] | select(.kty == "RSA") | {kid, n, e}] | sort_by(.kid)')"
          [[ "$public_keys_before" == "$public_keys_after" ]] ||
            { echo "Rauthy signing identity changed after restart" >&2; exit 1; }
          restarted_secret="$("${overlay[@]}" exec -T rauthy /app/rauthy bootstrap get \
            -c /app/config-local-test.toml --kind client --id openclub-rauthy-ci --field secret --format raw)"
          [[ "$client_secret" == "$restarted_secret" ]] ||
            { echo "Confidential Rauthy client secret changed after restart" >&2; exit 1; }
          echo "Rauthy RSA signing identity and confidential client survived a container restart."
      - name: Start Keycloak while images build
        env:
          KEYCLOAK_DEV_ADMIN_PASSWORD: ci-validation-only-not-a-real-credential
        run: docker compose -f compose.yaml -f compose.auth.dev.yaml up -d --no-deps keycloak
      - uses: docker/setup-buildx-action@v4
      - name: Build and load API image with cache
        uses: docker/build-push-action@v7
        with:
          context: apps/api
          load: true
          tags: openclub-api:latest
          cache-from: type=gha,scope=compose-api
          cache-to: type=gha,scope=compose-api,mode=max,ignore-error=true
      - name: Build and load web image with cache
        uses: docker/build-push-action@v7
        with:
          context: apps/web
          load: true
          tags: openclub-web:latest
          cache-from: type=gha,scope=compose-web
          cache-to: type=gha,scope=compose-web,mode=max,ignore-error=true
      - name: Verify imported Keycloak realm discovery
        env:
          KEYCLOAK_DEV_ADMIN_PASSWORD: ci-validation-only-not-a-real-credential
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in {1..90}; do
            if curl --fail --silent --show-error --max-time 3 \
              http://127.0.0.1:8180/realms/openclub-dev/.well-known/openid-configuration \
              -o /tmp/openclub-oidc-discovery.json 2>/dev/null; then
              ready=true
              break
            fi
            sleep 3
          done
          if [[ "$ready" != true ]]; then
            echo "Keycloak did not publish the openclub-dev realm discovery document" >&2
            exit 1
          fi
          jq -e '.issuer == "http://localhost:8180/realms/openclub-dev" and
                 (.authorization_endpoint | type == "string") and
                 (.token_endpoint | type == "string") and
                 (.jwks_uri | type == "string")' /tmp/openclub-oidc-discovery.json
      - name: Provision restricted synthetic OIDC client and test user
        env:
          KEYCLOAK_DEV_ADMIN_PASSWORD: ci-validation-only-not-a-real-credential
        shell: bash
        run: |
          set -euo pipefail
          bash -n dev/keycloak/provision-test-fixtures.sh
          export OPENCLUB_E2E_CLIENT_SECRET="$(openssl rand -hex 32)"
          export OPENCLUB_E2E_USER_PASSWORD="$(openssl rand -hex 32)"
          bash dev/keycloak/provision-test-fixtures.sh
          # Idempotent ordinary-user rerun must still succeed.
          bash dev/keycloak/provision-test-fixtures.sh
          base=http://127.0.0.1:8180/admin/realms/openclub-dev
          token="$(curl --fail --silent --show-error --max-time 10 \
            -X POST http://127.0.0.1:8180/realms/master/protocol/openid-connect/token \
            -d 'grant_type=password' -d 'client_id=admin-cli' \
            --data-urlencode 'username=openclub-local-admin' \
            --data-urlencode "password=$KEYCLOAK_DEV_ADMIN_PASSWORD" | jq -er '.access_token')"
          kc_get() {
            curl --fail --silent --show-error --max-time 10 \
              -H "Authorization: Bearer $token" "$1"
          }
          kc_roles() {
            curl --fail --silent --show-error --max-time 10 \
              -X "$1" -H "Authorization: Bearer $token" \
              -H 'Content-Type: application/json' --data-binary "$2" "$3"
          }
          user_id="$(kc_get "$base/users?username=openclub-ci-user&exact=true" |
            jq -er '.[] | select(.username == "openclub-ci-user") | .id')"
          manager_id="$(kc_get "$base/clients?clientId=realm-management" |
            jq -er '.[] | select(.clientId == "realm-management") | .id')"
          admin_role="$(kc_get "$base/clients/$manager_id/roles/realm-admin")"
          role_mapping="$(jq -nc --argjson role "$admin_role" '[$role]')"
          mapping_url="$base/users/$user_id/role-mappings/clients/$manager_id"
          kc_roles POST "$role_mapping" "$mapping_url"
          # Provisioning must fail without resetting the password or claiming success.
          if bash dev/keycloak/provision-test-fixtures.sh; then
            echo "Privileged fixture user was incorrectly accepted" >&2
            exit 1
          fi
          kc_roles DELETE "$role_mapping" "$mapping_url"
          bash dev/keycloak/provision-test-fixtures.sh
      - name: Start all services from built images
        run: docker compose up -d --no-build --wait --wait-timeout 180
      - name: Verify web and proxied API
        run: |
          set -euo pipefail
          curl --fail --retry 12 --retry-delay 3 --retry-connrefused http://localhost:5173/
          test "$(curl --fail --silent http://localhost:5173/api/health)" = '{"status":"ok"}'
          test "$(curl --fail --silent http://localhost:5173/api/ready)" = '{"status":"ready"}'

      - name: Measure running synthetic stack resource usage (non-peak)
        shell: bash
        run: bash dev/measure-synthetic-compose.sh --synthetic-only
      - name: Verify browser security headers on web, API and denial responses
        shell: bash
        run: |
          set -euo pipefail
          for path in / /api/health /api/v1/club; do
            headers="$(curl --silent --show-error --dump-header - --output /dev/null "http://localhost:5173${path}")"
            expected_headers=(
              'x-content-type-options: nosniff'
              'x-frame-options: DENY'
              'referrer-policy: no-referrer'
              'permissions-policy: camera=(), microphone=(), geolocation=()'
              "content-security-policy: default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'"
            )
            for expected in "${expected_headers[@]}"; do
              if ! printf '%s\n' "$headers" | tr -d '\r' |
                grep -Fxi -- "$expected" >/dev/null; then
                echo "::error::Missing $expected on $path" >&2
                exit 1
              fi
            done
          done

      - name: Verify Keycloak from the browser and API-container issuer URL
        env:
          KEYCLOAK_DEV_ADMIN_PASSWORD: ci-validation-only-not-a-real-credential
        shell: bash
        run: |
          set -euo pipefail
          overlay=(docker compose -f compose.yaml -f compose.auth.dev.yaml)
          "${overlay[@]}" up -d --no-deps oidc-backchannel
          ready=false
          for attempt in {1..45}; do
            # Host browser: published port. API: same URL resolves via
            # localhost-only listener in the API network namespace.
            if curl --fail --silent --max-time 3 \
              http://localhost:8180/realms/openclub-dev/.well-known/openid-configuration \
              -o /tmp/openclub-host-discovery.json 2>/dev/null &&
              "${overlay[@]}" exec -T api wget -q -O - \
              http://localhost:8180/realms/openclub-dev/.well-known/openid-configuration \
              > /tmp/openclub-api-discovery.json 2>/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            echo "API container could not reach identical Keycloak issuer URL" >&2
            exit 1
          fi
          jq -e --slurpfile host /tmp/openclub-host-discovery.json \
            --slurpfile api /tmp/openclub-api-discovery.json \
            '(.issuer == "http://localhost:8180/realms/openclub-dev") and
             (.issuer == $host[0].issuer) and (.issuer == $api[0].issuer) and
             (.token_endpoint == $host[0].token_endpoint) and
             (.jwks_uri == $host[0].jwks_uri)' \
            /tmp/openclub-api-discovery.json
          jwks_url="$(jq -r '.jwks_uri' /tmp/openclub-api-discovery.json)"
          case "$jwks_url" in
            http://localhost:8180/realms/openclub-dev/*) ;;
            *) echo "JWKS URL escaped local pinned issuer" >&2; exit 1 ;;
          esac
          "${overlay[@]}" exec -T api wget -q -O - "$jwks_url" |
            jq -e '.keys | type == "array" and length > 0'
          "${overlay[@]}" exec -T api wget -q -O - http://127.0.0.1:8080/health |
            grep -F '"status":"ok"'
      - name: Prove synthetic Flyway club persistence across service restart
        shell: bash
        env:
          OPENCLUB_RESTART_CI_CONFIRM: disposable-only
        run: bash dev/verify-synthetic-compose-restart.sh --synthetic-only
      - name: Run the demo seed against the migrated schema (rolled back)
        shell: bash
        run: |
          set -euo pipefail
          # Real Flyway schema of this disposable stack. A fixture club and administrator, the seed itself,
          # then checks, all in one transaction that is rolled back, so later steps see the same database.
          [[ "$(docker compose exec -T postgres psql -t -A -U openclub -d openclub -c 'SELECT COUNT(*) FROM clubs')" == 0 ]] ||
            { echo 'Seed check expects the disposable CI database without a club' >&2; exit 1; }
          {
            echo "BEGIN;"
            echo "INSERT INTO clubs (id, name, slug) VALUES (gen_random_uuid(), 'Seed CI', 'seed-ci');"
            echo "INSERT INTO accounts (id) VALUES ('00000000-0000-0000-0000-00000000c1a1');"
            echo "INSERT INTO members (id, account_id, first_name, last_name, date_of_birth, email, phone, role) VALUES (gen_random_uuid(), '00000000-0000-0000-0000-00000000c1a1', 'Seed', 'Admin', DATE '1990-01-01', 'a@example.invalid', '+41000000000', 'ADMIN');"
            cat dev/deployment/seed-demo-data.sql
            echo "DO \$\$ BEGIN IF (SELECT COUNT(*) FROM teams) <> 4 OR (SELECT COUNT(*) FROM members) <> 20 OR (SELECT COUNT(*) FROM member_team_assignments) <> 18 OR (SELECT COUNT(*) FROM team_events) <> 16 OR (SELECT COUNT(*) FROM event_shifts) <> 2 OR (SELECT COUNT(*) FROM event_rides) <> 2 OR (SELECT COUNT(*) FROM member_absences) <> 1 OR (SELECT COUNT(*) FROM join_requests) <> 1 THEN RAISE EXCEPTION 'Unexpected seed result'; END IF; END \$\$;"
          } > "$RUNNER_TEMP/seed-check.sql"
          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -q -U openclub -d openclub < <(cat "$RUNNER_TEMP/seed-check.sql"; echo "ROLLBACK;")
          if docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -q -U openclub -d openclub \
               < <(cat "$RUNNER_TEMP/seed-check.sql" dev/deployment/seed-demo-data.sql; echo "ROLLBACK;") >/dev/null 2>&1; then
            echo 'A second seed run was not refused' >&2; exit 1
          fi
          [[ "$(docker compose exec -T postgres psql -t -A -U openclub -d openclub -c 'SELECT COUNT(*) FROM clubs')" == 0 ]]
          shellcheck dev/deployment/*.sh
          echo 'Demo seed verified on the migrated schema and refused a second run; deployment scripts pass shellcheck.'
      - name: Verify failed database readiness does not masquerade as liveness
        shell: bash
        run: |
          set -euo pipefail
          # Last normal check: stop the disposable database after OIDC validation.
          docker compose stop postgres
          unavailable=false
          # Hikari's configured connection timeout is 5s; curl must wait longer
          # to observe the application's 503 rather than aborting with nginx 499.
          for attempt in {1..6}; do
            status="$(curl --silent --output /tmp/openclub-readiness.json \
              --write-out '%{http_code}' --max-time 12 \
              http://localhost:5173/api/ready || true)"
            if [[ "$status" == 503 ]] &&
              [[ "$(cat /tmp/openclub-readiness.json)" == '{"status":"unavailable"}' ]]; then
              unavailable=true
              break
            fi
            sleep 2
          done
          if [[ "$unavailable" != true ]]; then
            echo "API readiness did not report a database outage; last HTTP status: $status" >&2
            exit 1
          fi
          test "$(curl --fail --silent http://localhost:5173/api/health)" = '{"status":"ok"}'
      - name: Show stack and Keycloak logs on failure
        if: failure()
        env:
          KEYCLOAK_DEV_ADMIN_PASSWORD: ci-validation-only-not-a-real-credential
        run: docker compose -f compose.yaml -f compose.auth.dev.yaml logs --no-color
      - name: Stop all containers (preserve database volumes)
        if: always()
        env:
          KEYCLOAK_DEV_ADMIN_PASSWORD: ci-validation-only-not-a-real-credential
        run: docker compose -f compose.yaml -f compose.auth.dev.yaml down
