name: Compose smoke test
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['loopcounter*.txt']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.detect.outputs.api }}
      web: ${{ steps.detect.outputs.web }}
      compose: ${{ steps.detect.outputs.compose }}
    steps:
      - name: Classify pull request files
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          api=false; web=false; compose=false
          if [[ "$EVENT" != pull_request ]]; then
            api=true; web=true; compose=true
          else
            changed="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename')"
            if [[ -z "$changed" ]]; then
              api=true; web=true; compose=true
            fi
            while IFS= read -r file; do
              [[ -z "$file" ]] && continue
              [[ "$file" =~ ^loopcounter[0-9]+\.txt$ ]] && continue
              case "$file" in
                # Docs-only changes should not rebuild the application.
                docs/contracts/*) api=true; web=true ;;
                docs/*|README.md|.gitignore|AGENTS.md|apps/api/AGENTS.md|apps/web/AGENTS.md|.github/pull_request_template.md|.github/workflows/pr-size.yml) ;;
                apps/api/*)
                  api=true
                  [[ "$file" == apps/api/Dockerfile || "$file" == apps/api/.dockerignore ]] && compose=true
                  ;;
                apps/web/*)
                  web=true
                  [[ "$file" == apps/web/Dockerfile || "$file" == apps/web/.dockerignore || "$file" == apps/web/nginx.conf ]] && compose=true
                  ;;
                compose.yaml|compose.dev.yaml|compose.auth.dev.yaml|dev/keycloak/*|.github/workflows/compose-smoke.yml) compose=true ;;
                .github/workflows/build.yml) api=true; web=true ;;
                # Unknown paths run everything rather than silently missing coverage.
                *) api=true; web=true; compose=true ;;
              esac
            done <<< "$changed"
          fi
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "compose=$compose" >> "$GITHUB_OUTPUT"
          echo "Run selected: api=$api web=$web compose=$compose"

  compose:
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: openclub
    steps:
      - uses: actions/checkout@v4
      - name: Validate optional Keycloak dev overlay and realm JSON
        env:
          KEYCLOAK_DEV_ADMIN_PASSWORD: ci-validation-only-not-a-real-credential
        run: |
          set -euo pipefail
          docker compose -f compose.yaml -f compose.auth.dev.yaml config --quiet
          python3 -m json.tool dev/keycloak/openclub-realm.json > /dev/null
      - name: Start Keycloak while images build
        env:
          KEYCLOAK_DEV_ADMIN_PASSWORD: ci-validation-only-not-a-real-credential
        run: docker compose -f compose.yaml -f compose.auth.dev.yaml up -d --no-deps keycloak
      - uses: docker/setup-buildx-action@v4
      - name: Build and load API image with cache
        uses: docker/build-push-action@v7
        with:
          context: apps/api
          load: true
          tags: openclub-api:latest
          cache-from: type=gha,scope=compose-api
          cache-to: type=gha,scope=compose-api,mode=max,ignore-error=true
      - name: Build and load web image with cache
        uses: docker/build-push-action@v7
        with:
          context: apps/web
          load: true
          tags: openclub-web:latest
          cache-from: type=gha,scope=compose-web
          cache-to: type=gha,scope=compose-web,mode=max,ignore-error=true
      - name: Verify imported Keycloak realm discovery
        env:
          KEYCLOAK_DEV_ADMIN_PASSWORD: ci-validation-only-not-a-real-credential
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in {1..90}; do
            if curl --fail --silent --show-error --max-time 3 \
              http://127.0.0.1:8180/realms/openclub-dev/.well-known/openid-configuration \
              -o /tmp/openclub-oidc-discovery.json 2>/dev/null; then
              ready=true
              break
            fi
            sleep 3
          done
          if [[ "$ready" != true ]]; then
            echo "Keycloak did not publish the openclub-dev realm discovery document" >&2
            exit 1
          fi
          jq -e '.issuer == "http://localhost:8180/realms/openclub-dev" and
                 (.authorization_endpoint | type == "string") and
                 (.token_endpoint | type == "string") and
                 (.jwks_uri | type == "string")' /tmp/openclub-oidc-discovery.json
      - name: Provision restricted synthetic OIDC client and test user
        env:
          KEYCLOAK_DEV_ADMIN_PASSWORD: ci-validation-only-not-a-real-credential
        shell: bash
        run: |
          set -euo pipefail
          bash -n dev/keycloak/provision-test-fixtures.sh
          export OPENCLUB_E2E_CLIENT_SECRET="$(openssl rand -hex 32)"
          export OPENCLUB_E2E_USER_PASSWORD="$(openssl rand -hex 32)"
          bash dev/keycloak/provision-test-fixtures.sh
          # Idempotent ordinary-user rerun must still succeed.
          bash dev/keycloak/provision-test-fixtures.sh
          base=http://127.0.0.1:8180/admin/realms/openclub-dev
          token="$(curl --fail --silent --show-error --max-time 10 \
            -X POST http://127.0.0.1:8180/realms/master/protocol/openid-connect/token \
            -d 'grant_type=password' -d 'client_id=admin-cli' \
            --data-urlencode 'username=openclub-local-admin' \
            --data-urlencode "password=$KEYCLOAK_DEV_ADMIN_PASSWORD" | jq -er '.access_token')"
          kc_get() {
            curl --fail --silent --show-error --max-time 10 \
              -H "Authorization: Bearer $token" "$1"
          }
          kc_roles() {
            curl --fail --silent --show-error --max-time 10 \
              -X "$1" -H "Authorization: Bearer $token" \
              -H 'Content-Type: application/json' --data-binary "$2" "$3"
          }
          user_id="$(kc_get "$base/users?username=openclub-ci-user&exact=true" |
            jq -er '.[] | select(.username == "openclub-ci-user") | .id')"
          manager_id="$(kc_get "$base/clients?clientId=realm-management" |
            jq -er '.[] | select(.clientId == "realm-management") | .id')"
          admin_role="$(kc_get "$base/clients/$manager_id/roles/realm-admin")"
          role_mapping="$(jq -nc --argjson role "$admin_role" '[$role]')"
          mapping_url="$base/users/$user_id/role-mappings/clients/$manager_id"
          kc_roles POST "$role_mapping" "$mapping_url"
          # Provisioning must fail without resetting the password or claiming success.
          if bash dev/keycloak/provision-test-fixtures.sh; then
            echo "Privileged fixture user was incorrectly accepted" >&2
            exit 1
          fi
          kc_roles DELETE "$role_mapping" "$mapping_url"
          bash dev/keycloak/provision-test-fixtures.sh
      - name: Start all services from built images
        run: docker compose up -d --no-build --wait --wait-timeout 180
      - name: Verify web and proxied API
        run: |
          set -euo pipefail
          curl --fail --retry 12 --retry-delay 3 --retry-connrefused http://localhost:5173/
          test "$(curl --fail --silent http://localhost:5173/api/health)" = '{"status":"ok"}'
          test "$(curl --fail --silent http://localhost:5173/api/ready)" = '{"status":"ready"}'

      - name: Verify browser security headers on web, API and denial responses
        shell: bash
        run: |
          set -euo pipefail
          for path in / /api/health /api/v1/club; do
            headers="$(curl --silent --show-error --dump-header - --output /dev/null "http://localhost:5173${path}")"
            expected_headers=(
              'x-content-type-options: nosniff'
              'x-frame-options: DENY'
              'referrer-policy: no-referrer'
              'permissions-policy: camera=(), microphone=(), geolocation=()'
            )
            for expected in "${expected_headers[@]}"; do
              if ! printf '%s\n' "$headers" | tr -d '\r' |
                grep -Fxi -- "$expected" >/dev/null; then
                echo "::error::Missing $expected on $path" >&2
                exit 1
              fi
            done
          done

      - name: Verify Keycloak from the browser and API-container issuer URL
        env:
          KEYCLOAK_DEV_ADMIN_PASSWORD: ci-validation-only-not-a-real-credential
        shell: bash
        run: |
          set -euo pipefail
          overlay=(docker compose -f compose.yaml -f compose.auth.dev.yaml)
          "${overlay[@]}" up -d --no-deps oidc-backchannel
          ready=false
          for attempt in {1..45}; do
            # Host browser: published port. API: same URL resolves via
            # localhost-only listener in the API network namespace.
            if curl --fail --silent --max-time 3 \
              http://localhost:8180/realms/openclub-dev/.well-known/openid-configuration \
              -o /tmp/openclub-host-discovery.json 2>/dev/null &&
              "${overlay[@]}" exec -T api wget -q -O - \
              http://localhost:8180/realms/openclub-dev/.well-known/openid-configuration \
              > /tmp/openclub-api-discovery.json 2>/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            echo "API container could not reach identical Keycloak issuer URL" >&2
            exit 1
          fi
          jq -e --slurpfile host /tmp/openclub-host-discovery.json \
            --slurpfile api /tmp/openclub-api-discovery.json \
            '(.issuer == "http://localhost:8180/realms/openclub-dev") and
             (.issuer == $host[0].issuer) and (.issuer == $api[0].issuer) and
             (.token_endpoint == $host[0].token_endpoint) and
             (.jwks_uri == $host[0].jwks_uri)' \
            /tmp/openclub-api-discovery.json
          jwks_url="$(jq -r '.jwks_uri' /tmp/openclub-api-discovery.json)"
          case "$jwks_url" in
            http://localhost:8180/realms/openclub-dev/*) ;;
            *) echo "JWKS URL escaped local pinned issuer" >&2; exit 1 ;;
          esac
          "${overlay[@]}" exec -T api wget -q -O - "$jwks_url" |
            jq -e '.keys | type == "array" and length > 0'
          "${overlay[@]}" exec -T api wget -q -O - http://127.0.0.1:8080/health |
            grep -F '"status":"ok"'
      - name: Verify failed database readiness does not masquerade as liveness
        shell: bash
        run: |
          set -euo pipefail
          # Last normal check: stop the disposable database after OIDC validation.
          docker compose stop postgres
          unavailable=false
          # Hikari's configured connection timeout is 5s; curl must wait longer
          # to observe the application's 503 rather than aborting with nginx 499.
          for attempt in {1..6}; do
            status="$(curl --silent --output /tmp/openclub-readiness.json \
              --write-out '%{http_code}' --max-time 12 \
              http://localhost:5173/api/ready || true)"
            if [[ "$status" == 503 ]] &&
              [[ "$(cat /tmp/openclub-readiness.json)" == '{"status":"unavailable"}' ]]; then
              unavailable=true
              break
            fi
            sleep 2
          done
          if [[ "$unavailable" != true ]]; then
            echo "API readiness did not report a database outage; last HTTP status: $status" >&2
            exit 1
          fi
          test "$(curl --fail --silent http://localhost:5173/api/health)" = '{"status":"ok"}'
      - name: Show stack and Keycloak logs on failure
        if: failure()
        env:
          KEYCLOAK_DEV_ADMIN_PASSWORD: ci-validation-only-not-a-real-credential
        run: docker compose -f compose.yaml -f compose.auth.dev.yaml logs --no-color
      - name: Stop all containers (preserve database volumes)
        if: always()
        env:
          KEYCLOAK_DEV_ADMIN_PASSWORD: ci-validation-only-not-a-real-credential
        run: docker compose -f compose.yaml -f compose.auth.dev.yaml down
