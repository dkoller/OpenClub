name: Compose smoke test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and start all services
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Verify web and proxied API
        run: |
          set -euo pipefail
          curl --fail --retry 12 --retry-delay 3 --retry-connrefused http://localhost:5173/
          test "$(curl --fail --silent http://localhost:5173/api/health)" = '{"status":"ok"}'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers (preserve database volume)
        if: always()
        run: docker compose down
