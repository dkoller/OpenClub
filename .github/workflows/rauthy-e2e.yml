name: Rauthy browser authentication
on:
  pull_request:
    paths:
      - 'apps/api/src/main/**'
      - 'apps/web/src/**'
      - 'dev/rauthy/**'
      - 'dev/auth-e2e/rauthy-*'
      - 'compose.rauthy.eval.yaml'
      - '.github/workflows/rauthy-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/src/main/**'
      - 'apps/web/src/**'
      - 'dev/rauthy/**'
      - 'dev/auth-e2e/rauthy-*'
      - 'compose.rauthy.eval.yaml'
      - '.github/workflows/rauthy-e2e.yml'
permissions:
  contents: read
concurrency:
  group: rauthy-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: openclub-rauthy-browser
      DB_URL: jdbc:postgresql://localhost:5432/openclub
      DB_USER: openclub
      DB_PASSWORD: openclub_dev
      OPENCLUB_AUTH_MODE: production
      OPENCLUB_PUBLIC_ORIGIN: https://localhost:5443
      OPENCLUB_OIDC_ISSUER: https://localhost:8443/auth/v1/
      OPENCLUB_OIDC_AUTHORIZATION_ENDPOINT: https://localhost:8443/auth/v1/oidc/authorize
      OPENCLUB_OIDC_CLIENT_ID: openclub-rauthy-https-ci
      OPENCLUB_OIDC_REDIRECT_URI: https://localhost:5443/api/v1/auth/callback
      PORT: '8080'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.24.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The real browser install took ~34s in Keycloak #287. Run it while
      # the independent provider and JVM start, but require success before tests.
      - name: Prepare Playwright Chromium alongside provider startup
        shell: bash
        run: |
          set -euo pipefail
          nohup bash -c '
            cd dev/auth-e2e
            if pnpm install --frozen-lockfile &&
               pnpm exec playwright install --with-deps chromium; then
              echo success > "$1"
            else
              echo failed > "$1"
            fi
          ' _ "$RUNNER_TEMP/openclub-browser-setup.status" \
            > "$RUNNER_TEMP/openclub-browser-setup.log" 2>&1 < /dev/null &
      - name: Start disposable PostgreSQL and Rauthy
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f compose.yaml -f compose.rauthy.eval.yaml up -d postgres rauthy
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent --insecure --max-time 3 \
              https://localhost:8443/.well-known/openid-configuration -o /dev/null 2>/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            # First-boot logs may contain generated administrator credentials.
            # Show only matched error lines, never the full provider log.
            docker compose -f compose.yaml -f compose.rauthy.eval.yaml logs --no-color rauthy 2>&1 |
              grep -Ei 'ERROR|panic|invalid.*config|parse.*error|validation failed' |
              sed -E 's/(password|secret|token)[=:][^ ]+/[REDACTED]/Ig' |
              tail -n 12 >&2 || true
            echo 'Disposable Rauthy not ready' >&2
            exit 1
          fi
      - name: Obtain synthetic confidential client and user credentials
        shell: bash
        run: |
          set -euo pipefail
          overlay=(docker compose -f compose.yaml -f compose.rauthy.eval.yaml)
          client_secret="$("${overlay[@]}" exec -T rauthy /app/rauthy bootstrap get \
            -c /app/config-local-test.toml --kind client --id openclub-rauthy-https-ci --field secret --format raw)"
          user_password="$("${overlay[@]}" exec -T rauthy /app/rauthy bootstrap get \
            -c /app/config-local-test.toml --kind user --id openclub-rauthy-ci@example.invalid --field password --format raw)"
          [[ "${#client_secret}" -ge 32 && "${#user_password}" -ge 16 ]] ||
            { echo 'Missing disposable OIDC credentials' >&2; exit 1; }
          echo "::add-mask::$client_secret"
          echo "::add-mask::$user_password"
          echo "OPENCLUB_OIDC_CLIENT_SECRET=$client_secret" >> "$GITHUB_ENV"
          echo "OPENCLUB_RAUTHY_E2E_USER_PASSWORD=$user_password" >> "$GITHUB_ENV"
      - name: Verify provider restart preserves signing keys and login credentials
        shell: bash
        run: |
          set -euo pipefail
          overlay=(docker compose -f compose.yaml -f compose.rauthy.eval.yaml)
          # Capture only a hash of the public JWKS; do not print any credentials.
          jwks_before="$(curl --fail --silent --insecure --max-time 5 https://localhost:8443/auth/v1/oidc/certs | jq -S -c . | sha256sum | cut -d' ' -f1)"
          "${overlay[@]}" restart rauthy >/dev/null
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent --insecure --max-time 3 \
              https://localhost:8443/.well-known/openid-configuration -o /dev/null 2>/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          [[ "$ready" == true ]] || { echo 'Rauthy failed to restart' >&2; exit 1; }
          jwks_after="$(curl --fail --silent --insecure --max-time 5 https://localhost:8443/auth/v1/oidc/certs | jq -S -c . | sha256sum | cut -d' ' -f1)"
          [[ "$jwks_before" == "$jwks_after" ]] || { echo 'Rauthy signing keys changed on restart' >&2; exit 1; }
          client_after="$("${overlay[@]}" exec -T rauthy /app/rauthy bootstrap get \
            -c /app/config-local-test.toml --kind client --id openclub-rauthy-https-ci --field secret --format raw)"
          user_after="$("${overlay[@]}" exec -T rauthy /app/rauthy bootstrap get \
            -c /app/config-local-test.toml --kind user --id openclub-rauthy-ci@example.invalid --field password --format raw)"
          [[ "$client_after" == "$OPENCLUB_OIDC_CLIENT_SECRET" && "$user_after" == "$OPENCLUB_RAUTHY_E2E_USER_PASSWORD" ]] ||
            { echo 'Synthetic Rauthy credentials changed on restart' >&2; exit 1; }
          echo 'Rauthy keys and credentials persisted across restart; browser acceptance follows.'
      - name: Recover disposable Rauthy identity from an independent volume archive
        shell: bash
        run: |
          set -euo pipefail
          overlay=(docker compose -f compose.yaml -f compose.rauthy.eval.yaml)
          # Only ever delete the synthetic Rauthy volume belonging to this CI job.
          container="$("${overlay[@]}" ps -q rauthy)"
          [[ -n "$container" ]] || { echo 'Synthetic Rauthy container missing' >&2; exit 1; }
          volume="$(docker inspect "$container" --format '{{range .Mounts}}{{if eq .Destination "/app/data"}}{{.Name}}{{end}}{{end}}')"
          [[ "$volume" == "${COMPOSE_PROJECT_NAME}_rauthy_eval_data" ]] ||
            { echo 'Refusing to restore unexpected identity volume' >&2; exit 1; }
          before="$(curl --fail --silent --insecure --max-time 5 https://localhost:8443/auth/v1/oidc/certs | jq -cS . | sha256sum | cut -d' ' -f1)"
          "${overlay[@]}" stop rauthy >/dev/null
          # An offline backup of a fully stopped provider prevents torn Hiqlite state.
          # The archive stays on this disposable runner, never in CI artifacts.
          docker run --rm -v "$volume:/source:ro" -v "$RUNNER_TEMP:/backup" alpine:3.21 \
            tar -C /source -cf /backup/rauthy-identity-backup.tar .
          test -s "$RUNNER_TEMP/rauthy-identity-backup.tar"
          "${overlay[@]}" rm -f rauthy >/dev/null
          docker volume rm "$volume" >/dev/null
          docker volume create "$volume" >/dev/null
          docker run --rm -v "$volume:/restore" -v "$RUNNER_TEMP:/backup:ro" alpine:3.21 \
            tar -C /restore -xf /backup/rauthy-identity-backup.tar
          "${overlay[@]}" up -d --no-deps rauthy >/dev/null
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent --insecure --max-time 3 \
              https://localhost:8443/.well-known/openid-configuration -o /dev/null 2>/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          [[ "$ready" == true ]] || { echo 'Restored provider did not become ready' >&2; exit 1; }
          after="$(curl --fail --silent --insecure --max-time 5 https://localhost:8443/auth/v1/oidc/certs | jq -cS . | sha256sum | cut -d' ' -f1)"
          [[ "$before" == "$after" ]] || { echo 'Signing identity changed after restore' >&2; exit 1; }
          client="$("${overlay[@]}" exec -T rauthy /app/rauthy bootstrap get \
            -c /app/config-local-test.toml --kind client --id openclub-rauthy-https-ci --field secret --format raw)"
          user="$("${overlay[@]}" exec -T rauthy /app/rauthy bootstrap get \
            -c /app/config-local-test.toml --kind user --id openclub-rauthy-ci@example.invalid --field password --format raw)"
          [[ "$client" == "$OPENCLUB_OIDC_CLIENT_SECRET" && "$user" == "$OPENCLUB_RAUTHY_E2E_USER_PASSWORD" ]] ||
            { echo 'Synthetic client or user identity changed after restore' >&2; exit 1; }
          rm -f "$RUNNER_TEMP/rauthy-identity-backup.tar"
          echo 'Offline archive restored to a fresh volume; real browser logins follow.'
      - name: Trust only the disposable Rauthy HTTPS certificate for the JVM
        shell: bash
        run: |
          set -euo pipefail
          # The application TLS client is not insecure: import only this
          # generated loopback certificate into a fresh throwaway truststore.
          openssl s_client -connect localhost:8443 -servername localhost </dev/null 2>/dev/null |
            openssl x509 -out "$RUNNER_TEMP/rauthy-local.pem"
          keytool -importcert -noprompt -alias rauthy-local -file "$RUNNER_TEMP/rauthy-local.pem" \
            -keystore "$RUNNER_TEMP/rauthy-local.p12" -storepass disposable-local-truststore
          echo "JAVA_TOOL_OPTIONS=-Djavax.net.ssl.trustStore=$RUNNER_TEMP/rauthy-local.p12 -Djavax.net.ssl.trustStorePassword=disposable-local-truststore" >> "$GITHUB_ENV"
      - name: Build and start Ktor with real TLS-verified Rauthy OIDC
        shell: bash
        working-directory: apps/api
        run: |
          set -euo pipefail
          ./gradlew installDist --no-daemon
          nohup build/install/openclub-api/bin/openclub-api > "$RUNNER_TEMP/rauthy-api.log" 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS --max-time 2 http://localhost:8080/health -o /dev/null; then exit 0; fi
            sleep 2
          done
          # Do not dump complete logs: a callback or authentication error
          # can contain tokens. Only show generic startup error categories.
          grep -Ei 'Exception|Error|Caused by|PKIX|SSLHandshake|OIDC|issuer|certificate' \
            "$RUNNER_TEMP/rauthy-api.log" |
            sed -E 's/(password|secret|token)[=:][^ ]+/[REDACTED]/Ig' |
            tail -n 15 >&2 || true
          echo 'Rauthy-configured Ktor app did not start' >&2
          exit 1
      - name: Start local HTTPS frontend reverse proxy
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/rauthy-caddyfile" <<'CADDY'
          https://localhost:5443 {
            tls internal
            reverse_proxy 127.0.0.1:5173
          }
          CADDY
          docker run -d --name openclub-rauthy-local-tls --network host \
            -v "$RUNNER_TEMP/rauthy-caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.9-alpine
      - name: Start real React web frontend
        working-directory: apps/web
        shell: bash
        env:
          API_PROXY_TARGET: http://127.0.0.1:8080
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          nohup pnpm dev --host 127.0.0.1 > "$RUNNER_TEMP/rauthy-web.log" 2>&1 &
          for attempt in {1..45}; do
            if curl -kfsS --max-time 3 https://localhost:5443/api/health -o /dev/null; then exit 0; fi
            sleep 2
          done
          echo 'Local HTTPS frontend not ready' >&2
          exit 1
      - name: Verify full Rauthy login and unauthorised club access in Chromium
        working-directory: dev/auth-e2e
        shell: bash
        run: |
          set -euo pipefail
          # An earlier step installs the same pinned browser/dependencies in
          # parallel with backend startup. No tests run until it completed.
          for attempt in {1..180}; do
            [[ -f "$RUNNER_TEMP/openclub-browser-setup.status" ]] && break
            sleep 1
          done
          if [[ "$(cat "$RUNNER_TEMP/openclub-browser-setup.status" 2>/dev/null || true)" != success ]]; then
            echo "Chromium install failed or timed out" >&2
            tail -n 25 "$RUNNER_TEMP/openclub-browser-setup.log" >&2 || true
            exit 1
          fi
          pnpm exec playwright test --config rauthy.playwright.config.js
      - name: Verify provider outage cannot create an OpenClub session
        shell: bash
        run: |
          set -euo pipefail
          overlay=(docker compose -f compose.yaml -f compose.rauthy.eval.yaml)
          "${overlay[@]}" stop rauthy >/dev/null
          # The OpenClub process must remain healthy despite the absent
          # issuer. New authentication cannot complete without the provider.
          curl --fail --silent --show-error --max-time 3 http://localhost:8080/health -o /dev/null
          if curl --silent --insecure --max-time 2 \
            https://localhost:8443/.well-known/openid-configuration -o /dev/null; then
            echo 'Rauthy is unexpectedly available after stop' >&2
            exit 1
          fi
          origin=https://localhost:5443
          status="$(curl --silent --insecure --max-time 3 -o /dev/null -w '%{http_code}' "$origin/api/v1/auth/me")"
          [[ "$status" == 401 ]] || { echo 'Unauthenticated session created during outage' >&2; exit 1; }
          # A login may generate a redirect transaction even while the issuer
          # is offline; that must never by itself produce a valid app session.
          headers="$(curl --silent --insecure --max-time 3 -D - -o /dev/null "$origin/api/v1/auth/login")"
          redirect="$(printf '%s\n' "$headers" | tr -d '\r' | sed -n -E 's/^[Ll]ocation: (.*)$/\1/p' | head -n 1)"
          [[ "$headers" == *" 302 "* && "$redirect" == https://localhost:8443/auth/v1/* ]] ||
            { echo 'Unexpected OIDC authorization redirect during outage' >&2; exit 1; }
          if curl --silent --insecure --max-time 2 "$redirect" -o /dev/null; then
            echo 'Unexpectedly reached stopped identity provider' >&2
            exit 1
          fi
          status="$(curl --silent --insecure --max-time 3 -o /dev/null -w '%{http_code}' "$origin/api/v1/auth/me")"
          [[ "$status" == 401 ]] || { echo 'Offline issuer granted an OpenClub session' >&2; exit 1; }
          echo 'During issuer outage the app stays healthy and rejects new sessions.'
      # Never upload browser traces, storage states, API logs, certificates or
      # Rauthy first-boot logs: they may contain authentication material.
      - name: Clean up local HTTPS proxy and disposable identity stack
        if: always()
        shell: bash
        run: |
          docker rm -f openclub-rauthy-local-tls 2>/dev/null || true
          docker compose -f compose.yaml -f compose.rauthy.eval.yaml down
