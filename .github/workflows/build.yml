name: Build and test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: openclub
          POSTGRES_USER: openclub
          POSTGRES_PASSWORD: openclub_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openclub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Kotlin API tests (PostgreSQL service)
        working-directory: apps/api
        env:
          DB_URL: jdbc:postgresql://localhost:5432/openclub
          DB_USER: openclub
          DB_PASSWORD: openclub_dev
        run: gradle test --no-daemon

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.24.0'
      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --no-frozen-lockfile
      - name: Frontend tests
        working-directory: apps/web
        run: pnpm test
      - name: Frontend production build
        working-directory: apps/web
        run: pnpm build
