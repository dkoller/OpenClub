name: Build and test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OpenAPI validator
        run: python -m pip install openapi-spec-validator==0.7.2
      - name: Validate OpenAPI YAML contracts
        shell: bash
        run: |
          set -euo pipefail
          for contract in docs/contracts/*.yaml; do
            openapi-spec-validator "$contract"
          done

  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.detect.outputs.api }}
      web: ${{ steps.detect.outputs.web }}
      compose: ${{ steps.detect.outputs.compose }}
    steps:
      - name: Classify pull request files
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          api=false; web=false; compose=false
          if [[ "$EVENT" != pull_request ]]; then
            api=true; web=true; compose=true
          else
            changed="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename')"
            if [[ -z "$changed" ]]; then
              api=true; web=true; compose=true
            fi
            while IFS= read -r file; do
              [[ -z "$file" ]] && continue
              case "$file" in
                # Docs-only changes should not rebuild the application.
                docs/contracts/*) api=true; web=true ;;
                docs/*|README.md|AGENTS.md|apps/api/AGENTS.md|apps/web/AGENTS.md|.github/pull_request_template.md|.github/workflows/pr-size.yml) ;;
                apps/api/*)
                  api=true
                  [[ "$file" == apps/api/Dockerfile || "$file" == apps/api/.dockerignore ]] && compose=true
                  ;;
                apps/web/*)
                  web=true
                  [[ "$file" == apps/web/Dockerfile || "$file" == apps/web/.dockerignore || "$file" == apps/web/nginx.conf ]] && compose=true
                  ;;
                compose.yaml|compose.dev.yaml|.github/workflows/compose-smoke.yml) compose=true ;;
                .github/workflows/build.yml) api=true; web=true ;;
                # Unknown paths run everything rather than silently missing coverage.
                *) api=true; web=true; compose=true ;;
              esac
            done <<< "$changed"
          fi
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "compose=$compose" >> "$GITHUB_OUTPUT"
          echo "Run selected: api=$api web=$web compose=$compose"

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: openclub
          POSTGRES_USER: openclub
          POSTGRES_PASSWORD: openclub_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openclub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin tests and jOOQ generation (PostgreSQL service)
        working-directory: apps/api
        env:
          DB_URL: jdbc:postgresql://localhost:5432/openclub
          DB_USER: openclub
          DB_PASSWORD: openclub_dev
        run: ./gradlew test generateJooq --no-daemon

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.24.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Frontend tests
        working-directory: apps/web
        run: pnpm test
      - name: Frontend production build
        working-directory: apps/web
        run: pnpm build
