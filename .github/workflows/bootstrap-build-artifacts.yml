name: Bootstrap pinned build artifacts (one-shot)
on:
  push:
    branches: [chore/reproducible-builds]
    paths: [.github/workflows/bootstrap-build-artifacts.yml]
permissions:
  contents: write
jobs:
  generate:
    if: github.repository == 'dkoller/OpenClub'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Generate Gradle wrapper
        working-directory: apps/api
        run: |
          gradle wrapper --gradle-version 9.7.0 --distribution-type bin --no-daemon
          ./gradlew --version
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.24.0'
      - name: Generate pnpm lockfile
        working-directory: apps/web
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit generated artifacts and remove bootstrap workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/bootstrap-build-artifacts.yml
          git add apps/api/gradlew apps/api/gradlew.bat apps/api/gradle/wrapper/gradle-wrapper.properties apps/web/pnpm-lock.yaml
          git add -f apps/api/gradle/wrapper/gradle-wrapper.jar
          git add -u .github/workflows/bootstrap-build-artifacts.yml
          git diff --cached --stat
          git commit -m 'chore: check in verified Gradle wrapper and pnpm lockfile'
          git push
