name: PR size limit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changed-lines:
    runs-on: ubuntu-latest
    steps:
      - name: Count additions and deletions in the full PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Query GitHub's changed-files API (all pages) rather than checking out PR code.
          # All text additions and deletions count except the dedicated root loopcounter marker.
          lines="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[] | select(.filename | test("^loopcounter[0-9]+\\.txt$") | not) | (.additions + .deletions)' |
            awk '{ total += $1 } END { print total + 0 }')"
          echo "PR changed lines (additions + deletions): ${lines}"
          if (( lines >= 1000 )); then
            echo "::error::PR size ${lines} is not below 1,000. Split into smaller, independently reviewable PRs."
            exit 1
          fi
          echo "PR size check passed (${lines}/999)."
