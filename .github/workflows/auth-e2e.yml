name: Keycloak browser authentication
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/api/**'
      - '!apps/api/src/test/**'
      - '!apps/api/AGENTS.md'
      - 'dev/auth-e2e/**'
      - '!dev/auth-e2e/rauthy-*'
      - 'apps/web/src/**'
      - '!apps/web/src/**/*.test.ts'
      - 'apps/web/vite.config.ts'
      - 'apps/web/package.json'
      - 'apps/web/pnpm-lock.yaml'
      - 'dev/keycloak/**'
      - '.github/workflows/auth-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '!apps/api/src/test/**'
      - '!apps/api/AGENTS.md'
      - 'dev/auth-e2e/**'
      - '!dev/auth-e2e/rauthy-*'
      - 'apps/web/src/**'
      - '!apps/web/src/**/*.test.ts'
      - 'apps/web/vite.config.ts'
      - 'apps/web/package.json'
      - 'apps/web/pnpm-lock.yaml'
      - 'dev/keycloak/**'
      - '.github/workflows/auth-e2e.yml'
permissions:
  contents: read
concurrency:
  group: auth-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: openclub-auth-e2e
      OPENCLUB_E2E_DISPOSABLE: 'true'
      KEYCLOAK_DEV_ADMIN_PASSWORD: ci-only-disposable-admin-password
      DB_URL: jdbc:postgresql://localhost:5432/openclub
      DB_USER: openclub
      DB_PASSWORD: openclub_dev
      OPENCLUB_AUTH_MODE: development
      OPENCLUB_PUBLIC_ORIGIN: http://localhost:5173
      OPENCLUB_OIDC_ISSUER: http://localhost:8180/realms/openclub-dev
      OPENCLUB_OIDC_AUTHORIZATION_ENDPOINT: http://localhost:8180/realms/openclub-dev/protocol/openid-connect/auth
      OPENCLUB_OIDC_CLIENT_ID: openclub-bff
      OPENCLUB_OIDC_REDIRECT_URI: http://localhost:5173/api/v1/auth/callback
      PORT: '8080'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.24.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The real browser install took ~34s in Keycloak #287. Run it while
      # the independent provider and JVM start, but require success before tests.
      - name: Prepare Playwright Chromium alongside provider startup
        shell: bash
        run: |
          set -euo pipefail
          nohup bash -c '
            if bash dev/auth-e2e/install-chromium.sh; then
              echo success > "$1"
            else
              echo failed > "$1"
            fi
          ' _ "$RUNNER_TEMP/openclub-browser-setup.status" \
            > "$RUNNER_TEMP/openclub-browser-setup.log" 2>&1 < /dev/null &
      - name: Start disposable PostgreSQL and Keycloak
        run: |
          set -euo pipefail
          docker compose -f compose.yaml -f compose.auth.dev.yaml up -d postgres keycloak
          for attempt in {1..90}; do
            if curl -fsS --max-time 3 "$OPENCLUB_OIDC_ISSUER/.well-known/openid-configuration" -o /dev/null 2>/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo 'Keycloak readiness timed out' >&2
          exit 1
      - name: Generate ephemeral fixtures
        run: |
          set -euo pipefail
          client_secret="$(openssl rand -hex 32)"
          user_password="$(openssl rand -hex 32)"
          echo "::add-mask::$client_secret"
          echo "::add-mask::$user_password"
          export OPENCLUB_E2E_CLIENT_SECRET="$client_secret"
          export OPENCLUB_E2E_USER_PASSWORD="$user_password"
          bash dev/keycloak/provision-test-fixtures.sh
          echo "OPENCLUB_OIDC_CLIENT_SECRET=$client_secret" >> "$GITHUB_ENV"
          echo "OPENCLUB_E2E_USER_PASSWORD=$user_password" >> "$GITHUB_ENV"
      - name: Build API behind the fixture callback origin
        working-directory: apps/api
        run: |
          set -euo pipefail
          ./gradlew installDist --no-daemon
          nohup build/install/openclub-api/bin/openclub-api > "$RUNNER_TEMP/auth-api.log" 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS --max-time 2 http://localhost:8080/health -o /dev/null; then exit 0; fi
            sleep 2
          done
          echo 'API readiness timed out' >&2
          exit 1
      - name: Start real frontend and test proxied API
        working-directory: apps/web
        env:
          API_PROXY_TARGET: http://127.0.0.1:8080
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          nohup pnpm dev --host 127.0.0.1 > "$RUNNER_TEMP/web.log" 2>&1 &
          for attempt in {1..45}; do
            if curl -fsS --max-time 2 http://localhost:5173/api/health -o /dev/null; then exit 0; fi
            sleep 2
          done
          echo 'Vite proxy readiness timed out' >&2
          exit 1
      - name: Install Chromium and run real browser journey
        working-directory: dev/auth-e2e
        run: |
          set -euo pipefail
          # An earlier step installs the same pinned browser/dependencies in
          # parallel with backend startup. No tests run until it completed.
          for attempt in {1..420}; do
            [[ -f "$RUNNER_TEMP/openclub-browser-setup.status" ]] && break
            sleep 1
          done
          if [[ "$(cat "$RUNNER_TEMP/openclub-browser-setup.status" 2>/dev/null || true)" != success ]]; then
            echo "Chromium install failed or timed out" >&2
            tail -n 60 "$RUNNER_TEMP/openclub-browser-setup.log" >&2 || true
            exit 1
          fi
          pnpm test
      # No traces, screenshots, storage states or server logs are uploaded:
      # callback URLs and HTTP diagnostics can contain authentication material.
      - name: Stop disposable stack (preserve volumes)
        if: always()
        run: docker compose -f compose.yaml -f compose.auth.dev.yaml down
