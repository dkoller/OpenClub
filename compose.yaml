services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: openclub
      POSTGRES_USER: openclub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openclub_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openclub -d openclub"]
      interval: 3s
      retries: 20
  api:
    build: ./apps/api
    environment:
      PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/openclub
      DB_USER: openclub
      DB_PASSWORD: ${POSTGRES_PASSWORD:-openclub_dev}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      retries: 20
      start_period: 30s
  web:
    build: ./apps/web
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
