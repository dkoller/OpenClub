services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: openclub
      POSTGRES_USER: openclub
      POSTGRES_PASSWORD: openclub_dev
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openclub"]
      interval: 3s
      retries: 15
